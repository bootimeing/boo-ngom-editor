<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>补丁管理</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--vscode-foreground);
      background: var(--vscode-sideBar-background);
      font: 13px/1.45 var(--vscode-font-family);
      letter-spacing: 0;
    }
    button {
      font: inherit;
      color: var(--vscode-button-foreground);
      background: var(--vscode-button-background);
      border: 1px solid transparent;
      border-radius: 3px;
      cursor: pointer;
    }
    button:hover { background: var(--vscode-button-hoverBackground); }
    button:focus-visible {
      outline: 1px solid var(--vscode-focusBorder);
      outline-offset: 1px;
    }
    button:disabled { cursor: default; opacity: .55; }
    .warning {
      padding: 9px 12px;
      color: var(--vscode-editorWarning-foreground);
      background: var(--vscode-textBlockQuote-background);
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .controls {
      display: grid;
      gap: 7px;
      padding: 10px 10px 9px;
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .picker {
      width: 100%;
      min-height: 44px;
      padding: 5px 8px;
      color: var(--vscode-foreground);
      background: var(--vscode-input-background);
      border-color: var(--vscode-input-border, transparent);
      text-align: left;
      overflow: hidden;
    }
    .picker:hover { background: var(--vscode-list-hoverBackground); }
    .picker-label {
      display: block;
      color: var(--vscode-foreground);
      font-weight: 600;
    }
    .picker-path {
      display: block;
      margin-top: 2px;
      color: var(--vscode-descriptionForeground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .field {
      display: grid;
      gap: 4px;
      padding: 6px 8px;
      color: var(--vscode-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 3px;
    }
    .field-label { font-weight: 600; }
    .field input {
      width: 100%;
      height: 28px;
      padding: 3px 6px;
      color: var(--vscode-input-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, transparent);
      border-radius: 2px;
      font: inherit;
    }
    .field input:focus { outline: 1px solid var(--vscode-focusBorder); }
    .field-status {
      min-height: 17px;
      color: var(--vscode-descriptionForeground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .field-status.error { color: var(--vscode-errorForeground); }
    .read-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .read-button { min-height: 32px; padding: 3px 5px; font-weight: 600; }
    .summary {
      display: none;
      padding: 7px 10px;
      color: var(--vscode-descriptionForeground);
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
    }
    .summary.visible { display: block; }
    .summary-line { display: flex; justify-content: space-between; gap: 8px; }
    .progress-track {
      height: 2px;
      margin-top: 6px;
      overflow: hidden;
      background: var(--vscode-progressBar-background);
      opacity: .25;
    }
    .busy .progress-track { opacity: 1; }
    .progress-value {
      width: 35%;
      height: 100%;
      background: var(--vscode-progressBar-background);
      transform: translateX(-120%);
    }
    .busy .progress-value { animation: loading 1.2s ease-in-out infinite; }
    @keyframes loading {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      padding: 5px 10px;
      color: var(--vscode-sideBarSectionHeader-foreground);
      background: var(--vscode-sideBarSectionHeader-background);
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      font-weight: 600;
    }
    .count { color: var(--vscode-descriptionForeground); font-weight: 400; }
    .empty {
      padding: 20px 12px;
      color: var(--vscode-descriptionForeground);
      text-align: center;
    }
    .pak-row {
      min-height: 50px;
      padding: 8px 8px 8px 10px;
      border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .pak-row:hover { background: var(--vscode-list-hoverBackground); }
    .pak-row.selected {
      color: var(--vscode-list-activeSelectionForeground);
      background: var(--vscode-list-activeSelectionBackground);
      outline: 1px solid var(--vscode-focusBorder);
      outline-offset: -1px;
    }
    .pak-row.password-error {
      color: var(--vscode-inputValidation-errorForeground, var(--vscode-errorForeground));
      background: var(--vscode-inputValidation-errorBackground);
      border-color: var(--vscode-inputValidation-errorBorder);
    }
    .pak-row.error:not(.selected) { color: var(--vscode-errorForeground); }
    .row-main {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
    }
    .pak-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }
    .row-actions {
      display: flex;
      flex: none;
      align-items: center;
      gap: 4px;
    }
    .inline-error { margin-right: 2px; font-size: 12px; font-weight: 600; }
    .action {
      min-width: 42px;
      height: 28px;
      padding: 2px 6px;
      color: var(--vscode-button-secondaryForeground);
      background: var(--vscode-button-secondaryBackground);
    }
    .action:hover { background: var(--vscode-button-secondaryHoverBackground); }
    .row-status {
      margin-top: 2px;
      color: var(--vscode-descriptionForeground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }
    .pak-row.password-error .row-status,
    .pak-row.error .row-status { color: inherit; }
    .entry-progress {
      height: 2px;
      margin-top: 4px;
      background: rgba(127, 127, 127, .2);
    }
    .entry-progress > span {
      display: block;
      height: 100%;
      background: var(--vscode-progressBar-background);
    }
  </style>
</head>
<body>
  <div class="warning">首次读取会建立资源索引，大型客户端可能耗时较长；完成前请勿关闭 VS Code。</div>
  <section class="controls">
    <button id="selectClient" class="picker" type="button">
      <span class="picker-label">选择客户端目录</span>
      <span id="clientPath" class="picker-path">未选择</span>
    </button>
    <label class="field" for="customPatchName">
      <span class="field-label">自定义补丁文件夹</span>
      <input id="customPatchName" list="customPatchCandidates" type="text" autocomplete="off" spellcheck="false" placeholder="输入客户端内的文件夹名">
      <datalist id="customPatchCandidates"></datalist>
      <span id="customPatchStatus" class="field-status"></span>
    </label>
    <button id="selectPasswordFile" class="picker" type="button">
      <span class="picker-label">选择 PAK/JPK 密码文件（可选）</span>
      <span id="passwordPath" class="picker-path">未选择，WIL/WZL 可直接读取</span>
    </button>
    <div class="read-actions">
      <button id="readRequiredPatches" class="read-button" type="button">读取需求资源包</button>
      <button id="readAllPatches" class="read-button" type="button">读取所有资源包</button>
    </div>
  </section>
  <section id="summary" class="summary">
    <div class="summary-line">
      <span id="summaryText"></span>
      <span id="summaryResult"></span>
    </div>
    <div class="progress-track"><div class="progress-value"></div></div>
  </section>
  <div class="list-header">
    <span id="archiveListLabel">资源包列表</span>
    <span id="pakCount" class="count">0</span>
  </div>
  <div id="pakList"><div class="empty">尚未读取补丁</div></div>

  <script>
    const vscode = acquireVsCodeApi();
    let state = {
      clientDirectory: '',
      customPatchName: '',
      customPatchCandidates: [],
      customPatchError: '',
      resourceSummary: '',
      passwordFile: '',
      entries: [],
      busy: false,
      archiveLabel: '资源包'
    };
    let selectedPath = (vscode.getState() || {}).selectedPath || '';

    const clientPath = document.getElementById('clientPath');
    const customPatchName = document.getElementById('customPatchName');
    const customPatchCandidates = document.getElementById('customPatchCandidates');
    const customPatchStatus = document.getElementById('customPatchStatus');
    const passwordPath = document.getElementById('passwordPath');
    const selectClient = document.getElementById('selectClient');
    const selectPasswordFile = document.getElementById('selectPasswordFile');
    const readRequiredPatches = document.getElementById('readRequiredPatches');
    const readAllPatches = document.getElementById('readAllPatches');
    const summary = document.getElementById('summary');
    const summaryText = document.getElementById('summaryText');
    const summaryResult = document.getElementById('summaryResult');
    const pakCount = document.getElementById('pakCount');
    const pakList = document.getElementById('pakList');
    const archiveListLabel = document.getElementById('archiveListLabel');

    selectClient.addEventListener('click', () => vscode.postMessage({ type: 'selectClientDirectory' }));
    customPatchName.addEventListener('change', commitCustomPatchName);
    customPatchName.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      customPatchName.blur();
      commitCustomPatchName();
    });
    selectPasswordFile.addEventListener('click', () => vscode.postMessage({ type: 'selectPasswordFile' }));
    readRequiredPatches.addEventListener('click', () => vscode.postMessage({ type: 'readRequiredPatches' }));
    readAllPatches.addEventListener('click', () => vscode.postMessage({ type: 'readAllPatches' }));

    pakList.addEventListener('pointerdown', event => {
      if (event.button !== 0 || event.target.closest('button[data-action]')) return;
      const row = event.target.closest('.pak-row');
      if (row) selectPakRow(row);
    });

    pakList.addEventListener('click', event => {
      const action = event.target.closest('button[data-action]');
      const row = event.target.closest('.pak-row');
      if (!row) return;
      const pakPath = row.dataset.path;
      if (action) {
        event.stopPropagation();
        vscode.postMessage({ type: action.dataset.action, path: pakPath });
        return;
      }
      selectPakRow(row);
    });

    pakList.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const row = event.target.closest('.pak-row');
      if (!row || event.target.closest('button[data-action]')) return;
      event.preventDefault();
      selectPakRow(row);
    });

    function selectPakRow(row) {
      const pakPath = row.dataset.path;
      if (!pakPath || selectedPath === pakPath) return;
      selectedPath = pakPath;
      vscode.setState({ selectedPath });
      renderList();
    }

    window.addEventListener('message', event => {
      const message = event.data || {};
      if (message.type === 'state') {
        state = {
          clientDirectory: message.clientDirectory || '',
          customPatchName: message.customPatchName || '',
          customPatchCandidates: Array.isArray(message.customPatchCandidates) ? message.customPatchCandidates : [],
          customPatchError: message.customPatchError || '',
          resourceSummary: message.resourceSummary || '',
          passwordFile: message.passwordFile || '',
          entries: Array.isArray(message.entries) ? message.entries : [],
          busy: !!message.busy,
          archiveLabel: message.archiveLabel || '资源包',
        };
        if (selectedPath && !state.entries.some(entry => entry.path === selectedPath)) selectedPath = '';
        render();
      } else if (message.type === 'entryUpdate' && message.entry) {
        const index = state.entries.findIndex(entry => entry.path === message.entry.path);
        if (index >= 0) state.entries[index] = message.entry;
        state.busy = !!message.busy;
        render();
      }
    });

    function render() {
      clientPath.textContent = state.clientDirectory || '未选择';
      clientPath.title = state.clientDirectory || '';
      if (document.activeElement !== customPatchName) customPatchName.value = state.customPatchName;
      customPatchCandidates.innerHTML = state.customPatchCandidates
        .map(name => `<option value="${escapeAttribute(name)}"></option>`)
        .join('');
      customPatchStatus.textContent = state.customPatchError || state.resourceSummary;
      customPatchStatus.title = customPatchStatus.textContent;
      customPatchStatus.classList.toggle('error', !!state.customPatchError);
      passwordPath.textContent = state.passwordFile || '未选择，WIL/WZL 可直接读取';
      passwordPath.title = state.passwordFile || '';
      selectClient.disabled = state.busy;
      customPatchName.disabled = state.busy || !state.clientDirectory;
      selectPasswordFile.disabled = state.busy;
      readRequiredPatches.disabled = state.busy;
      readAllPatches.disabled = state.busy;
      readRequiredPatches.textContent = `读取需求 ${state.archiveLabel}`;
      readAllPatches.textContent = `读取所有 ${state.archiveLabel}`;
      archiveListLabel.textContent = `${state.archiveLabel} 列表`;
      pakCount.textContent = String(state.entries.length);
      const cached = state.entries.filter(entry => entry.status === 'cached').length;
      const failed = state.entries.filter(entry => entry.status === 'password-error' || entry.status === 'error').length;
      summary.classList.toggle('visible', state.entries.length > 0);
      summary.classList.toggle('busy', state.busy);
      summaryText.textContent = state.busy ? '正在准备资源' : '资源状态';
      summaryResult.textContent = state.entries.length ? `${cached}/${state.entries.length}${failed ? `，失败 ${failed}` : ''}` : '';
      renderList();
    }

    function renderList() {
      if (state.entries.length === 0) {
        pakList.innerHTML = '<div class="empty">尚未读取补丁</div>';
        return;
      }
      pakList.innerHTML = state.entries.map(entry => {
        const selected = entry.path === selectedPath;
        const statusClass = entry.status === 'password-error' ? ' password-error'
          : entry.status === 'error' ? ' error' : '';
        const actions = selected ? `
          <span class="row-actions">
            ${entry.status === 'password-error' ? '<span class="inline-error">密码错误</span>' : ''}
            <button class="action" type="button" data-action="reloadPak" ${state.busy ? 'disabled' : ''}>重载</button>
            ${entry.passwordRequired === false ? '' : `<button class="action" type="button" data-action="changePassword" ${state.busy ? 'disabled' : ''}>密码</button>`}
          </span>` : '';
        const progress = entry.status === 'caching'
          ? `<div class="entry-progress"><span style="width:${Number(entry.progress) || 0}%"></span></div>`
          : '';
        return `<div class="pak-row${selected ? ' selected' : ''}${statusClass}" data-path="${escapeAttribute(entry.path)}" role="button" tabindex="0" aria-expanded="${selected}">
          <div class="row-main">
            <span class="pak-name" title="${escapeAttribute(entry.name)}">${escapeHtml(entry.name)}</span>
            ${actions}
          </div>
          <div class="row-status" title="${escapeAttribute(entry.message || '')}">${escapeHtml(entry.message || '')}</div>
          ${progress}
        </div>`;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function commitCustomPatchName() {
      const value = customPatchName.value.trim();
      if (value === state.customPatchName) return;
      vscode.postMessage({ type: 'setCustomPatchName', value });
    }

    vscode.postMessage({ type: 'ready' });
  </script>
</body>
</html>
