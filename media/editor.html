                        pendingElements.push({ type:'equipFrame', src:quickImports.equipFrame.url, data:{ x:parseInt(eqMatch[2]), y:parseInt(eqMatch[3]), name:'装备框', isEquipFrame:true, equipItemName:'物品名字' } });
                    } else {
                        var r = renderTextToCanvas('[装备框]', 247);
                        pendingElements.push({ type:'equipFrame', src:r.canvas.toDataURL(), data:{ x:parseInt(eqMatch[2]), y:parseInt(eqMatch[3]), w:r.width, h:r.height, name:'装备框', isEquipFrame:true, equipItemName:'物品名字' } });
                    }
                    continue;
                }
            }

            // 关闭按钮
            if (hasCloseBtn && quickImports.closeBtn) {
                pendingElements.push({ type:'closeBtn', src:quickImports.closeBtn.url, data:{ x:closeBtnX, y:closeBtnY, name:'关闭按钮', isCloseBtn:true } });
            }

            if (pendingElements.length === 0) {
                elements = oldElements; // 解析失败时恢复原状
                return;
            }

            // 异步加载
            var totalCount = pendingElements.length;
            var loadedCount = 0;
            var loadedElements = new Array(totalCount);

            pendingElements.forEach(function(item, idx) {
                if (item.type === 'effect') {
                    var startIdx = item.startIdx, frameCount = item.frameCount;
                    var loadedFrames = [], fLoaded = 0;
                    var startAsset = folderAssets[startIdx];
                    for (var f = 0; f < frameCount; f++) {
                        var frameAsset = getEffectFrameAsset(startAsset, startIdx, f);
                        if (frameAsset) {
                            (function(offset, fa) {
                                var fi2 = new Image();
                                fi2.onload = function() { loadedFrames[offset]=fi2; fLoaded++; if(fLoaded>=frameCount) finEf(); };
                                fi2.onerror = function() { fLoaded++; if(fLoaded>=frameCount) finEf(); };
                                fi2.src = fa.url;
                            })(f, frameAsset);
                        } else { fLoaded++; if(fLoaded>=frameCount) finEf(); }
                    }
                    function finEf() {
                        var fi = loadedFrames.find(function(x){return !!x;});
                        if (fi) {
                            fillMissingEffectFrames(loadedFrames, frameCount, fi.width, fi.height);
                            loadedElements[idx] = { img:fi, x:item.data.x, y:item.data.y, w:fi.width, h:fi.height, name:item.data.name, isEffect:true, willIdx:item.data.willIdx, effectStartIdx:item.data.effectStartIdx, effectFrameCount:frameCount, effectSpeed:item.data.effectSpeed, effectFrames:loadedFrames, effectCurrentFrame:0, effectLastTime:Date.now() };
                        }
                        loadedCount++; if(loadedCount>=totalCount) finSync();
                    }
                } else if (item.type === 'button') {
                    var di=new Image(), hi=new Image(), ci=new Image(), bl=0;
                    function cb(){ bl++; if(bl>=3){ loadedElements[idx]={ img:di, x:item.data.x, y:item.data.y, w:di.width||50, h:di.height||20, name:item.data.name, isButton:true, willIdx:item.data.willIdx, buttonImages:item.data.buttonImages, buttonScript:item.data.buttonScript, buttonImgs:{default:di,hover:hi,click:ci}, buttonState:'default', originalW:di.width||50, originalH:di.height||20 }; loadedCount++; if(loadedCount>=totalCount) finSync(); } }
                    di.onload=cb; hi.onload=cb; ci.onload=cb; di.onerror=cb; hi.onerror=cb; ci.onerror=cb;
                    di.src=item.src; hi.src=item.hoverSrc||item.src; ci.src=item.clickSrc||item.src;
                } else if (item.type === 'placeholder') {
                    // 无素材占位图
                    var phW = item.data.w || 800, phH = item.data.h || 600;
                    var phCanvas = document.createElement('canvas');
                    phCanvas.width = phW; phCanvas.height = phH;
                    var phCtx = phCanvas.getContext('2d');
                    phCtx.fillStyle = '#13182b';
                    phCtx.fillRect(0, 0, phW, phH);
                    phCtx.strokeStyle = '#00d4ff';
                    phCtx.setLineDash([10, 5]);
                    phCtx.lineWidth = 2;
                    phCtx.strokeRect(4, 4, phW-8, phH-8);
                    phCtx.setLineDash([]);
                    phCtx.fillStyle = '#64748b';
                    phCtx.font = '14px "Microsoft YaHei"';
                    phCtx.textAlign = 'center';
                    phCtx.fillText(item.data.name, phW/2, phH/2-10);
                    phCtx.fillText('请通过工具栏打开素材文件夹', phW/2, phH/2+16);
                    var phImg = new Image();
                    phImg.onload = function() {
                        var d = { img:phImg, x:item.data.x, y:item.data.y, w:phW, h:phH, name:item.data.name, isImgTag:true, assetIdx:item.data.assetIdx, isDialogBg:true, isPlaceholder:true, originalW:phW, originalH:phH };
                        loadedElements[idx] = d;
                        loadedCount++; if(loadedCount>=totalCount) finSync();
                    };
                    phImg.onerror = function() { loadedCount++; if(loadedCount>=totalCount) finSync(); };
                    phImg.src = phCanvas.toDataURL();
                } else {
                    var img = new Image();
                    img.onload = function() {
                        var d = { img:img, x:item.data.x, y:item.data.y, w:item.data.w||img.width||50, h:item.data.h||img.height||50, name:item.data.name };
                        var keys = ['isText','textContent','textColor','textScript','textFont','textSize','textBold','isImgTag','assetIdx','isCountdown','countdownSeconds','countdownColor','isInputText','isInputNum','inputId','inputWidth','inputHeight','inputBgColor','inputBorderColor','inputTextColor','inputMinLen','inputMaxLen','inputMinVal','inputMaxVal','inputErrorMsg','inputPlaceholder','inputPlaceholderColor','isCloseBtn','isEquipFrame','equipItemName','isProgressBar','isDialogBg','willIdx','progressBarOffsetX','progressBarOffsetY','progressBarBgIdx','progressBarFillIdx'];
                        keys.forEach(function(k){ if(item.data[k]!==undefined) d[k]=item.data[k]; });
                        if (d.isImgTag||d.isCloseBtn||d.isEquipFrame||d.isProgressBar) { d.originalW=img.width; d.originalH=img.height; d.w=img.width; d.h=img.height; }
                        loadedElements[idx] = d;
                        loadedCount++; if(loadedCount>=totalCount) finSync();
                    };
                    img.onerror = function() { loadedCount++; if(loadedCount>=totalCount) finSync(); };
                    img.src = item.src;
                }
            });

            function finSync() {
                elements = [];
                for (var i = 0; i < loadedElements.length; i++) {
                    if (loadedElements[i]) elements.push(loadedElements[i]);
                }
                // 设置画布大小：优先用首个图片元素，否则用元素包围盒
                var canvasSet = false;
                for (var i = 0; i < elements.length; i++) {
                    if (!elements[i].isText && !elements[i].isCountdown && !elements[i].isInputText && !elements[i].isInputNum) {
                        canvasW = elements[i].originalW || elements[i].w;
                        canvasH = elements[i].originalH || elements[i].h;
                        canvas.width = canvasW;
                        canvas.height = canvasH;
                        zoom = 1;
                        updateCanvasSize();
                        canvasSet = true;
                        break;
                    }
                }
                if (!canvasSet && elements.length > 0) {
                    var maxX = 0, maxY = 0;
                    for (var i = 0; i < elements.length; i++) {
                        var r = elements[i].x + (elements[i].w || 0);
                        var b = elements[i].y + (elements[i].h || 0);
                        if (r > maxX) maxX = r;
                        if (b > maxY) maxY = b;
                    }
                    canvasW = Math.max(800, maxX + 60);
                    canvasH = Math.max(600, maxY + 60);
                    canvas.width = canvasW;
                    canvas.height = canvasH;
                    zoom = 1;
                    updateCanvasSize();
                }
                var hasEffect = elements.some(function(el){ return el.isEffect; });
                if (hasEffect) startEffectAnimation();
                selectedIdx = -1;
                updatePropsPanel();
                // 直接绘制，不调用redraw避免触发反向同步
                ctx.clearRect(0, 0, canvasW, canvasH);
                ctx.save();
                ctx.scale(zoom, zoom);
                elements.forEach(function(el) { if(el.visible!==false) ctx.drawImage(el.img, el.x, el.y, el.w, el.h); });
                ctx.restore();
            }
        }

        // 绑定 textarea 的 input 事件实现代码→画布同步
        (function() {
            var codeOutput = document.getElementById('codeOutput');
            if (codeOutput) {
                codeOutput.addEventListener('input', function() {
                    syncCodeToCanvas();
                });
            }
            var willInput = document.getElementById('willIndex');
            if (willInput) {
                willInput.addEventListener('input', function() {
                    syncCanvasToCode();
                });
            }
        })();

        // ==================== 代码区拖拽移动 & 缩放 ====================
        (function() {
            var codeArea = document.getElementById('codeArea');
            var titlebar = document.getElementById('codeTitlebar');
            if (!codeArea || !titlebar) return;

            // 获取相对父元素的坐标
            function getRelativePos() {
                var rect = codeArea.getBoundingClientRect();
                var pr = codeArea.parentElement.getBoundingClientRect();
                return { left: rect.left - pr.left, top: rect.top - pr.top };
            }

            // --- 拖拽移动 ---
            var isDragging = false, dragStartX, dragStartY, areaStartL, areaStartT;
            titlebar.addEventListener('mousedown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                var pos = getRelativePos();
                areaStartL = pos.left;
                areaStartT = pos.top;
                codeArea.style.right = 'auto';
                codeArea.style.left = areaStartL + 'px';
                codeArea.style.top = areaStartT + 'px';
                e.preventDefault();
            });
            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                var dx = e.clientX - dragStartX;
                var dy = e.clientY - dragStartY;
                var newL = areaStartL + dx;
                var newT = areaStartT + dy;
                var pr = codeArea.parentElement;
                var aw = codeArea.offsetWidth, ah = codeArea.offsetHeight;
                newL = Math.max(0, Math.min(newL, pr.clientWidth - aw));
                newT = Math.max(0, Math.min(newT, pr.clientHeight - ah));
                codeArea.style.left = newL + 'px';
                codeArea.style.top = newT + 'px';
            });
            document.addEventListener('mouseup', function() {
                isDragging = false;
            });

            // --- 四方向缩放 ---
            var isResizing = false, resizeDir, rsStartX, rsStartY, rsStartW, rsStartH, rsStartL, rsStartT;
            var handles = codeArea.querySelectorAll('.resize-handle');
            for (var i = 0; i < handles.length; i++) {
                handles[i].addEventListener('mousedown', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    isResizing = true;
                    resizeDir = this.getAttribute('data-dir');
                    rsStartX = e.clientX;
                    rsStartY = e.clientY;
                    var pos = getRelativePos();
                    rsStartW = codeArea.offsetWidth;
                    rsStartH = codeArea.offsetHeight;
                    rsStartL = pos.left;
                    rsStartT = pos.top;
                    codeArea.style.right = 'auto';
                    codeArea.style.left = rsStartL + 'px';
                    codeArea.style.top = rsStartT + 'px';
                });
            }
            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                var dx = e.clientX - rsStartX;
                var dy = e.clientY - rsStartY;
                var minW = 180, minH = 120;
                var newW = rsStartW, newH = rsStartH, newL = rsStartL, newT = rsStartT;

                if (resizeDir.indexOf('e') >= 0) newW = Math.max(minW, rsStartW + dx);
                if (resizeDir.indexOf('w') >= 0) { newW = Math.max(minW, rsStartW - dx); newL = rsStartL + rsStartW - newW; }
                if (resizeDir.indexOf('s') >= 0) newH = Math.max(minH, rsStartH + dy);
                if (resizeDir.indexOf('n') >= 0) { newH = Math.max(minH, rsStartH - dy); newT = rsStartT + rsStartH - newH; }

                codeArea.style.width = newW + 'px';
                codeArea.style.height = newH + 'px';
                codeArea.style.left = newL + 'px';
                codeArea.style.top = newT + 'px';
            });
            document.addEventListener('mouseup', function() {
                isResizing = false;
            });
        })();

        // 初始化时请求历史数据
        if (_vscode) {
            _vscode.postMessage({ type: 'getHistory' });
            _vscode.postMessage({ type: 'getQuickImports' });
            _vscode.postMessage({ type: 'getDefaultMaterials' });
            _vscode.postMessage({ type: 'getEnginePref' });
        }

        // ==================== 浮动画布 ====================
        function toggleFloatCanvas() {
            if (_vscode) {
                _vscode.postMessage({ type: 'openFloatCanvas' });
            }
        }

        // 序列化元素（去掉img对象，保留_imgSrc用于重建）
        function serializeElement(el) {
            var s = {};
            for (var key in el) {
                if (el.hasOwnProperty(key) && key !== 'img' && key !== 'effectFrames' && key !== 'buttonImgs' && typeof el[key] !== 'function') {
                    s[key] = el[key];
                }
            }
            if (el.img && el.img.src) {
                s._imgSrc = el.img.src;
            }
            return s;
        }

        var _applyingRemote = false;

        // 反序列化并应用到当前画布
        function deserializeAndApplyElements(arr) {
            _applyingRemote = true;
            var newElements = [];
            for (var i = 0; i < arr.length; i++) {
                var s = arr[i];
                var el = {};
                for (var key in s) {
                    if (s.hasOwnProperty(key) && key !== '_imgSrc') {
                        el[key] = s[key];
                    }
                }
                // 重建img对象
                if (el.isText && typeof renderTextToCanvas === 'function') {
                    var result = renderTextToCanvas(el.textContent || '文字', el.textColor, el.textScript || '', el.textFont || '宋体', el.textSize || 12, el.textBold || false);
                    el.img = new Image();
                    el.img.src = result.canvas.toDataURL();
                } else if (s._imgSrc) {
                    el.img = new Image();
                    el.img.src = s._imgSrc;
                } else {
                    el.img = new Image();
                }
                newElements.push(el);
            }
            elements = newElements;
            selectedIdx = elements.length > 0 ? 0 : -1;
            selectedIndices = [];
            redraw();
            // 延迟重置 _applyingRemote，确保 debounce 的 syncCanvasToCode 被拦截
            setTimeout(function() { _applyingRemote = false; }, 500);
        }

        // 浮动画布模式下，元素改动时同步到主面板
        var _floatOrigSyncCanvasToCode = syncCanvasToCode;
        syncCanvasToCode = function() {
            _floatOrigSyncCanvasToCode();
            if (window._floatMode && _vscode && !_applyingRemote) {
                _vscode.postMessage({
                    type: 'syncElements',
                    elements: elements.map(serializeElement),
                    canvasW: canvasW,
                    canvasH: canvasH,
                    dialogConfig: dialogConfig
                });
            }
        };

        // 填充事件委托函数映射 — IIFE内普通function不在window上
        _actionFnMap = {
            requestOpenPakFiles: requestOpenPakFiles,
            requestOpenPakHistory: requestOpenPakHistory,
            requestReloadAssets: requestReloadAssets,
            switchVisiblePakTab: switchVisiblePakTab, requestClosePak: requestClosePak,
            requestClearCanvas: requestClearCanvas, addTextElement: addTextElement,
            showImageSelector: showImageSelector, showEffectSelector: showEffectSelector,
            showButtonSelector: showButtonSelector, showCountdownSelector: showCountdownSelector,
            addInputTextToCanvas: addInputTextToCanvas, addInputNumToCanvas: addInputNumToCanvas,
            toggleFloatCanvas: toggleFloatCanvas, toggleCodeArea: toggleCodeArea,
            unlinkFromEditor: unlinkFromEditor, selectCloseBtnFiles: selectCloseBtnFiles,
            callCloseBtnToCanvas: callCloseBtnToCanvas, selectEquipFrameFiles: selectEquipFrameFiles,
            callEquipFrameToCanvas: callEquipFrameToCanvas, selectProgressBarFiles: selectProgressBarFiles,
            callProgressBarToCanvas: callProgressBarToCanvas,
            deleteSelected: deleteSelected, selectElement: selectElement,
            deleteElement: deleteElement, closeColorPicker: closeColorPicker,
            confirmColorPick: confirmColorPick, previewColorCell: previewColorCell,
            closeImageSelector: closeImageSelector, selectImageForCanvas: selectImageForCanvas,
            closeButtonSelector: closeButtonSelector, selectButtonImage: selectButtonImage,
            activateButtonSlot: activateButtonSlot, resetButtonSlot: resetButtonSlot,
            confirmAddButton: confirmAddButton, closeCountdownSelector: closeCountdownSelector,
            confirmAddCountdown: confirmAddCountdown, closeEffectSelector: closeEffectSelector,
            selectEffectImage: selectEffectImage, confirmAddEffect: confirmAddEffect,
            showColorPicker: showColorPicker, pickColorCell: pickColorCell,
            addToCanvas: addToCanvas, addEffectToCanvas: addEffectToCanvas,
            addCountdownToCanvas: addCountdownToCanvas, addButtonToCanvas: addButtonToCanvas
        };

        // 导出内联事件处理器(onchange/ondblclick/ondragstart等)引用的函数和变量
        window.addToCanvas = addToCanvas;
        window.dragStart = dragStart;
        window.switchEngine = switchEngine;
        window.dialogConfig = dialogConfig;
        window.syncCanvasToCode = syncCanvasToCode;
        window.updateDialogConfig = updateDialogConfig;
        window.updateTextElement = updateTextElement;
        window.getColorCss = getColorCss;
        window.switchPakTab = switchPakTab;
        window.switchEngine = switchEngine;
        window.switchDialogPak = switchDialogPak;
        window.buildPakTabsHTML = buildPakTabsHTML;
        window.renderDialogGrid = renderDialogGrid;
        window.applyCloseBtnDefault = applyCloseBtnDefault;
        window.applyCloseBtnAsset = applyCloseBtnAsset;
        window.selectCloseBtnLocal = selectCloseBtnLocal;
        window.confirmCloseBtnSelection = confirmCloseBtnSelection;
        window.applyCloseBtnSelection = applyCloseBtnSelection;
        window.applyEquipFrameDefault = applyEquipFrameDefault;
        window.applyEquipFrameAsset = applyEquipFrameAsset;
        window.selectEquipFrameLocal = selectEquipFrameLocal;
        window.confirmEquipFrameSelection = confirmEquipFrameSelection;
        window.applyEquipFrameSelection = applyEquipFrameSelection;
        window.togglePropsPanel = togglePropsPanel;

        })();
    </script>
</body>
</html>
