        function importFilesToAssets(files, type) {
            var typeLabels = {
                'closeBtn': '关闭按钮',
                'equipFrame': '装备框',
                'progressBar': '进度条'
            };
            var label = typeLabels[type] || '文件';

            // 快捷导入类型（关闭按钮、装备框、进度条）
            if (type === 'closeBtn' || type === 'equipFrame' || type === 'progressBar') {
                // 只取第一个文件
                var file = files[0];
                if (file) {
                    var lower = file.name.toLowerCase();
                    if (lower.endsWith('.png') || lower.endsWith('.gif') ||
                        lower.endsWith('.bmp') || lower.endsWith('.jpg') || lower.endsWith('.jpeg')) {

                        var url = URL.createObjectURL(file);
                        _blobUrls.push(url);
                        quickImports[type] = {
                            name: file.name,
                            url: url,
                            file: file
                        };
                        updateQuickImportSlot(type);
                        showToast('✅ ' + label + '已导入: ' + file.name);
                    }
                }
            }
        }

        // 更新快捷导入槽位显示
        // 从元数据恢复进度条双图URL（按名称匹配_defaultMaterials或folderAssets）
        function resolveProgressBarMeta(meta) {
            var resolved = {};
            ['bg', 'fill'].forEach(function(sub) {
                var item = meta[sub];
                if (!item || !item.name) return;
                if (item.url) {
                    resolved[sub] = Object.assign({}, item);
                    return;
                }
                // 尝试匹配默认素材
                for (var di = 0; di < _defaultMaterials.length; di++) {
                    if ((_defaultMaterials[di].filePath && _defaultMaterials[di].filePath === item.filePath) ||
                        _defaultMaterials[di].name === item.name) {
                        resolved[sub] = Object.assign({}, item, { name: _defaultMaterials[di].name, url: _defaultMaterials[di].url, filePath: _defaultMaterials[di].filePath || item.filePath || '' });
                        return;
                    }
                }
                // 尝试匹配PAK素材
                for (var ai = 0; ai < folderAssets.length; ai++) {
                    var asset = folderAssets[ai];
                    var pathMatch = item.filePath && asset.path === item.filePath;
                    var codeMatch = item.imageIdx !== undefined && item.willIdx !== undefined &&
                        Number(asset.willIdx) === Number(item.willIdx) && getAssetImageIndex(asset, ai) === Number(item.imageIdx);
                    var pakMatch = item.imageIdx !== undefined && item.pakName && asset.pakName === item.pakName &&
                        getAssetImageIndex(asset, ai) === Number(item.imageIdx);
                    if (pathMatch || codeMatch || pakMatch || (item.assetIdx === ai && asset.name === item.name)) {
                        resolved[sub] = Object.assign({}, item, { name: asset.name, url: asset.url, filePath: asset.path || item.filePath || '' });
                        return;
                    }
                }
                // 未匹配：仅存名称
                resolved[sub] = Object.assign({}, item, { url: '' });
            });
            if (resolved.bg || resolved.fill) {
                var pbData2 = {
                    bg: resolved.bg || { name: '', url: '' },
                    fill: resolved.fill || { name: '', url: '' },
                    offsetX: meta.offsetX || 0,
                    offsetY: meta.offsetY || 0
                };
                if (meta.willIdx !== undefined) pbData2.willIdx = meta.willIdx;
                quickImports['progressBar'] = pbData2;
            }
        }
        // 当默认素材/PAK素材后加载时，重新解析进度条元数据
        function reResolveProgressBarIfNeeded() {
            var pb = quickImports.progressBar;
            if (!pb || !pb.bg) return;
            // 已有URL则跳过
            if (pb.bg.url && pb.fill && pb.fill.url) return;
            resolveProgressBarMeta(pb);
        }

        function updateQuickImportSlot(type) {
            var slotMap = {
                'closeBtn': { slot: 'closeBtnSlot', preview: 'closeBtnPreview', callBtn: 'closeBtnCall', wrapper: 'closeBtnWrapper' },
                'equipFrame': { slot: 'equipFrameSlot', preview: 'equipFramePreview', callBtn: 'equipFrameCall', wrapper: 'equipFrameWrapper' },
                'progressBar': { slot: 'progressBarSlot', preview: 'progressBarPreview', callBtn: 'progressBarCall', wrapper: 'progressBarWrapper' }
            };

            var config = slotMap[type];
            if (!config) return;

            var slot = document.getElementById(config.slot);
            var preview = document.getElementById(config.preview);
            var callBtn = document.getElementById(config.callBtn);
            var wrapper = document.getElementById(config.wrapper);
            var data = quickImports[type];

            // 进度条使用嵌套结构 {bg:{name,url}, fill:{name,url}}，侧边栏显示合并预览
            if (type === 'progressBar') {
                reResolveProgressBarIfNeeded();
                data = quickImports[type];
                var hasBg = data && data.bg && data.bg.url;
                var hasFill = data && data.fill && data.fill.url;
                if (hasBg) {
                    slot.classList.add('has-content');
                    if (callBtn) callBtn.style.display = 'block';
                    if (wrapper) wrapper.style.display = 'block';
                    if (hasFill) {
                        // 合并预览：小画布合成bg+fill
                        var slotCanvas = document.createElement('canvas');
                        slotCanvas.style.width = '100%'; slotCanvas.style.height = '100%';
                        slotCanvas.style.objectFit = 'contain';
                        var bgImg2 = new Image();
                        bgImg2.onload = function() {
                            var fillImg2 = new Image();
                            fillImg2.onload = function() {
                                slotCanvas.width = bgImg2.width;
                                slotCanvas.height = bgImg2.height;
                                var sctx = slotCanvas.getContext('2d');
                                sctx.drawImage(bgImg2, 0, 0);
                                sctx.globalAlpha = 0.85;
                                sctx.drawImage(fillImg2, data.offsetX || 0, data.offsetY || 0);
                                sctx.globalAlpha = 1;
                            };
                            fillImg2.src = data.fill.url;
                        };
                        bgImg2.src = data.bg.url;
                        preview.innerHTML = '';
                        preview.appendChild(slotCanvas);
                    } else {
                        preview.innerHTML = '<img src="' + data.bg.url + '" alt="' + (data.bg.name||'') + '">';
                    }
                } else {
                    slot.classList.remove('has-content');
                    preview.innerHTML = '点击导入';
                    if (callBtn) callBtn.style.display = 'none';
                }
                return;
            }

            // 无用户缓存时查默认素材
            if (!data || !data.url) {
                var keyword = type === 'closeBtn' ? '关闭按钮' : (type === 'equipFrame' ? '装备框' : '进度条');
                for (var di2 = 0; di2 < _defaultMaterials.length; di2++) {
                    if (_defaultMaterials[di2].desc.indexOf(keyword) >= 0) { data = _defaultMaterials[di2]; break; }
                }
            }
            if (data && data.url) {
                slot.classList.add('has-content');
                if (data.url) {
                    preview.innerHTML = '<img src="' + data.url + '" alt="' + (data.name||'') + '">';
                    if (callBtn) callBtn.style.display = 'block';
                }
                if (wrapper) wrapper.style.display = 'block';
            } else {
                slot.classList.remove('has-content');
                preview.innerHTML = '点击导入';
                if (callBtn) callBtn.style.display = 'none';
            }
        }

        // 检查是否已添加对话框
        function hasDialogInCanvas() {
            // 检查是否有任意图片元素（首个图片元素即为对话框背景）
            for (var i = 0; i < elements.length; i++) {
                if (!elements[i].isText && !elements[i].isButton &&
                    !elements[i].isCloseBtn && !elements[i].isEquipFrame && !elements[i].isProgressBar) {
                    return true;
                }
            }
            return false;
        }

        // 获取对话框元素
        function getDialogElement() {
            for (var i = 0; i < elements.length; i++) {
                if (elements[i].isImgTag && elements[i].isDialog) {
                    return elements[i];
                }
            }
            return null;
        }

        // 调用关闭按钮到画布
        function callCloseBtnToCanvas(event) {
            event.stopPropagation();
            if (!quickImports.closeBtn) {
                showToast('⚠️ 请先导入关闭按钮图片');
                return;
            }
            if (!hasDialogInCanvas()) {
                showToast('⚠️ 请先调用对话框');
                return;
            }
            // 每个对话框仅限一个关闭按钮
            for (var i = 0; i < elements.length; i++) {
                if (elements[i].isCloseBtn) {
                    showToast('⚠️ 当前对话框已有关闭按钮，无法重复调用');
                    return;
                }
            }

            var data = quickImports.closeBtn;
            var img = new Image();
            img.onload = function() {
                // 默认放在对话框右上角偏移位置
                var dialog = getDialogElement();
                var x = dialog ? (dialog.w - img.width - 10) : 10;
                var y = dialog ? 10 : 10;

                elements.push({
                    img: img,
                    x: x,
                    y: y,
                    w: img.width,
                    h: img.height,
                    name: '关闭按钮: ' + data.name,
                    originalW: img.width,
                    originalH: img.height,
                    isCloseBtn: true,
                    closeBtnX: x,
                    closeBtnY: y
                });
                selectedIdx = elements.length - 1;
                updatePropsPanel();
                redraw();
                showToast('✅ 关闭按钮已添加到画布');
            };
            img.src = data.url;
        }

        // 调用装备框到画布
        function callEquipFrameToCanvas(event) {
            event.stopPropagation();

                showToast('⚠️ 请先导入装备框图片');

            }
            if (!hasDialogInCanvas()) {
                showToast('⚠️ 请先调用对话框');

            }

            var data = quickImports.equipFrame;
            var img = new Image();
            img.onload = function() {

                var x = Math.round((canvasW - img.width) / 2);
                var y = Math.round((canvasH - img.height) / 2);

                elements.push({
                    img: img,
                    x: x,
                    y: y,

                    name: '装备框: ' + data.name,

                });

        // 调用进度条到画布
        function callProgressBarToCanvas(event) {
            event.stopPropagation();
            var pb = quickImports.progressBar;
            if (!pb || !pb.bg) {
                showToast('⚠️ 请先导入进度条图片（背景图+进度条图）');
                return;
            }
            if (!hasDialogInCanvas()) {
                showToast('⚠️ 请先调用对话框');
                return;
            }

            var offX = pb.offsetX || 0;
            var offY = pb.offsetY || 0;
            var fillUrl = (pb.fill && pb.fill.url) ? pb.fill.url : null;

            // 加载背景图
            var bgImg = new Image();
            bgImg.onload = function() {
                if (fillUrl) {
                    var fillImg = new Image();
                    fillImg.onload = function() {
                        compositeProgressBarToCanvas(bgImg, fillImg, offX, offY, function(composite) {
                        finishProgressBarCall(composite);
                    });
                    };
                    fillImg.onerror = function() { finishProgressBarCall(bgImg); };
                    fillImg.src = fillUrl;
                } else {
                    finishProgressBarCall(bgImg);
                }
            };
            bgImg.onerror = function() { showToast('⚠️ 背景图加载失败'); };
            bgImg.src = pb.bg.url;

            function finishProgressBarCall(img) {
                var x = Math.round((canvasW - img.width) / 2);
                var y = canvasH - img.height - 20;
                var elData = {
                    img: img,
                    x: x, y: y,
                    w: img.width, h: img.height,
                    name: '进度条: ' + pb.bg.name,
                    originalW: img.width, originalH: img.height,
                    isProgressBar: true,
                    progressBarOffsetX: offX,
                    progressBarOffsetY: offY,
                    progressBarBgIdx: (pb.bg.imageIdx !== undefined) ? pb.bg.imageIdx : extractImageIndex(pb.bg.name),
                    progressBarFillIdx: (pb.fill && pb.fill.imageIdx !== undefined) ? pb.fill.imageIdx : (pb.fill ? extractImageIndex(pb.fill.name) : 0)
                };
                // willIdx来自PAK素材固定序号
                if (pb.willIdx !== undefined) {
                    elData.willIdx = pb.willIdx;
                }
                elements.push(elData);
                selectedIdx = elements.length - 1;
                updatePropsPanel();
                redraw();
                showToast('✅ 进度条已添加到画布');
            }
        }

        // 将背景图和进度条图合成为一张图
        function compositeProgressBarToCanvas(bgImg, fillImg, offsetX, offsetY, callback) {
            var canvas = document.createElement('canvas');
            canvas.width = bgImg.width;
            canvas.height = bgImg.height;
            var ctx = canvas.getContext('2d');
            ctx.drawImage(bgImg, 0, 0);
            if (fillImg) {
                ctx.globalAlpha = 0.9;
                ctx.drawImage(fillImg, offsetX, offsetY);
                ctx.globalAlpha = 1;
            }
            var composite = new Image();
            composite.onload = function() { callback(composite); };
            composite.onerror = function() { callback(bgImg); };
            composite.src = canvas.toDataURL();
        }

        function extractImageIndex(name) {
            if (!name) return 0;
            var base = name.replace(/\.(png|gif|bmp|jpg|jpeg)$/i, '');
            var match = base.match(/(\d{3,8})/);
            return match ? parseInt(match[1], 10) : 0;
        }
        // 隐藏/显示右侧画布元素面板
        function togglePropsPanel() {
            var panel = document.getElementById('propsPanel');
            var resizer = document.getElementById('rightResizer');
            var btnShow = document.getElementById('btnShowPanel');
            var btnHide = document.getElementById('btnHidePanel');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                if (resizer) resizer.classList.remove('hidden');
                if (btnShow) btnShow.classList.remove('visible');
                if (btnHide) btnHide.innerHTML = '◀ 隐藏';
            } else {
                panel.classList.add('hidden');
                if (resizer) resizer.classList.add('hidden');
                if (btnShow) btnShow.classList.add('visible');
                if (btnHide) btnHide.innerHTML = '▶ 展开';
            }
        }
        function showToast(msg) {
            var toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg, rgba(15,23,42,0.95), rgba(26,26,46,0.95));border:1px solid rgba(0,212,255,0.4);color:#00d4ff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:9999;transition:all 0.4s ease;box-shadow:0 4px 15px rgba(0,212,255,0.2);backdrop-filter:blur(10px);';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
            }, 2200);
        }

        // 生成代码
        function generateCode() {
            if (!engCfg().supportsCodeGeneration) {
                showToast('当前引擎暂不支持 UI 代码生成');
                return;
            }
            // 同步 willIndex 到 dialogConfig
            var willIndexInput = document.getElementById('willIndex');
            if (willIndexInput && willIndexInput.value.trim()) {
                dialogConfig.willIndex = willIndexInput.value.trim();
            }
            var willIndex = dialogConfig.willIndex;
            if (!willIndex) {
                showToast('⚠️ 请先输入WIL文件序号');
                return;
            }
            if (elements.length === 0) {
                showToast('⚠️ 画布为空，无法生成代码');
                return;
            }

            var codes = [];
            var dialogCode = '';
            var firstImageIdx = -1;

            // 先找到首个图片元素索引
            for (var idx = 0; idx < elements.length; idx++) {
                if (elements[idx].isImgTag) {
                    firstImageIdx = idx;
                    break;
                }
            }

            var closeBtnX = 0, closeBtnY = 0;
            var hasCloseBtn = false;
            var equipFrameCount = 0;
            var equipFrameLines = []; // 存储装备框的 GetDBItemFieldValue 行

            // 先找到关闭按钮的坐标，并统计装备框数量
            elements.forEach(function(el) {
                if (el.isCloseBtn) {
                    closeBtnX = Math.round(el.x);
                    closeBtnY = Math.round(el.y);
                    hasCloseBtn = true;
                }
                if (el.isEquipFrame) {
                    equipFrameCount++;
                }
            });

            // 收集装备框的物品名字（按顺序）
            var equipFrameItemNames = [];
            elements.forEach(function(el) {
                if (el.isEquipFrame) {
                    equipFrameItemNames.push(el.equipItemName || '物品名字');
                }
            });

            // 生成装备框的 GetDBItemFieldValue 行
            for (var eqIdx = 1; eqIdx <= equipFrameCount; eqIdx++) {
                var varName = 'n$展示idx' + eqIdx;
                var itemName = equipFrameItemNames[eqIdx - 1] || '物品名字';
                equipFrameLines.push('GetDBItemFieldValue ' + itemName + ' idx ' + varName);
            }

            elements.forEach(function(el, i) {
                var x = Math.round(el.x);
                var y = Math.round(el.y);
                if (el.isText) {
                    // 文字格式: <&text:文字内容:x:y{fcolor=颜色代码;fbold=1;fsize=大小;fname=字体}/@触发脚本>
                    var color = el.textColor || 255;
                    var script = el.textScript || '';
                    var font = el.textFont || '宋体';
                    var size = el.textSize || 12;
                    var bold = el.textBold || false;

                    // 构建属性字符串
                    var props = [];
                    props.push('fcolor=' + color);
                    if (bold) props.push('fbold=1');
                    if (size !== 12) props.push('fsize=' + size);
                    if (font !== '宋体') props.push('fname=' + font);

                    var propStr = props.join(';');
                    // 文字坐标补偿：画布坐标与游戏实际坐标有偏移，x和y各加4
                    var textX = pad3(x + 4);
                    var textY = pad3(y + 4);
                    var code = '<&text:' + el.textContent + ':' + textX + ':' + textY + '{' + propStr + '}';
                    if (script.trim()) {
                        code += '/@' + script;
                    }
                    code += '>';
                    codes.push(code);
                } else if (el.isButton) {
                    // 按钮格式: <&imgex:will文件序号:默认:移入:点击:x:y/@触发脚本>
                    var btnIdxs = el.buttonImages || [0, 0, 0];
                    var btnScript = el.buttonScript || '按钮触发';
                    var sendId = el.buttonSendId || 0;
                    codes.push('<&imgex:' + ((el.willIdx !== undefined) ? el.willIdx : willIndex) + ':' + btnIdxs[0] + ':' + btnIdxs[1] + ':' + btnIdxs[2] + ':' + pad3(x) + ':' + pad3(y) + (sendId > 0 ? ':' + sendId : '') + '/@' + btnScript + '>');
                } else if (el.isCloseBtn) {
                    // 关闭按钮不生成独立代码，坐标已记录在 OPENMERCHANTBIGDLG 中
                } else if (el.isEquipFrame) {
                    // 装备框格式: <&itemshow:<$str(n$展示idxN)>:0:x:y:1>
                    // 找到这是第几个装备框
                    var eqNum = 0;
                    for (var eqCheck = 0; eqCheck <= i; eqCheck++) {
                        if (elements[eqCheck].isEquipFrame) eqNum++;
                    }
                    codes.push('<&itemshow:<$str(n$展示idx' + eqNum + ')>:0:' + pad3(x) + ':' + pad3(y) + ':1>');
                } else if (el.isProgressBar) {
                    // 进度条格式: <ProgressBar:X:Y:F:B:P:C:T:X2:Y2:N:X:V:D:L:X3:Y3:显示文字>
                    var pbBgIdx = (el.progressBarBgIdx !== undefined) ? el.progressBarBgIdx : 0;
                    var pbFillIdx = (el.progressBarFillIdx !== undefined) ? el.progressBarFillIdx : 0;
                    var pbOffX = 0, pbOffY = 0;
                    if (quickImports.progressBar) {
                        if (el.progressBarBgIdx === undefined && quickImports.progressBar.bg) pbBgIdx = (quickImports.progressBar.bg.imageIdx !== undefined) ? quickImports.progressBar.bg.imageIdx : extractImageIndex(quickImports.progressBar.bg.name);
                        if (el.progressBarFillIdx === undefined && quickImports.progressBar.fill) pbFillIdx = (quickImports.progressBar.fill.imageIdx !== undefined) ? quickImports.progressBar.fill.imageIdx : extractImageIndex(quickImports.progressBar.fill.name);
                        pbOffX = quickImports.progressBar.offsetX || 0;
                        pbOffY = quickImports.progressBar.offsetY || 0;
                    }
                    codes.push('<&ProgressBar:' + pad3(x) + ':' + pad3(y) + ':' + ((el.willIdx !== undefined) ? el.willIdx : willIndex) + ':' + pbBgIdx + ':' + pbFillIdx + ':1:1:' + pbOffX + ':' + pbOffY + ':0:100:50:0:250:0:0:%p/%m>');
                } else if (el.isCountdown) {
                    // 倒计时格式: <&COUNTDOWN:倒计时秒数:1:文字颜色(0-255):X:Y> (坐标+4偏移，与文字一致)
                    var seconds = el.countdownSeconds || 59;
                    var color = el.countdownColor || 255;
                    codes.push('<&COUNTDOWN:' + seconds + ':1:' + color + ':' + pad3(x + 4) + ':' + pad3(y + 4) + '>');
                } else if (el.isInputText) {
                    // 文本框格式: <&INPUTTEXT:输入框ID:X:Y:宽度:高度:背景色:边框色:文字颜色:最小长度:最大长度:数据无效时提示对话框内容:提示文字:提示文字颜色>
                    // 坐标补偿：与文字元素一致，x和y各加4
                    var id = el.inputId || 1;
                    var w = el.inputWidth || 120;
                    var h = el.inputHeight || 30;
                    var bg = el.inputBgColor || 0;
                    var border = el.inputBorderColor || 255;
                    var textColor = el.inputTextColor || 255;
                    var minLen = el.inputMinLen || 0;
                    var maxLen = el.inputMaxLen || 20;
                    var errMsg = el.inputErrorMsg || '输入无效';
                    var placeholder = el.inputPlaceholder || '请输入';
                    var phColor = el.inputPlaceholderColor || 128;
                    codes.push('<&INPUTTEXT:' + id + ':' + pad3(x + 4) + ':' + pad3(y + 4) + ':' + w + ':' + h + ':' + bg + ':' + border + ':' + textColor + ':' + minLen + ':' + maxLen + ':' + errMsg + ':' + placeholder + ':' + phColor + '>');
                } else if (el.isInputNum) {
                    // 数字框格式: <&INPUTNUM:输入框ID:X:Y:宽度:高度:背景色:边框色:文字颜色:最小值:最大值:数据无效时提示对话框内容:提示文字:提示文字颜色>
                    // 坐标补偿：与文字元素一致，x和y各加4
                    var id = el.inputId || 1;
                    var w = el.inputWidth || 100;
                    var h = el.inputHeight || 30;
                    var bg = el.inputBgColor || 0;
                    var border = el.inputBorderColor || 255;
                    var textColor = el.inputTextColor || 255;
                    var minVal = el.inputMinVal || 0;
                    var maxVal = el.inputMaxVal || 999999;
                    var errMsg = el.inputErrorMsg || '数字无效';
                    var placeholder = el.inputPlaceholder || '请输入数字';
                    var phColor = el.inputPlaceholderColor || 128;
                    codes.push('<&INPUTNUM:' + id + ':' + pad3(x + 4) + ':' + pad3(y + 4) + ':' + w + ':' + h + ':' + bg + ':' + border + ':' + textColor + ':' + minVal + ':' + maxVal + ':' + errMsg + ':' + placeholder + ':' + phColor + '>');
                } else if (el.isEffect) {
                    // 特效格式: <&PlayImg:will序号:特效开始图片序号:播放张数:播放速度:X:Y>
                    var startIdx = el.effectStartIdx || 0;
                    var frameCount = el.effectFrameCount || 8;
                    var speed = el.effectSpeed || 100;
                    codes.push('<&PlayImg:' + ((el.willIdx !== undefined) ? el.willIdx : willIndex) + ':' + startIdx + ':' + frameCount + ':' + speed + ':' + pad3(x) + ':' + pad3(y) + (currentEngine === 'lingfeng' ? ':0' : '') + '>');
                } else if (el.isImgTag) {
                    // <&img:图片序号:will序号:x:y> 格式
                    // 首个图片作为对话框背景
                    if (i === firstImageIdx) {
                        var imgIdx = (el.assetIdx !== undefined) ? el.assetIdx : i;
                        dialogConfig.imgIdx = imgIdx;
                        var equipLines = equipFrameLines.length > 0 ? equipFrameLines.join('\n') + '\n' : '';
                        var dlgSuffix = currentEngine === 'lingfeng' ? ' ' + dialogConfig.independentWin : '';
                        dialogCode = '[@Main]\n#if\n#act\n' + equipLines + 'OPENMERCHANTBIGDLG ' + willIndex + ' ' + imgIdx + ' ' +
                            dialogConfig.allowMove + ' ' + dialogConfig.position + ' ' + dialogConfig.offsetX + ' ' + dialogConfig.offsetY + ' ' +
                            dialogConfig.showCloseBtn + ' ' + dialogConfig.closeBtnX + ' ' + dialogConfig.closeBtnY + dlgSuffix + '\n#say';
                    } else {
                        var imgIdx = (el.assetIdx !== undefined) ? el.assetIdx : i;
                        var imgWill = (el.willIdx !== undefined) ? el.willIdx : willIndex;
                        codes.push('<&img:' + imgIdx + ':' + imgWill + ':' + pad3(x) + ':' + pad3(y) + '>');
                    }
                } else {
                    // 其他图片格式: <&imgex:序号:图片序号:x:y>
                    codes.push('<&imgex:' + ((el.willIdx !== undefined) ? el.willIdx : willIndex) + ':' + (i + 1) + ':' + pad3(x) + ':' + pad3(y) + '>');
                }
            });

            var codeText = '';
            if (dialogCode) {
                codeText = dialogCode + '\n' + codes.join('\n');
            } else {
                codeText = codes.join('\n');
            }
            var codeOutput = document.getElementById('codeOutput');
            if (codeOutput) codeOutput.value = codeText;
            showToast('✅ 代码生成成功');
        }

        // 解析代码并生成到画布
        function parseCodeToCanvas() {
            var codeOutput = document.getElementById('codeOutput');
            var codeText = codeOutput.value.trim();
            if (!codeText) {
                showToast('⚠️ 代码区为空');
                return;
            }

            // 清空画布
            elements = [];
            selectedIdx = -1;
            selectedIndices = [];

            var lines = codeText.split('\n');
            var willIndex = '';
            var hasDialog = false;
            var dialogImgIdx = -1;
            var closeBtnX = 0, closeBtnY = 0;
            var hasCloseBtn = false;

            // 第一遍：解析OPENMERCHANTBIGDLG获取全部对话框参数
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                var dlgMatch = line.match(/OPENMERCHANTBIGDLG\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\d-]+)\s+([\d-]+)\s+(\d+)\s+(\d+)\s+(\d+)(?:\s+(\d+))?/i);
                if (dlgMatch) {
                    dialogConfig.willIndex = willIndex = dlgMatch[1];
                    dialogConfig.imgIdx = dialogImgIdx = parseInt(dlgMatch[2]);
                    dialogConfig.allowMove = parseInt(dlgMatch[3]);
                    dialogConfig.position = parseInt(dlgMatch[4]);
                    dialogConfig.offsetX = parseInt(dlgMatch[5]);
                    dialogConfig.offsetY = parseInt(dlgMatch[6]);
                    dialogConfig.showCloseBtn = parseInt(dlgMatch[7]);
                    dialogConfig.closeBtnX = closeBtnX = parseInt(dlgMatch[8]);
                    dialogConfig.closeBtnY = closeBtnY = parseInt(dlgMatch[9]);
                    if (dlgMatch[10] !== undefined) dialogConfig.independentWin = parseInt(dlgMatch[10]);
                    hasDialog = true;
                    if (closeBtnX > 0 || closeBtnY > 0) hasCloseBtn = true;
                    break;
                }
            }

            // 如果没找到对话框代码，尝试从im gex或img中提取will序号
            if (!willIndex) {
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    var imgexMatch = line.match(/<&imgex:(\d+):/i);
                    var imgMatch = line.match(/<&img:\d+:(\d+):/i);
                    var playImgMatch = line.match(/<&PlayImg:(\d+):/i);
                    if (imgexMatch) { willIndex = imgexMatch[1]; break; }
                    else if (imgMatch) { willIndex = imgMatch[1]; break; }
                    else if (playImgMatch) { willIndex = playImgMatch[1]; break; }
                }
            }

            // 设置will序号到输入框
            if (willIndex) {
                document.getElementById('willIndex').value = willIndex;
            }

            // 收集所有待加载元素
            var pendingElements = [];

            // 如果有对话框，先添加对话框背景图片
            if (hasDialog && dialogImgIdx >= 0) {
                var dlgAsset = findAssetByCode(willIndex, dialogImgIdx);
                if (dlgAsset) {
                    pendingElements.push({
                        type: 'img',
                        src: dlgAsset.url,
                        data: {
                            x: 0, y: 0,
                            name: dlgAsset.name,
                            isImgTag: true,
                            assetIdx: dialogImgIdx,
                            willIdx: Number(willIndex),
                            isDialogBg: true
                        }
                    });
                } else {
                    pendingElements.push({
                        type: 'placeholder',
                        src: null,
                        data: {
                            x: 0, y: 0, w: 800, h: 600,
                            name: '对话框背景(wil:' + willIndex + ' idx:' + dialogImgIdx + ') 请加载素材',
                            isImgTag: true,
                            assetIdx: dialogImgIdx,
                            isDialogBg: true,
                            isPlaceholder: true
                        }
                    });
                }
            }

            // 第二遍：解析每行代码
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line || line.startsWith('#') || line.startsWith('[@') || line.startsWith('GetDBItemFieldValue') || line.indexOf('OPENMERCHANTBIGDLG') >= 0) continue;

                // === 解析文字 ===
                // 格式: <&text:内容:x:y{fcolor=颜色;fbold=1;fsize=大小;fname=字体}/@脚本>
                var textMatch = line.match(/<&text:([^:]+):(\d+):(\d+)\{([^}]*)\}(?:\/[@#]([^>]*))?>/i);
                if (textMatch) {
                    var text = textMatch[1];
                    var tx = parseInt(textMatch[2]) - 4; // 反向补偿
                    var ty = parseInt(textMatch[3]) - 4;
                    var propStr = textMatch[4];
                    var script = textMatch[5] || '';

                    // 解析属性
                    var color = 255, bold = false, size = 12, font = '宋体';
                    var propParts = propStr.split(';');
                    for (var p = 0; p < propParts.length; p++) {
                        var kv = propParts[p].split('=');
                        if (kv[0] === 'fcolor') color = parseInt(kv[1]) || 255;
                        else if (kv[0] === 'fbold') bold = kv[1] === '1';
                        else if (kv[0] === 'fsize') size = parseInt(kv[1]) || 12;
                        else if (kv[0] === 'fname') font = kv[1] || '宋体';
                    }

                    var result = renderTextToCanvas(text, color, script, font, size, bold);
                    pendingElements.push({
                        type: 'text',
                        src: result.canvas.toDataURL(),
                        data: {
                            x: tx, y: ty,
                            w: result.width, h: result.height,
                            name: '文字: ' + text,
                            isText: true,
                            textContent: text,
                            textColor: color,
                            textScript: script,
                            textFont: font,
                            textSize: size,
                            textBold: bold
                        }
                    });
                    continue;
                }

                // === 解析按钮 ===
                // 格式: <&imgex:will:默认:移入:点击:x:y[:发送序号]/@触发脚本>
                var btnMatch = line.match(/<&imgex:(\d+):(\d+):(\d+):(\d+):(\d+):(\d+)(?::(\d+))?\/[@#]([^>]*)>/i);
                if (btnMatch) {
                    var btnWillIdx = parseInt(btnMatch[1]);
                    var defaultIdx = parseInt(btnMatch[2]);
                    var hoverIdx = parseInt(btnMatch[3]);
                    var clickIdx = parseInt(btnMatch[4]);
                    var bx = parseInt(btnMatch[5]);
                    var by = parseInt(btnMatch[6]);
                    var btnSendId = parseInt(btnMatch[7]) || 0;
                    var btnScript = btnMatch[8] || '按钮触发';

                    var asset = findAssetByCode(btnWillIdx, defaultIdx);
                    var hoverAsset = findAssetByCode(btnWillIdx, hoverIdx) || asset;
                    var clickAsset = findAssetByCode(btnWillIdx, clickIdx) || asset;
                    if (asset) {
                        pendingElements.push({
                            type: 'button',
                            src: asset.url,
                            hoverSrc: hoverAsset.url,
                            clickSrc: clickAsset.url,
                            data: {
                                x: bx, y: by,
                                name: '按钮: ' + asset.name,
                                isButton: true,
                                willIdx: btnWillIdx,
                                buttonImages: [defaultIdx, hoverIdx, clickIdx],
                                buttonScript: btnScript,
                                buttonSendId: btnSendId,
                                buttonState: 'default'
                            }
                        });
                    }
                    continue;
                }

                // === 解析图片 ===
                // 格式: <&img:图片序号:will:x:y>
                var imgMatch = line.match(/<&img:(\d+):(\d+):(\d+):(\d+)>/i);
                if (imgMatch) {
                    var imgIdx = parseInt(imgMatch[1]);
                    var imgWillIdx = parseInt(imgMatch[2]);
                    var ix = parseInt(imgMatch[3]);
                    var iy = parseInt(imgMatch[4]);

                    var asset = findAssetByCode(imgWillIdx, imgIdx);
                    if (asset) {
                        pendingElements.push({
                            type: 'img',
                            src: asset.url,
                            data: {
                                x: ix, y: iy,
                                name: asset.name,
                                isImgTag: true,
                                assetIdx: imgIdx,
                                willIdx: imgWillIdx
                            }
                        });
                    }
                    continue;
                }

                // === 解析简单imgex图片（非button，2个索引格式） ===
                // 格式: <&imgex:will:图片序号:x:y>
                var imgexSimple = line.match(/<&imgex:(\d+):(\d+):(\d+):(\d+)>/i);
                if (imgexSimple) {
                    var simpleWillIdx = parseInt(imgexSimple[1]);
                    var iIdx = parseInt(imgexSimple[2]);
                    var iex = parseInt(imgexSimple[3]);
                    var iey = parseInt(imgexSimple[4]);

                    var asset = findAssetByCode(simpleWillIdx, iIdx);
                    if (asset) {
                        pendingElements.push({
                            type: 'img',
                            src: asset.url,
                            data: {
                                x: iex, y: iey,
                                name: asset.name,
                                isImgTag: true,
                                assetIdx: iIdx,
                                willIdx: simpleWillIdx
                            }
                        });
                    }
                    continue;
                }

                // === 解析倒计时 ===
                // 格式: <&COUNTDOWN:秒数:1:颜色:X:Y>
                var cdMatch = line.match(/<&COUNTDOWN:(\d+):(\d+):(\d+):(\d+):(\d+)>/i);
                if (cdMatch) {
                    var seconds = parseInt(cdMatch[1]);
                    var cdColor = parseInt(cdMatch[3]);
                    var cdX = parseInt(cdMatch[4]);
                    var cdY = parseInt(cdMatch[5]);

                    var hours = Math.floor(seconds / 3600);
                    var mins = Math.floor((seconds % 3600) / 60);
                    var secs = seconds % 60;
                    var timeStr = String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');

                    var result = renderTextToCanvas(timeStr, cdColor);
                    pendingElements.push({
                        type: 'countdown',
                        src: result.canvas.toDataURL(),
                        data: {
                            x: cdX, y: cdY,
                            w: result.width, h: result.height,
                            name: '倒计时: ' + timeStr,
                            isCountdown: true,
                            countdownSeconds: seconds,
                            countdownColor: cdColor
                        }
                    });
                    continue;
                }

                // === 解析文本框 ===
                // 格式: <&INPUTTEXT:ID:X:Y:宽:高:背景色:边框色:文字色:最小长度:最大长度:错误提示:提示文字:提示颜色>
                var inputTextMatch = line.match(/<&INPUTTEXT:(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):([^:]*):([^:]*):([^>]*)>/i);
                if (inputTextMatch) {
                    var itId = parseInt(inputTextMatch[1]);
                    var itX = parseInt(inputTextMatch[2]) - 4; // 反向补偿
                    var itY = parseInt(inputTextMatch[3]) - 4; // 反向补偿
                    var itW = parseInt(inputTextMatch[4]);
                    var itH = parseInt(inputTextMatch[5]);
                    var itBg = parseInt(inputTextMatch[6]);
                    var itBorder = parseInt(inputTextMatch[7]);
                    var itTextColor = parseInt(inputTextMatch[8]);
                    var itMinLen = parseInt(inputTextMatch[9]);
                    var itMaxLen = parseInt(inputTextMatch[10]);
                    var itErrMsg = inputTextMatch[11] || '输入无效';
                    var itPlaceholder = inputTextMatch[12] || '请输入';
                    var itPhColor = parseInt(inputTextMatch[13]) || 128;

                    var result = renderInputToCanvas(itW, itH, itBg, itBorder, itTextColor, itPlaceholder, itPhColor);
                    pendingElements.push({
                        type: 'inputText',
                        src: result.canvas.toDataURL(),
                        data: {
                            x: itX, y: itY,
                            w: itW, h: itH,
                            name: '文本框',
                            isInputText: true,
                            inputId: itId, inputWidth: itW, inputHeight: itH,
                            inputBgColor: itBg, inputBorderColor: itBorder, inputTextColor: itTextColor,
                            inputMinLen: itMinLen, inputMaxLen: itMaxLen,
                            inputErrorMsg: itErrMsg, inputPlaceholder: itPlaceholder, inputPlaceholderColor: itPhColor
                        }
                    });
                    continue;
                }

                // === 解析数字框 ===
                // 格式: <&INPUTNUM:ID:X:Y:宽:高:背景色:边框色:文字色:最小值:最大值:错误提示:提示文字:提示颜色>
                var inputNumMatch = line.match(/<&INPUTNUM:(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):(\d+):([^:]*):([^:]*):([^>]*)>/i);
                if (inputNumMatch) {
                    var inId = parseInt(inputNumMatch[1]);
                    var inX = parseInt(inputNumMatch[2]) - 4; // 反向补偿
                    var inY = parseInt(inputNumMatch[3]) - 4; // 反向补偿
                    var inW = parseInt(inputNumMatch[4]);
                    var inH = parseInt(inputNumMatch[5]);
                    var inBg = parseInt(inputNumMatch[6]);
                    var inBorder = parseInt(inputNumMatch[7]);
                    var inTextColor = parseInt(inputNumMatch[8]);
                    var inMinVal = parseInt(inputNumMatch[9]);
                    var inMaxVal = parseInt(inputNumMatch[10]);
                    var inErrMsg = inputNumMatch[11] || '数字无效';
                    var inPlaceholder = inputNumMatch[12] || '请输入数字';
                    var inPhColor = parseInt(inputNumMatch[13]) || 128;

                    var result = renderInputToCanvas(inW, inH, inBg, inBorder, inTextColor, inPlaceholder, inPhColor);
                    pendingElements.push({
                        type: 'inputNum',
                        src: result.canvas.toDataURL(),
                        data: {
                            x: inX, y: inY,
                            w: inW, h: inH,
                            name: '数字框',
                            isInputNum: true,
                            inputId: inId, inputWidth: inW, inputHeight: inH,
                            inputBgColor: inBg, inputBorderColor: inBorder, inputTextColor: inTextColor,
                            inputMinVal: inMinVal, inputMaxVal: inMaxVal,
                            inputErrorMsg: inErrMsg, inputPlaceholder: inPlaceholder, inputPlaceholderColor: inPhColor
                        }
                    });
                    continue;
                }

                // === 解析特效 ===
                // 格式: <&PlayImg:will:开始图片序号:播放张数:播放速度:X:Y>
                var effectMatch = line.match(/<&PlayImg:(\d+):(\d+):(\d+):(\d+):(\d+):(\d+)(?::(\d+))?>/i);
                if (effectMatch) {
                    var efWillIdx = parseInt(effectMatch[1]);
                    var efStartIdx = parseInt(effectMatch[2]);
                    var efFrameCount = parseInt(effectMatch[3]);
                    var efSpeed = parseInt(effectMatch[4]);
                    var efX = parseInt(effectMatch[5]);
                    var efY = parseInt(effectMatch[6]);

                    var efGlobalIdx = findAssetIndexByCode(efWillIdx, efStartIdx);
                    var asset = efGlobalIdx >= 0 ? folderAssets[efGlobalIdx] : null;
                    if (asset) {
                        pendingElements.push({
                            type: 'effect',
                            startIdx: efGlobalIdx,
                            frameCount: efFrameCount,
                            speed: efSpeed,
                            src: asset.url,
                            data: {
                                x: efX, y: efY,
                                name: '特效: ' + asset.name,
                                isEffect: true,
                                willIdx: efWillIdx,
                                effectStartIdx: efStartIdx,
                                effectFrameCount: efFrameCount,
                                effectSpeed: efSpeed
                            }
                        });
                    }
                    continue;
                }

                // === 解析进度条 ===
                // 完整格式: <&ProgressBar:X:Y:will:bg:fill:...:offsetX:offsetY:...>
                var pbMatch = line.match(/<&ProgressBar:(\d+):(\d+)(?::(\d+):(\d+):(\d+):\d+:\d+:([\d-]+):([\d-]+):[^>]*)?>/i);
                if (pbMatch) {
                    var pbX = parseInt(pbMatch[1]);
                    var pbY = parseInt(pbMatch[2]);
                    var pbUrl = null, pbFillUrl = null, pbOffX = 0, pbOffY = 0;
                    var pbWill = pbMatch[3] !== undefined ? parseInt(pbMatch[3]) : undefined;
                    var pbBgCodeIdx = pbMatch[4] !== undefined ? parseInt(pbMatch[4]) : undefined;
                    var pbFillCodeIdx = pbMatch[5] !== undefined ? parseInt(pbMatch[5]) : undefined;
                    if (pbWill !== undefined) {
                        var pbBgAsset = findAssetByCode(pbWill, pbBgCodeIdx);
                        var pbFillAsset = findAssetByCode(pbWill, pbFillCodeIdx);
                        if (pbBgAsset) pbUrl = pbBgAsset.url;
                        if (pbFillAsset) pbFillUrl = pbFillAsset.url;
                        pbOffX = parseInt(pbMatch[6]) || 0;
                        pbOffY = parseInt(pbMatch[7]) || 0;
                    } else if (quickImports.progressBar) {
                        if (quickImports.progressBar.bg) pbUrl = quickImports.progressBar.bg.url;
                        else if (quickImports.progressBar.url) pbUrl = quickImports.progressBar.url;
                        if (quickImports.progressBar.fill) pbFillUrl = quickImports.progressBar.fill.url;
                        pbOffX = quickImports.progressBar.offsetX || 0;
                        pbOffY = quickImports.progressBar.offsetY || 0;
                    }
                    if (pbUrl) {
                        pendingElements.push({
                            type: 'progressBar',
                            src: pbUrl,
                            fillUrl: pbFillUrl,
                            offsetX: pbOffX,
                            offsetY: pbOffY,
                            data: {
                                x: pbX, y: pbY,
                                name: '进度条',
                                isProgressBar: true,
                                willIdx: pbWill,
                                progressBarBgIdx: pbBgCodeIdx,
                                progressBarFillIdx: pbFillCodeIdx
                            }
                        });
                    } else {
                        // 没有导入进度条图片，用文字占位
                        var result = renderTextToCanvas('[ProgressBar]', 250);
                        pendingElements.push({
                            type: 'progressBar',
                            src: result.canvas.toDataURL(),
                            data: {
                                x: pbX, y: pbY,
                                w: result.width, h: result.height,
                                name: '进度条',
                                isProgressBar: true,
                                willIdx: pbWill,
                                progressBarBgIdx: pbBgCodeIdx,
                                progressBarFillIdx: pbFillCodeIdx
                            }
                        });
                    }
                    continue;
                }

                // === 解析装备框 ===
                // 格式: <&itemshow:<$str(n$展示idxN)>:0:x:y:1>
                var equipMatch = line.match(/<&itemshow:[^:]+:(\d+):(\d+):(\d+):(\d+)>/i);
                if (equipMatch) {
                    var eqX = parseInt(equipMatch[2]);
                    var eqY = parseInt(equipMatch[3]);

                    if (quickImports.equipFrame) {
                        pendingElements.push({
                            type: 'equipFrame',
                            src: quickImports.equipFrame.url,
                            data: {
                                x: eqX, y: eqY,
                                name: '装备框',
                                isEquipFrame: true,
                                equipItemName: '物品名字'
                            }
                        });
                    } else {
                        var result = renderTextToCanvas('[装备框]', 247);
                        pendingElements.push({
                            type: 'equipFrame',
                            src: result.canvas.toDataURL(),
                            data: {
                                x: eqX, y: eqY,
                                w: result.width, h: result.height,
                                name: '装备框',
                                isEquipFrame: true,
                                equipItemName: '物品名字'
                            }
                        });
                    }
                    continue;
                }
            }

            // 如果有关闭按钮坐标且有快捷导入的关闭按钮图片，添加关闭按钮
            if (hasCloseBtn && quickImports.closeBtn) {
                pendingElements.push({
                    type: 'closeBtn',
                    src: quickImports.closeBtn.url,
                    data: {
                        x: closeBtnX, y: closeBtnY,
                        name: '关闭按钮',
                        isCloseBtn: true
                    }
                });
            }

            if (pendingElements.length === 0) {
                showToast('⚠️ 未解析到有效代码（图片/按钮/特效等需要先加载素材）');
                return;
            }

            // 异步加载所有元素
            var totalCount = pendingElements.length;
            var loadedCount = 0;
            var loadedElements = new Array(totalCount); // 保持顺序

            pendingElements.forEach(function(item, idx) {
                if (item.type === 'effect') {
                    // 特效需要加载多帧
                    var startIdx = item.startIdx;
                    var frameCount = item.frameCount;
                    var loadedFrames = [];
                    var frameLoadedCount = 0;
                    var startAsset = folderAssets[startIdx];

                    for (var f = 0; f < frameCount; f++) {
                        var frameAsset = getEffectFrameAsset(startAsset, startIdx, f);
                        if (frameAsset) {
                            (function(offset, fAsset) {
                                var frameImg = new Image();
                                frameImg.onload = function() {
                                    loadedFrames[offset] = frameImg;
                                    frameLoadedCount++;
                                    if (frameLoadedCount >= frameCount) finishEffectLoad();
                                };
                                frameImg.onerror = function() {
                                    frameLoadedCount++;
                                    if (frameLoadedCount >= frameCount) finishEffectLoad();
                                };
                                frameImg.src = fAsset.url;
                            })(f, frameAsset);
                        } else {
                            frameLoadedCount++;
                            if (frameLoadedCount >= frameCount) finishEffectLoad();
                        }
                    }

                    function finishEffectLoad() {
                        var firstImg = loadedFrames.find(function(img) { return !!img; });
                        if (firstImg) {
                            fillMissingEffectFrames(loadedFrames, frameCount, firstImg.width, firstImg.height);
                            loadedElements[idx] = {
                                img: firstImg,
                                x: item.data.x, y: item.data.y,
                                w: firstImg.width, h: firstImg.height,
                                name: item.data.name,
                                isEffect: true,
                                willIdx: item.data.willIdx,
                                effectStartIdx: item.data.effectStartIdx,
                                effectFrameCount: frameCount,
                                effectSpeed: item.data.effectSpeed,
                                effectFrames: loadedFrames,
                                effectCurrentFrame: 0,
                                effectLastTime: Date.now()
                            };
                        }
                        loadedCount++;
                        if (loadedCount >= totalCount) finalizeParse();
                    }
                } else if (item.type === 'button') {
                    // 按钮需要加载3张图片
                    var defaultImg = new Image();
                    var hoverImg = new Image();
                    var clickImg = new Image();
                    var btnLoaded = 0;

                    function checkBtnLoaded() {
                        btnLoaded++;
                        if (btnLoaded >= 3) {
                            loadedElements[idx] = {
                                img: defaultImg,
                                x: item.data.x, y: item.data.y,
                                w: defaultImg.width || 50, h: defaultImg.height || 20,
                                name: item.data.name,
                                isButton: true,
                                willIdx: item.data.willIdx,
                                buttonImages: item.data.buttonImages,
                                buttonScript: item.data.buttonScript,
                                buttonImgs: { default: defaultImg, hover: hoverImg, click: clickImg },
                                buttonState: 'default',
                                originalW: defaultImg.width || 50,
                                originalH: defaultImg.height || 20
                            };
                            loadedCount++;
                            if (loadedCount >= totalCount) finalizeParse();
                        }
                    }

                    defaultImg.onload = checkBtnLoaded;
                    hoverImg.onload = checkBtnLoaded;
                    clickImg.onload = checkBtnLoaded;
                    defaultImg.onerror = checkBtnLoaded;
                    hoverImg.onerror = checkBtnLoaded;
                    clickImg.onerror = checkBtnLoaded;
                    defaultImg.src = item.src;
                    hoverImg.src = item.hoverSrc || item.src;
                    clickImg.src = item.clickSrc || item.src;
                } else if (item.type === 'placeholder') {
                    // 无素材占位图
                    var phW2 = item.data.w || 800, phH2 = item.data.h || 600;
                    var phCanvas2 = document.createElement('canvas');
                    phCanvas2.width = phW2; phCanvas2.height = phH2;
                    var phCtx2 = phCanvas2.getContext('2d');
                    phCtx2.fillStyle = '#13182b';
                    phCtx2.fillRect(0, 0, phW2, phH2);
                    phCtx2.strokeStyle = '#00d4ff';
                    phCtx2.setLineDash([10, 5]);
                    phCtx2.lineWidth = 2;
                    phCtx2.strokeRect(4, 4, phW2-8, phH2-8);
                    phCtx2.setLineDash([]);
                    phCtx2.fillStyle = '#64748b';
                    phCtx2.font = '14px "Microsoft YaHei"';
                    phCtx2.textAlign = 'center';
                    phCtx2.fillText(item.data.name, phW2/2, phH2/2-10);
                    phCtx2.fillText('请通过工具栏打开素材文件夹', phW2/2, phH2/2+16);
                    var phImg2 = new Image();
                    phImg2.onload = function() {
                        loadedElements[idx] = { img:phImg2, x:item.data.x, y:item.data.y, w:phW2, h:phH2, name:item.data.name, isImgTag:true, assetIdx:item.data.assetIdx, isDialogBg:true, isPlaceholder:true, originalW:phW2, originalH:phH2 };
                        loadedCount++;
                        if (loadedCount >= totalCount) finalizeParse();
                    };
                    phImg2.onerror = function() { loadedCount++; if (loadedCount >= totalCount) finalizeParse(); };
                    phImg2.src = phCanvas2.toDataURL();
                } else if (item.type === 'progressBar') {
                    // 进度条：合成背景图+进度条图
                    var pbBgImg = new Image();
                    pbBgImg.onload = function() {
                        var pbOffX = item.offsetX || 0;
                        var pbOffY = item.offsetY || 0;
                        if (item.fillUrl) {
                            var pbFillImg = new Image();
                            pbFillImg.onload = function() {
                                var pbCanvas = document.createElement('canvas');
                                pbCanvas.width = pbBgImg.width;
                                pbCanvas.height = pbBgImg.height;
                                var pbCtx = pbCanvas.getContext('2d');
                                pbCtx.drawImage(pbBgImg, 0, 0);
                                pbCtx.globalAlpha = 0.9;
                                pbCtx.drawImage(pbFillImg, pbOffX, pbOffY);
                                pbCtx.globalAlpha = 1;
                                var pbComposite = new Image();
                                pbComposite.onload = function() {
                                    loadedElements[idx] = {
                                        img: pbComposite, x: item.data.x, y: item.data.y,
                                        w: pbBgImg.width, h: pbBgImg.height,
                                        name: item.data.name,
                                        originalW: pbBgImg.width, originalH: pbBgImg.height,
                                        isProgressBar: true,
                                        progressBarOffsetX: pbOffX,
                                        progressBarOffsetY: pbOffY,
                                        willIdx: item.data.willIdx,
                                        progressBarBgIdx: item.data.progressBarBgIdx,
                                        progressBarFillIdx: item.data.progressBarFillIdx
                                    };
                                    loadedCount++;
                                    if (loadedCount >= totalCount) finalizeParse();
                                };
                                pbComposite.onerror = function() {
                                    loadedCount++;
                                    if (loadedCount >= totalCount) finalizeParse();
                                };
                                pbComposite.src = pbCanvas.toDataURL();
                            };
                            pbFillImg.onerror = function() {
                                // fill加载失败，仅用bg
                                loadedElements[idx] = { img:pbBgImg, x:item.data.x, y:item.data.y, w:pbBgImg.width, h:pbBgImg.height, name:item.data.name, originalW:pbBgImg.width, originalH:pbBgImg.height, isProgressBar:true, progressBarOffsetX:pbOffX, progressBarOffsetY:pbOffY, willIdx:item.data.willIdx, progressBarBgIdx:item.data.progressBarBgIdx, progressBarFillIdx:item.data.progressBarFillIdx };
                                loadedCount++;
                                if (loadedCount >= totalCount) finalizeParse();
                            };
                            pbFillImg.src = item.fillUrl;
                        } else {
                            loadedElements[idx] = { img:pbBgImg, x:item.data.x, y:item.data.y, w:pbBgImg.width, h:pbBgImg.height, name:item.data.name, originalW:pbBgImg.width, originalH:pbBgImg.height, isProgressBar:true, progressBarOffsetX:pbOffX, progressBarOffsetY:pbOffY, willIdx:item.data.willIdx, progressBarBgIdx:item.data.progressBarBgIdx, progressBarFillIdx:item.data.progressBarFillIdx };
                            loadedCount++;
                            if (loadedCount >= totalCount) finalizeParse();
                        }
                    };
                    pbBgImg.onerror = function() { loadedCount++; if (loadedCount >= totalCount) finalizeParse(); };
                    pbBgImg.src = item.src;
                } else {
                    // 普通元素（文字、图片、倒计时、输入框、装备框、关闭按钮）
                    var img = new Image();
                    img.onload = function() {
                        var elData = {
                            img: img,
                            x: item.data.x, y: item.data.y,
                            w: item.data.w || img.width || 50,
                            h: item.data.h || img.height || 50,
                            name: item.data.name
                        };

                        // 复制所有特有属性
                        var copyKeys = ['isText','textContent','textColor','textScript','textFont','textSize','textBold',
                                        'isImgTag','assetIdx','originalW','originalH',
                                        'isCountdown','countdownSeconds','countdownColor',
                                        'isInputText','isInputNum','inputId','inputWidth','inputHeight',
                                        'inputBgColor','inputBorderColor','inputTextColor',
                                        'inputMinLen','inputMaxLen','inputMinVal','inputMaxVal',
                                        'inputErrorMsg','inputPlaceholder','inputPlaceholderColor',
                                        'isCloseBtn','isEquipFrame','equipItemName','isProgressBar','isDialogBg',
                                        'willIdx','progressBarOffsetX','progressBarOffsetY','progressBarBgIdx','progressBarFillIdx',
                                        'isEffect','effectStartIdx','effectFrameCount','effectSpeed','effectFrames','effectCurrentFrame','effectLastTime'];
                        for (var k = 0; k < copyKeys.length; k++) {
                            if (item.data[copyKeys[k]] !== undefined) {
                                elData[copyKeys[k]] = item.data[copyKeys[k]];
                            }
                        }

                        // 图片元素设置original尺寸
                        if (elData.isImgTag || elData.isCloseBtn || elData.isEquipFrame || elData.isProgressBar) {
                            elData.originalW = img.width;
                            elData.originalH = img.height;
                            elData.w = img.width;
                            elData.h = img.height;
                        }

                        loadedElements[idx] = elData;
                        loadedCount++;
                        if (loadedCount >= totalCount) finalizeParse();
                    };
                    img.onerror = function() {
                        loadedCount++;
                        if (loadedCount >= totalCount) finalizeParse();
                    };
                    img.src = item.src;
                }
            });

            function finalizeParse() {
                // 按原始顺序添加元素（过滤加载失败的）
                elements = [];
                for (var i = 0; i < loadedElements.length; i++) {
                    if (loadedElements[i]) {
                        elements.push(loadedElements[i]);
                    }
                }

                // 设置画布大小（根据第一个图片元素，否则自动计算包围盒）
                var canvasSet2 = false;
                for (var i = 0; i < elements.length; i++) {
                    if (!elements[i].isText && !elements[i].isCountdown &&
                        !elements[i].isInputText && !elements[i].isInputNum) {
                        canvasW = elements[i].originalW || elements[i].w;
                        canvasH = elements[i].originalH || elements[i].h;
                        canvas.width = canvasW;
                        canvas.height = canvasH;
                        zoom = 1;
                        updateCanvasSize();
                        canvasSet2 = true;
                        break;
                    }
                }
                if (!canvasSet2 && elements.length > 0) {
                    var maxX2 = 0, maxY2 = 0;
                    for (var i = 0; i < elements.length; i++) {
                        var r2 = elements[i].x + (elements[i].w || 0);
                        var b2 = elements[i].y + (elements[i].h || 0);
                        if (r2 > maxX2) maxX2 = r2;
                        if (b2 > maxY2) maxY2 = b2;
                    }
                    canvasW = Math.max(800, maxX2 + 60);
                    canvasH = Math.max(600, maxY2 + 60);
                    canvas.width = canvasW;
                    canvas.height = canvasH;
                    zoom = 1;
                    updateCanvasSize();
                }

                // 启动特效动画（如果有）
                var hasEffect = elements.some(function(el) { return el.isEffect; });
                if (hasEffect) startEffectAnimation();

                selectedIdx = -1;
                updatePropsPanel();
                redraw();
                showToast('✅ 已解析 ' + elements.length + ' 个元素到画布');
            }
        }

        // 初始化（包裹在try-catch中防止崩溃）
        try {
            initCanvas(800, 600);
            updatePropsPanel();
            initQuickImportSlots();
            // 代码区默认打开
            var toggleBtn = document.getElementById('toggleCodeBtn');
            if (toggleBtn) toggleBtn.style.background = 'rgba(0, 212, 255, 0.3)';
            console.log('[BOO] 初始化完成');
        } catch(e) {
            console.error('[BOO] 初始化失败: ' + e.message);
        }

        // 面板拖拽调整大小功能
        (function initResizers() {
            var leftResizer = document.getElementById('leftResizer');
            var rightResizer = document.getElementById('rightResizer');
            var assetsPanel = document.getElementById('assetsPanel');
            var propsPanel = document.getElementById('propsPanel');
            var isResizing = false;
            var currentResizer = null;
            var startX = 0;
            var startWidth = 0;

            function startResize(e, resizer, panel) {
                isResizing = true;
                currentResizer = resizer;
                startX = e.clientX;
                startWidth = panel.offsetWidth;
                resizer.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
            }

            function doResize(e) {
                if (!isResizing) return;

                var dx = e.clientX - startX;
                var newWidth;

                if (currentResizer === leftResizer) {
                    // 左侧面板：向右拖动增大，向左拖动减小
                    newWidth = startWidth + dx;
                    newWidth = Math.max(300, newWidth);
                    assetsPanel.style.width = newWidth + 'px';
                } else if (currentResizer === rightResizer) {
                    // 右侧面板：向左拖动增大，向右拖动减小
                    newWidth = startWidth - dx;
                    newWidth = Math.max(200, Math.min(500, newWidth));
                    propsPanel.style.width = newWidth + 'px';
                }
            }

            function stopResize() {
                if (!isResizing) return;
                isResizing = false;
                if (currentResizer) currentResizer.classList.remove('resizing');
                currentResizer = null;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                // 重新计算虚拟列表布局
                if (_virtualList.filteredItems.length > 0) renderAllAssets();
            }

            leftResizer.addEventListener('mousedown', function(e) {
                startResize(e, leftResizer, assetsPanel);
            });

            rightResizer.addEventListener('mousedown', function(e) {
                startResize(e, rightResizer, propsPanel);
            });

            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);
        })();

        // 键盘事件监听 - 方向键移动选中元素
        document.addEventListener('keydown', function(e) {
            // 如果有输入框获得焦点，不处理快捷键
            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                return;
            }

            // Ctrl+C 复制
            if (e.ctrlKey && e.key === 'c') {
                e.preventDefault();
                copySelectedElements();
                return;
            }

            // Ctrl+V 粘贴
            if (e.ctrlKey && e.key === 'v') {
                e.preventDefault();
                pasteElements();
                return;
            }

            // Delete键删除选中元素（支持多选）
            if (e.key === 'Delete') {
                if (selectedIndices.length > 0) {
                    // 多选删除（从大到小排序，避免索引错乱）
                    var sortedIndices = selectedIndices.slice().sort(function(a, b) { return b - a; });
                    sortedIndices.forEach(function(idx) {
                        elements.splice(idx, 1);
                    });
                    selectedIndices = [];
                    selectedIdx = -1;
                    updatePropsPanel();
                    redraw();
                    return;
                } else if (selectedIdx >= 0) {
                    deleteElement(selectedIdx);
                    return;
                }
            }

            // 方向键移动选中元素（每次1像素）
            if (!isDragging) {
                var moved = false;
                var dx = 0, dy = 0;

                switch(e.key) {
                    case 'ArrowUp':
                        dy = -1;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        dy = 1;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        dx = -1;
                        moved = true;
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        dx = 1;
                        moved = true;
                        e.preventDefault();
                        break;
                }

                if (moved) {
                    // 多选移动
                    if (selectedIndices.length > 0) {
                        selectedIndices.forEach(function(idx) {
                            elements[idx].x += dx;
                            elements[idx].y += dy;
                        });
                    } else if (selectedIdx >= 0) {
                        // 单选移动
                        elements[selectedIdx].x += dx;
                        elements[selectedIdx].y += dy;
                    }
                    redraw();
                    updatePropsPanel();
                }
            }
        });

        // 复制选中元素
        function copySelectedElements() {
            clipboard = [];

            if (selectedIndices.length > 0) {
                // 复制多选元素
                selectedIndices.forEach(function(idx) {
                    if (idx >= 0 && idx < elements.length) {
                        clipboard.push(cloneElement(elements[idx]));
                    }
                });
            } else if (selectedIdx >= 0) {
                // 复制单选元素
                clipboard.push(cloneElement(elements[selectedIdx]));
            }

            if (clipboard.length > 0) {
                showToast('✅ 已复制 ' + clipboard.length + ' 个元素');
            }
        }

                h: el.h,

                textContent: el.textContent,
                textColor: el.textColor,
                textFont: el.textFont,
                textSize: el.textSize,
                textBold: el.textBold,
                textScript: el.textScript,
                isButton: el.isButton,
                buttonImages: el.buttonImages,

                buttonState: el.buttonState,
                isImgTag: el.isImgTag,
                isEffect: el.isEffect,
                effectStartIdx: el.effectStartIdx,
                effectFrameCount: el.effectFrameCount,
                effectSpeed: el.effectSpeed,
                effectFrames: el.effectFrames,
                isAnim: el.isAnim,
                animStartIdx: el.animStartIdx,
                animFrameCount: el.animFrameCount,
                animSpeed: el.animSpeed,
                animFrames: el.animFrames,
                isCountdown: el.isCountdown,
                countdownStartIdx: el.countdownStartIdx,

                visible: el.visible,

        // 粘贴元素
        function pasteElements() {
            if (clipboard.length === 0) {
                showToast('⚠️ 剪贴板为空');
                return;
            }

            selectedIndices = [];
            var newIndices = [];

            clipboard.forEach(function(el) {
                var pasted = cloneElement(el);
                // 粘贴位置偏移10像素
                pasted.x += 10;
                pasted.y += 10;
                elements.push(pasted);
                newIndices.push(elements.length - 1);
            });

            selectedIndices = newIndices;
            selectedIdx = newIndices[newIndices.length - 1];

            updatePropsPanel();
            redraw();
            showToast('✅ 已粘贴 ' + newIndices.length + ' 个元素');
        }

        // 初始化快捷导入槽位显示
        function initQuickImportSlots() {
            // 默认显示所有快捷导入槽位，不缓存
            var types = ['closeBtn', 'equipFrame', 'progressBar'];
            types.forEach(function(type) {
                var wrapperId = type + 'Wrapper';
                var wrapper = document.getElementById(wrapperId);
                if (wrapper) wrapper.style.display = 'block';
            });
        }

        // 修改 importFilesToAssets 函数，添加缓存保存
        var originalImportFilesToAssets = importFilesToAssets;
        importFilesToAssets = function(files, type) {
            originalImportFilesToAssets(files, type);
        };

        // ==================== 双向实时同步系统 ====================
        var _syncLock = false;        // 防止循环同步的锁
        var _canvasToCodeTimer = null; // 画布→代码的防抖计时器
        var _codeToCanvasTimer = null; // 代码→画布的防抖计时器
        var _lastCodeSnapshot = '';    // 上次生成的代码快照，避免重复更新

        // ==================== 文本编辑器联动状态 ====================
        var _linkedEditorPath = null;  // 联动文件路径
        var _linkedEditorName = null;  // 联动文件名
        var _linkedEditorLock = false; // 联动同步锁，防止循环

        // --- RAF 渲染节流 ---
        var _canvasDirty = false;
        var _rafId = null;

        function markCanvasDirty() {
          _canvasDirty = true;
          if (!_rafId) {
            _rafId = requestAnimationFrame(_flushCanvas);
          }
        }

        function _flushCanvas() {
          _rafId = null;
          if (_canvasDirty) {
            _canvasDirty = false;
            redraw();
          }
        }

        // 画布 → 代码同步（由redraw触发，300ms防抖）
        function syncCanvasToCode() {
            if (_syncLock) return;
            if (!engCfg().supportsCodeGeneration) {
                if (_canvasToCodeTimer) clearTimeout(_canvasToCodeTimer);
                var unsupportedOutput = document.getElementById('codeOutput');
                if (unsupportedOutput) unsupportedOutput.value = '';
                _lastCodeSnapshot = '';
                return;
            }
            if (_canvasToCodeTimer) clearTimeout(_canvasToCodeTimer);
            _canvasToCodeTimer = setTimeout(function() {
                _canvasToCodeTimer = null;

        // 静默版generateCode，返回代码字符串而不是写入textarea
