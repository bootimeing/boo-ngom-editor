<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOO 可视化编辑器</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111318; --panel: #191d24; --surface: #222731; --hover: #2b3340;
            --border: #323a47; --text: #e6eaf0; --muted: #a1aab9; --subtle: #7b8799;
            --accent: #78a8ff; --primary: #3778e5; --danger: #f29a9a; --radius: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg); color: var(--text); height: 100vh; height: 100dvh;
            overflow: hidden; display: flex; flex-direction: column;
        }
        button, input, select, textarea { font: inherit; }
        button { cursor: pointer; }
        button, input:not([type=checkbox]):not([type=radio]), select, textarea {
            color: var(--text); background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        }
        button { padding: 5px 10px; transition: background-color .12s, border-color .12s, color .12s; }
        button:hover:not(:disabled) { background-color: var(--hover); border-color: #57657a; }
        button:disabled { opacity: .42; cursor: not-allowed; }
        input:not([type=checkbox]):not([type=radio]), select, textarea { padding: 6px 8px; min-width: 0; }
        input::placeholder, textarea::placeholder { color: var(--subtle); }
        input[type=checkbox], input[type=radio] { accent-color: var(--primary); }
        :is(button,input,select,textarea,[tabindex]):focus-visible {
            outline: 2px solid var(--accent) !important; outline-offset: 2px; box-shadow: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        [hidden] { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3c4656; border-radius: 8px; border: 2px solid var(--panel); }
        ::-webkit-scrollbar-thumb:hover { background: #59667c; }
        .toolbar {
            flex: none; min-height: 58px; padding: 10px 16px; display: flex; align-items: center;
            gap: 8px; border-bottom: 1px solid var(--border); background: var(--panel);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-right: 16px; flex-shrink: 0; }
        .brand-mark { display: block; width: 32px; height: 32px; border-radius: 6px; object-fit: contain; flex-shrink: 0; }
        .toolbar h1 { font-size: 14px; font-weight: 600; letter-spacing: .3px; }
        .toolbar-spacer { flex: 1; min-width: 4px; }
        .toolbar .tech-support { display: none; }
        .engine-selector { display: flex; align-items: center; gap: 7px; margin-right: 8px; }
        .engine-selector select { background: transparent; border-color: transparent; padding: 5px; color: var(--muted); cursor: pointer; }
        .engine-selector select option { background: var(--panel); color: var(--text); }
        .engine-indicator { width: 6px; height: 6px; border-radius: 50%; flex: none; }
        .engine-indicator.gom { background: #e9b669; }
        .engine-indicator.lingfeng { background: #b5a0ea; }
        .engine-indicator.pc996 { background: #76c8a6; }
        .btn { padding: 7px 11px; min-height: 32px; display: inline-flex; align-items: center; justify-content: center;
            gap: 7px; white-space: nowrap; flex-shrink: 0; background: var(--surface); color: var(--text); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #4988f1; border-color: #4988f1; }
        .btn-secondary, .btn-call { background: var(--surface); }
        .btn-danger { background: transparent; color: var(--danger); border-color: #593b43; }
        .btn-danger:hover:not(:disabled) { background: #38272f; border-color: #a86570; }
        .btn[aria-pressed=true] { background: #263d61; border-color: #547ab1; color: #bfd5ff; }
        .tool-icon { display: inline-grid; place-items: center; width: 17px; height: 18px; flex: none; color: var(--muted);
            font: 600 16px/1 "Segoe UI", sans-serif; }
        .btn-primary .tool-icon { color: inherit; }
        .insert-toolbar { display: flex; align-items: center; gap: 4px; min-height: 46px; padding: 5px 16px;
            flex: none; overflow-x: auto; background: #161a20; border-bottom: 1px solid var(--border); }
        .toolbar-label { color: var(--subtle); font-size: 11px; padding-right: 12px; white-space: nowrap; }
        .insert-toolbar .btn { background: transparent; border-color: transparent; padding: 6px 12px; font-size: 12px; }
        .insert-toolbar .btn:hover { background: var(--surface); border-color: var(--border); }
        .linked-indicator { display: flex; align-items: center; gap: 6px; color: #90cbae; font-size: 11px;
            max-width: 180px; min-width: 0; white-space: nowrap; }
        .linked-indicator span { overflow: hidden; text-overflow: ellipsis; }
        .linked-indicator .btn { min-height: 24px; }
        .main-container { display: flex; flex: 1; min-height: 0; position: relative; overflow: hidden; }
        .resizer { width: 4px; flex: none; background: var(--bg); cursor: col-resize; transition: background-color .12s; }
        .resizer:hover, .resizer.resizing { background: var(--primary); }
        .assets-panel, .props-panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; flex-shrink: 0; }
        .assets-panel { width: 280px; min-width: 240px; max-width: 480px; border-right: 1px solid var(--border); }
        .props-panel { width: 264px; min-width: 220px; max-width: 500px; border-left: 1px solid var(--border); }
        .panel-header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; flex: none;
            border-bottom: 1px solid var(--border); padding: 0 12px; gap: 8px; }
        .panel-header > span { font-size: 12px; font-weight: 600; color: var(--text); }
        .panel-header .count { color: var(--subtle); font: 10px/1.3 Consolas, monospace; text-align: right; min-width: 0; max-width: 112px; }
        .assets-panel .panel-header { flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; gap: 4px; }
        .assets-panel .panel-tabs { width: 100%; justify-content: space-between; }
        .assets-panel .panel-tab { padding: 0; }
        .assets-panel .count { max-width: 100%; text-align: left; white-space: nowrap; }
        .panel-tabs { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .panel-tab { color: var(--muted); padding: 12px 0; font-size: 12px; white-space: nowrap; }
        .panel-tab.active { color: var(--text); font-weight: 600; }
        .asset-reload-btn { padding: 3px 5px; font-size: 11px; background: transparent; border-color: transparent; white-space: nowrap; color: var(--muted); }
        .tab-content { display: none; flex: 1; min-height: 0; overflow: hidden; flex-direction: column; }
        .tab-content.active { display: flex; }
        .panel-actions { padding: 10px 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
        .panel-actions .btn { flex: 1; }
        .quick-import-row { display: flex; gap: 7px; padding: 12px; border-bottom: 1px solid var(--border); flex: none; }
        .quick-import-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .quick-import-slot { background: #202630; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 4px; cursor: pointer; text-align: center; }
        .quick-import-slot:hover { background: #283141; border-color: #63738b; }
        .quick-import-slot.has-content { border-color: #4c709e; }
        .quick-import-label { font-size: 11px; color: #d2d9e5; margin-bottom: 6px; }
        .quick-import-preview { font-size: 10px; color: var(--subtle); min-height: 30px; display: flex; align-items: center; justify-content: center; }
        .quick-import-preview img { max-width: 100%; max-height: 30px; display: block; }
        .asset-locator { display: flex; align-items: center; gap: 7px; padding: 9px 12px; font-size: 11px; }
        .asset-locator label { color: var(--muted); }
        .asset-locator input { flex: 1; width: 80px; }
        .assets-list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; position: relative; }
        .pak-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--border); max-height: 116px; overflow-y: auto; flex: none; }
        .pak-tab { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 4px 8px; border-radius: 5px; font-size: 11px; white-space: nowrap; }
        .pak-tab.active { color: #c2d8ff; background: #293d5b; border-color: #435c81; }
        .pak-tab-item { position: relative; display: inline-flex; align-items: stretch; }
        .pak-tab-item .pak-tab { padding-right: 22px; }
        .pak-tab-close { position: absolute; right: 2px; top: 5px; width: 17px; height: 17px; padding: 0; line-height: 15px;
            background: transparent; color: var(--subtle); border: 0; font-size: 13px; }
        .pak-tab-close:hover { color: var(--danger); }
        /* The virtual list uses 73px rows. Keep thumbnail geometry unchanged. */
        .asset-item { background: #202630; border: 1px solid var(--border); border-radius: 5px; padding: 8px;
            cursor: grab; text-align: center; line-height: normal; transition: background-color .12s, border-color .12s; }
        .asset-item:hover { background: #293342; border-color: #65748b; }
        .asset-item img { width: 35px; height: 35px; object-fit: contain; display: block; margin: 0 auto; }
        .asset-item .name { font: 10px/normal Consolas, "Microsoft YaHei", monospace; color: #aab5c6; margin-top: 4px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .asset-item.archive-id-target { outline: 2px solid #e8ba67; outline-offset: -2px; background-color: #343126; }
        .archive-selector-status { color: #e8ba67; font-size: 11px; align-self: center; }
        .asset-state { position: absolute; left: 2px; top: 2px; max-width: 38px; font-size: 9px; color: #e8ba67; background: #202630; }
        .asset-placeholder { display: block; height: 35px; line-height: 35px; color: var(--subtle); font-size: 12px; }
        .canvas-container { flex: 1; min-width: 0; position: relative; overflow: auto; display: flex; align-items: center; align-items: safe center;
            justify-content: center; justify-content: safe center; padding: 44px 24px; background-color: var(--bg);
            background-image: radial-gradient(#2c323d .8px, transparent .8px); background-size: 16px 16px; }
        .canvas-wrapper { position: relative; flex-shrink: 0; background: #171b22; border: 1px solid #424b5b; box-shadow: 0 12px 40px #0005; }
        #canvas { display: block; cursor: crosshair; }
        .canvas-size-label { position: absolute; top: 14px; left: 16px; color: var(--subtle); font: 11px/1.5 Consolas, "Microsoft YaHei", monospace;
            background: #111318dd; border-radius: 4px; padding: 3px 6px; pointer-events: none; }
        .props-panel.hidden, #rightResizer.hidden { display: none !important; }
        .btn-hide-panel { background: transparent; color: var(--muted); font-size: 11px; padding: 3px 7px; border-color: transparent; white-space: nowrap; }
        .btn-show-panel { position: absolute; top: 12px; right: 12px; z-index: 10; display: none; font-size: 11px; }
        .btn-show-panel.visible { display: block; }
        .props-content { padding: 14px 12px; flex: 1; min-height: 0; overflow-y: auto; }
        .prop-section { margin-bottom: 20px; }
        .prop-section-title { font-size: 11px; font-weight: 650; color: #c2cbd9; padding-bottom: 9px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
        .prop-section-subtitle { color: #b5c3d8; font-size: 11px; font-weight: 600; margin: 8px 0 12px; }
        .prop-section-divider { height: 1px; background: var(--border); margin: 8px 0 12px; }
        .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-width: 0; }
        .prop-row label { width: 84px; flex: none; font-size: 11px; color: var(--muted); }
        .prop-row input, .prop-row select { flex: 1; width: 0; min-width: 0; font-size: 12px; padding: 6px 8px; background-color: #12161d; }
        .prop-row input[readonly] { color: var(--subtle); background-color: #1b2028; border-style: dashed; }
        .delete-btn { width: 100%; margin-top: 10px; }
        .elements-list { margin-top: 10px; }
        .element-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 10px; gap: 6px;
            background: #202630; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; cursor: pointer; font-size: 11px; }
        .element-item:hover { border-color: #5e6f88; }
        .element-item.selected { border-color: #6394de; background: #263852; }
        .element-item .info { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
        .element-item .del-btn { background: transparent; border: 0; color: #b7878f; padding: 2px 5px; font-size: 11px; flex: none; }
        .element-item .del-btn:hover { background: #462d36; color: var(--danger); }
        .empty-hint { padding: 38px 14px; color: var(--subtle); font-size: 12px; line-height: 1.9; text-align: center; }
        .empty-hint strong { display: block; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
        .code-area { position: absolute; top: 46px; right: 16px; width: 300px; height: 300px; padding: 12px;
            display: flex; flex-direction: column; gap: 10px; min-width: 180px; min-height: 120px; max-width: calc(100% - 24px);
            max-height: calc(100% - 62px); background: #191f29; border: 1px solid #49566b; border-radius: 9px;
            z-index: 10; overflow: hidden; resize: none; box-shadow: 0 16px 44px #0006; }
        .code-titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: move; user-select: none; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .code-titlebar span { pointer-events: none; color: #b7c9e4; font-size: 12px; white-space: nowrap; }
        .code-area input { width: 100%; font-size: 11px; }
        .code-area textarea { flex: 1; min-height: 80px; width: 100%; resize: none; padding: 10px; background: #11161e;
            color: #b7cde9; font: 12px/1.7 Consolas, Monaco, monospace; }
        .code-header { display: flex; align-items: center; gap: 8px; }
        .code-header input { flex: 1; }
        .resize-handle { position: absolute; z-index: 20; }
        .resize-handle-n { top: -3px; left: 8px; right: 8px; height: 6px; cursor: n-resize; }
        .resize-handle-s { bottom: -3px; left: 8px; right: 8px; height: 6px; cursor: s-resize; }
        .resize-handle-w { left: -3px; top: 8px; bottom: 8px; width: 6px; cursor: w-resize; }
        .resize-handle-e { right: -3px; top: 8px; bottom: 8px; width: 6px; cursor: e-resize; }
        .resize-handle-nw { top: -4px; left: -4px; width: 10px; height: 10px; cursor: nw-resize; }
        .resize-handle-ne { top: -4px; right: -4px; width: 10px; height: 10px; cursor: ne-resize; }
        .resize-handle-sw { bottom: -4px; left: -4px; width: 10px; height: 10px; cursor: sw-resize; }
        .resize-handle-se { bottom: -4px; right: -4px; width: 10px; height: 10px; cursor: se-resize; }
        .folder-history-menu { position: absolute; top: 100%; left: 0; margin-top: 4px; background: var(--panel);
            border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 12px 32px #0007; z-index: 1000;
            min-width: 300px; max-width: 500px; max-height: 400px; overflow-y: auto; }
        .history-menu-section { padding: 4px 0; }
        .history-menu-item-btn, .history-menu-item { display: block; width: 100%; padding: 9px 14px; background: transparent; border: 0;
            color: var(--text); text-align: left; font-size: 12px; }
        .history-menu-item-btn:hover, .history-menu-item:hover { background: var(--surface); }
        .history-menu-item-danger { color: var(--danger); }
        .history-menu-divider { height: 1px; background: var(--border); }
        .history-item-folder-name { font-weight: 500; color: #c1d2ec; }
        .history-item-folder-path { font-size: 11px; color: var(--subtle); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* Dynamic dialogs retain local preview geometry and palette colors. */
        .editor-modal { padding: 16px; background: #090c12b8 !important; }
        .editor-modal > div { background: var(--panel) !important; border: 1px solid #465269 !important; border-radius: 10px !important;
            max-width: 100%; max-height: calc(100dvh - 32px) !important; min-height: 0; box-shadow: 0 22px 70px #0008 !important; }
        .editor-modal > div > div:first-child { padding: 13px 16px !important; border-bottom-color: var(--border) !important; flex-shrink: 0; }
        .editor-modal > div > div:first-child > span { color: var(--text) !important; font-size: 14px !important; font-weight: 600 !important; }
        .editor-modal button:not(.dialog-asset-item):not([data-action-preset]) {
            color: var(--text) !important; background: var(--surface) !important; border: 1px solid var(--border) !important;
            border-radius: 5px !important; box-shadow: none !important; font-family: inherit; }
        .editor-modal button:not(.dialog-asset-item):not([data-action-preset]):hover:not(:disabled) { background: var(--hover) !important; border-color: #63738b !important; }
        .editor-modal button.btn[data-action^=confirm], .editor-modal button.btn.btn-primary, .editor-modal #cpConfirmBtn {
            background: var(--primary) !important; border-color: var(--primary) !important; color: #fff !important; }
        .editor-modal button.btn[data-action^=confirm]:hover:not(:disabled), .editor-modal button.btn.btn-primary:hover:not(:disabled), .editor-modal #cpConfirmBtn:hover:not(:disabled) { background: #4988f1 !important; }
        .editor-modal input:not([type=radio]):not([type=checkbox]), .editor-modal select {
            background: #11171f !important; border: 1px solid #3d485b !important; color: var(--text) !important;
            border-radius: 5px !important; padding: 5px 7px !important; min-height: 28px; }
        .editor-modal .dialog-asset-item { cursor: pointer; flex-shrink: 0; border-radius: 5px; padding: 6px; }
        .editor-modal .dialog-asset-item:disabled { opacity: .48; cursor: not-allowed; }
        .editor-modal :is(#dialogGrid,#buttonSelectorGrid,#effectSelectorGrid,#closeBtnPakGrid,#equipFramePakGrid,#progressBarPakGrid) {
            min-height: 0; overscroll-behavior: contain; align-content: start; }
        .archive-selector-controls { padding: 10px 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .archive-selector-pak { max-width: 170px; min-width: 0; }
        .archive-selector-query { width: 144px; min-width: 0; }
        .archive-selector-page { font: 11px/1.5 Consolas, monospace; color: var(--muted); white-space: nowrap; }
        .button-state-list { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
        .button-state-slot { flex-direction: column; gap: 6px !important; padding: 10px 8px !important; margin-bottom: 0 !important; min-width: 0; }
        .button-state-slot > div:nth-child(3) { width: 100%; text-align: center; }
        #archiveInspector { position: fixed; inset: 0; z-index: 10001; background: #090c12b8; display: flex; align-items: center; justify-content: center; padding: 16px; }
        #archiveInspector[hidden] { display: none !important; }
        .archive-inspector-card { display: flex; flex-direction: column; width: 720px; max-width: 100%; max-height: calc(100dvh - 32px);
            background: var(--panel); border: 1px solid #465269; border-radius: 10px; padding: 14px; gap: 10px; min-width: 0; box-shadow: 0 22px 70px #0008; }
        .archive-inspector-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 11px; }
        #archiveInspectorTitle { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 13px; color: #d5dfed; }
        #archiveInspectorViewport { overflow: auto; height: 380px; min-height: 100px; position: relative; border: 1px solid var(--border); background-color: #aaa;
            background-image: conic-gradient(#ddd 25%,transparent 0 50%,#ddd 0 75%,transparent 0); background-size: 16px 16px; }
        #archiveInspectorStage { position: relative; min-width: 1px; min-height: 1px; isolation: isolate; }
        #archiveInspectorStage img { position: absolute; display: block; image-rendering: pixelated; max-width: none; }
        #archiveInspectorOrigin { position: absolute; width: 1px; height: 1px; pointer-events: none; z-index: 1; }
        #archiveInspectorOrigin:before, #archiveInspectorOrigin:after { content: ''; position: absolute; background: #ff4040; box-shadow: 0 0 1px #fff; }
        #archiveInspectorOrigin:before { width: 17px; height: 1px; left: -8px; }
        #archiveInspectorOrigin:after { height: 17px; width: 1px; top: -8px; }
        #archiveInspectorDetails { font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 140px; overflow: auto; color: var(--muted); }
        #archiveAnimationTools input { width: 72px; }
        #archiveAnimationTools label { display: inline-flex; align-items: center; gap: 4px; }
        #archiveAnimationNote { font-size: 11px; color: var(--muted); }
        #toast { background: #252e3c !important; color: #dae5f6 !important; border: 1px solid #50627d !important;
            box-shadow: 0 6px 20px #0005 !important; font-size: 12px !important; max-width: min(480px, calc(100vw - 32px)); }
        body.float-mode :is(.assets-panel,#leftResizer,.props-panel,#rightResizer,.code-area,.engine-selector,.linked-indicator,.insert-toolbar) { display: none !important; }
        body.float-mode .main-container { flex: 1; height: auto; }
        @media (max-width: 1100px) {
            .toolbar { padding: 9px 12px; gap: 6px; }
            .brand { margin-right: 4px; gap: 7px; }
            .toolbar .btn { padding: 6px 9px; }
            .assets-panel { width: 240px; }
            .props-panel { width: 232px; }
            .linked-indicator { max-width: 110px; }
            .insert-toolbar { padding-left: 12px; }
        }
        @media (max-width: 780px) {
            .toolbar { flex-wrap: wrap; }
            .brand { margin-right: auto; }
            .toolbar-spacer { display: none; }
            .engine-selector { margin-right: 0; }
            .assets-panel { min-width: 200px; width: 200px; }
            .props-panel { min-width: 190px; width: 190px; }
            .panel-header { padding: 0 8px; }
            .quick-import-row { gap: 4px; padding: 8px; }
            .quick-import-label { font-size: 10px; }
            .toolbar .tool-icon { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    </style>
</head>
<body>
    <!-- 顶部工具栏 -->
    <div class="toolbar">
        <div class="brand" title="BOO 可视化编辑器"><img class="brand-mark" src="resources/icon.png" alt="老卢" width="32" height="32" draggable="false"><h1>UI 编辑器</h1></div>
        <div class="engine-selector" id="engineSelector">
            <span class="engine-indicator gom" id="engineIndicator"></span>
            <select id="engineSelect" onchange="switchEngine(this.value)">
                <option value="gom" selected>GOM引擎</option>
                <option value="lingfeng">翎风引擎</option>
                <option value="996pc">996PC引擎</option>
            </select>
        </div>

    <script>
        (function() {
        'use strict';

        // VSCode Webview API
        var _vscode = (typeof acquireVsCodeApi === 'function') ? acquireVsCodeApi() : null;
        // Moving a Webview between VS Code windows recreates its document, even with
        // retainContextWhenHidden. Read the old snapshot before any initial redraw.
        var _savedEditorState = null, _editorStateInitialized = false, _restoringEditorState = false;
        var _lastEditorStateJson = '', _canvasRestoreGeneration = 0, _editorStateSaveFrame = null;
        var _editorDocumentId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        var _durableCanvasImages = new WeakMap();
        try { if (_vscode && typeof _vscode.getState === 'function') _savedEditorState = _vscode.getState(); }
        catch (error) { console.warn('[BOO] 读取画布状态失败', error); }
        window._floatMode = (typeof window._floatMode !== 'undefined') ? true : false;
        if (window._floatMode) {
            document.body.classList.add('float-mode');
            document.title = 'BOO 画布预览';
        }

        // 全局 input 监听：更新 effectFrameCount / effectSpeed
        document.addEventListener('input', function(e) {
            if (e.target.id === 'effectFrameCount') { _effectFrameCount = Math.max(1, parseInt(e.target.value) || 5); }
            if (e.target.id === 'effectSpeed') { _effectSpeed = Math.max(1, parseInt(e.target.value) || 100); }
        });

        // HTML 实体转义 — 防止 XSS
        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // 事件委托函数映射表 — 由 IIFE 底部 populateActionMap() 填充
        // 因为 IIFE 内的普通 function 不在 window 上，需要单独维护映射
        var _actionFnMap = {};

        function _callAction(fnName, target, idx, val, evt) {
            var fn = _actionFnMap[fnName] || window[fnName];
            if (typeof fn !== 'function') return;
            if (fnName === 'pickColorCell') fn(target, parseInt(val));
            else if (fnName === 'callCloseBtnToCanvas' || fnName === 'callEquipFrameToCanvas' || fnName === 'callProgressBarToCanvas') fn(evt);
            else if (idx !== null && val !== null) fn(idx, val);
            else if (idx !== null) fn(parseInt(idx), evt);
            else if (val !== null) fn(parseInt(val));
            else fn();
        }

        // 全局事件委托 — 处理 data-action 属性替代 onclick
        document.addEventListener('click', function(e) {
            var target = e.target.closest('[data-action]');
            if (!target) {
                var presetTarget = e.target.closest('[data-action-preset]');
                if (presetTarget) {
                    var presetId = presetTarget.getAttribute('data-action-preset');
                    var presetVal = presetTarget.getAttribute('data-val');
                    var presetEl = document.getElementById(presetId);
                    if (presetEl) presetEl.value = presetVal;
                    return;
                }
                return;
            }
            e.stopPropagation();
            var idx = target.getAttribute('data-idx');
            var val = target.getAttribute('data-val');
            var actions = target.getAttribute('data-action').split('|');
            for (var a = 0; a < actions.length; a++) {
                _callAction(actions[a].trim(), target, idx, val, e);
            }
        });
        // 全局 mouseover 委托 — 处理 data-mouseover 属性
        document.addEventListener('mouseover', function(e) {
            var target = e.target.closest('[data-mouseover]');
            if (!target) return;
            var fnName = target.getAttribute('data-mouseover');
            var val = target.getAttribute('data-val');
            _callAction(fnName, target, null, val, null);
        });

        function requestOpenPakFiles() {
            if (_vscode) {
                _vscode.postMessage({ type: 'openPakFiles' });
            }
        }

        function requestOpenPakHistory() {
            if (_vscode) {
                _vscode.postMessage({ type: 'openPakHistory' });
            }
        }

        function requestReloadAssets() {
            var button = document.getElementById('reloadAssetsBtn');
            if (button) button.disabled = true;
            if (_vscode) _vscode.postMessage({ type: 'reloadAssets' });
        }

        // 通过VSCode请求清空画布
        function requestClearCanvas() {
            if (_vscode) {
                _vscode.postMessage({ type: 'clearCanvas' });
            }
        }

        // 切换代码区显示/隐藏
        var _codeAreaVisible = false;
        function toggleCodeArea() {
            var ca = document.getElementById('codeArea');
            var btn = document.getElementById('toggleCodeBtn');
            if (!ca) return;
            _codeAreaVisible = !_codeAreaVisible;
            ca.style.display = _codeAreaVisible ? 'flex' : 'none';
            if (btn) btn.setAttribute('aria-pressed', String(_codeAreaVisible));
        }

        // 监听VSCode发来的消息
        window.addEventListener('message', function(event) {
            var msg = event.data;
            if (msg && (msg.command || msg.type) === 'archiveSlotsInspected') { receiveArchiveInspection(msg); return; }
            if (!msg || !msg.type) return;
            switch (msg.type) {
                case 'loadAssets':
                    var preparedAssets;
                    try { preparedAssets=createAssetStore(msg.assetCatalog || {version:1,segments:[{kind:'files',files:msg.files || []}]}); }
                    catch(error) { showToast('无法读取素材目录：' + error.message); break; }
                    // PAK模式: 先设置状态再渲染（否则标签栏拿不到数据）
                    window._pakMode = !!msg.pakMode;
                    window._pakList = msg.pakList || [];
                    window._archiveLabel = msg.archiveLabel
                        || (msg.sourceType === 'jpk' ? 'JPK' : 'PAK');
                    // PAK模式下will序号由系统自动管理，禁止手动修改
                    var wiInput = document.getElementById('willIndex');
                    if (wiInput) {
                        wiInput.readOnly = !!msg.pakMode;
                        wiInput.style.background = msg.pakMode ? '#1a2236' : '';
                        wiInput.style.color = msg.pakMode ? '#64748b' : '';
                        wiInput.title = msg.pakMode ? window._archiveLabel + '模式下will序号由系统自动管理' : 'will序号';
                    }
                    window.renderAssetsFromFiles(preparedAssets);
                    reResolveSingleQuickImports();
                    reResolveProgressBarIfNeeded();
                    updateQuickImportSlot('progressBar');
                    var cp = document.getElementById('currentPath');
                    if (cp) cp.textContent = '当前: ' + (msg.folderName || '未打开资源包') + (msg.pakMode ? ' [' + window._archiveLabel + ']' : '');
                    var ac = document.getElementById('assetCount');
                    if (ac) ac.textContent = archiveAssetCounts(folderAssets);
                    break;
                case 'appendAssets':
                    if (msg.files && msg.files.length > 0) {
                        var appendedCatalog = serializeAssetCatalog();
                        appendedCatalog.segments.push({kind:'files',files:msg.files});
                        window.renderAssetsFromFiles([], appendedCatalog);
                        reResolveSingleQuickImports();
                        reResolveProgressBarIfNeeded();
                        updateQuickImportSlot('progressBar');
                        var ac2 = document.getElementById('assetCount');
                        if (ac2) ac2.textContent = archiveAssetCounts(folderAssets);
                    }
                    break;
                case 'reloadAssetsState': {
                    var reloadButton = document.getElementById('reloadAssetsBtn');
                    if (reloadButton) {
                        reloadButton.disabled = !!msg.loading;
                        reloadButton.textContent = msg.loading ? '↻ 读取中' : '↻ 重新读取';
                    }
                    break;
                }
                case 'clearCanvas':
                    if (typeof clearCanvas === 'function') clearCanvas();
                    break;
                case 'loadQuickImport':
                    // A picker result is only a draft in the exact modal/request that opened it.
                    if (!consumeQuickImportFileResult(msg)) break;
                    if (msg.error) { showToast(msg.error); break; }
                    if (msg.importType && msg.url) {
                        if (msg.importType === 'progressBar' && msg.subType) {
                            // 更新对话框内的预览
                            if (msg.subType === 'bg' && window.applyProgressBarBgSelection) {
                                window.applyProgressBarBgSelection(msg.url, msg.name, msg.filePath);
                            } else if (msg.subType === 'fill' && window.applyProgressBarFillSelection) {
                                window.applyProgressBarFillSelection(msg.url, msg.name, msg.filePath);
                            }
                        } else {
                            if (msg.importType === 'closeBtn' && window.applyCloseBtnSelection) {
                                window.applyCloseBtnSelection(msg.url, msg.name, msg.filePath);
                            } else if (msg.importType === 'equipFrame' && window.applyEquipFrameSelection) {
                                window.applyEquipFrameSelection(msg.url, msg.name, msg.filePath);
                            }
                        }
                    }
                    break;
                case 'loadDefaultMaterials':
                    _defaultMaterials = msg.items || [];
                    // 默认素材加载后刷新槽位（补上之前缺失的默认图）
                    updateQuickImportSlot('closeBtn');
                    updateQuickImportSlot('equipFrame');
                    updateQuickImportSlot('progressBar');
                    break;
                case 'loadQuickImports':
                    // 初始化时批量加载历史快捷导入
                    if (msg.imports) {
                        var types = ['closeBtn', 'equipFrame', 'progressBar'];
                        types.forEach(function(type) {
                            if (msg.imports[type]) {
                                if (type === 'progressBar' && msg.imports[type].bg) {
                                    // 元数据格式（新）：{bg:{name,isDefault,assetIdx}, fill:...}
                                    // 或已解析格式（旧）：{bg:{name,url}, fill:{name,url}}
                                    resolveProgressBarMeta(msg.imports[type]);
                                } else {
                                    quickImports[type] = resolveSingleQuickImport(msg.imports[type]);
                                }
                                updateQuickImportSlot(type);
                            }
                        });
                    }
                    // 处理失效的文件
                    if (msg.invalidTypes && msg.invalidTypes.length > 0) {
                        var typeLabels = { 'closeBtn': '关闭按钮', 'equipFrame': '装备框', 'progressBar': '进度条' };
                        msg.invalidTypes.forEach(function(type) {
                            var label = typeLabels[type] || type;
                            showToast('⚠️ ' + label + '的历史图片文件已失效，请重新导入');
                        });
                    }
                    break;
                case 'loadEnginePref':
                    if (msg.engine && ENGINE_CONFIG[msg.engine]) {
                        currentEngine = msg.engine;
                        var select = document.getElementById('engineSelect');
                        if (select) select.value = currentEngine;
                        var indicator = document.getElementById('engineIndicator');
                        indicator.className = 'engine-indicator ' + ENGINE_CONFIG[currentEngine].cssClass;
                        updateEngineCompatibilityUi();
                        if (msg.reloadEngineResources && _vscode) {
                            _defaultMaterials = [];
                            quickImports = { closeBtn: null, equipFrame: null, progressBar: null };
                            updateQuickImportSlot('closeBtn');
                            updateQuickImportSlot('equipFrame');
                            updateQuickImportSlot('progressBar');
                            _vscode.postMessage({ type: 'getQuickImports' });
                            _vscode.postMessage({ type: 'getDefaultMaterials' });
                        }
                    }
                    break;
                case 'syncFromEditor':
                    // 来自VSCode文本编辑器的同步
                    if (msg.linked && msg.code !== undefined) {
                        _linkedEditorPath = msg.filePath;
                        _linkedEditorName = msg.fileName;
                        updateLinkedIndicator();
                        // 关闭浮动代码区，用VSCode编辑器替代
                        if (_codeAreaVisible) {
                            toggleCodeArea();
                        }
                        // 解析代码到画布（跳过重复内容）
                        if (msg.code && msg.code !== _lastCodeSnapshot) {
                            _lastCodeSnapshot = msg.code;
                            _linkedEditorLock = true;
                            parseCodeToCanvasSilent(msg.code);
                            _linkedEditorLock = false;
                            showToast('🔗 已联动: ' + (msg.fileName || 'NPC脚本') + ' (' + elements.length + '个元素)');
                        } else if (!msg.code && _lastCodeSnapshot !== '') {
                            _lastCodeSnapshot = '';
                            if (elements.length > 0) {
                                elements = [];
                                selectedIdx = -1;
                                selectedIndices = [];
                                updatePropsPanel();
                                ctx.clearRect(0, 0, canvasW, canvasH);
                            }
                            showToast('🔗 已联动: ' + (msg.fileName || 'NPC脚本') + ' (无视觉元素)');
                        } else if (msg.code === _lastCodeSnapshot) {
                            // 代码未变，仅更新联动状态显示
                            showToast('🔗 已联动: ' + (msg.fileName || 'NPC脚本') + ' (' + elements.length + '个元素)');
                        }
                    }
                    break;
                case 'editorUnlinked':
                    _linkedEditorPath = null;
                    _linkedEditorName = null;
                    updateLinkedIndicator();
                    showToast('🔓 文本编辑器联动已断开');
                    break;
                case 'getFullState':
                    if (!window._floatMode && _vscode) {
                        _vscode.postMessage({
                            type: 'fullState',
                            elements: elements.map(serializeElement),
                            canvasW: canvasW,
                            canvasH: canvasH,
                            dialogConfig: dialogConfig,
                            assetCatalog: serializeAssetCatalog(),
                            pakMode: !!window._pakMode, pakList: window._pakList || [],
                            currentEngine: currentEngine
                        });
                    }
                    break;
                case 'fullState':
                    var preparedStateAssets;
                    if(msg.assetCatalog || msg.folderAssets) {
                        try { preparedStateAssets=createAssetStore(msg.assetCatalog || {version:1,segments:[{kind:'files',files:msg.folderAssets}]}); }
                        catch(error) { showToast('无法读取素材目录：' + error.message); break; }
                    }
                    if (msg.elements) {
                        deserializeAndApplyElements(msg.elements);
                        if (msg.canvasW && msg.canvasH) {
                            canvasW = msg.canvasW;
                            canvasH = msg.canvasH;
                            initCanvas(canvasW, canvasH);
                        }
                        if (msg.dialogConfig) dialogConfig = msg.dialogConfig;
                        if (msg.assetCatalog || msg.folderAssets) {
                            window._pakMode = msg.pakMode === undefined ? window._pakMode : !!msg.pakMode;
                            window._pakList = msg.pakList || window._pakList || [];
                            window.renderAssetsFromFiles(preparedStateAssets);
                        }
                        if (msg.currentEngine) {
                            currentEngine = msg.currentEngine;
                            var select = document.getElementById('engineSelect');
                            if (select) select.value = currentEngine;
                        }
                        updatePropsPanel();
                    }
                    break;
                case 'syncElements':
                    if (msg.elements) {
                        deserializeAndApplyElements(msg.elements);
                        if (msg.canvasW && msg.canvasH) {
                            canvasW = msg.canvasW;
                            canvasH = msg.canvasH;
                            initCanvas(canvasW, canvasH);
                        }
                        if (msg.dialogConfig) dialogConfig = msg.dialogConfig;
                        updatePropsPanel();
                    }
                    break;
                case 'floatClosed':
                    // 浮动画布已关闭
                    break;
            }
        });

        // 全局错误捕获，防止JS错误导致页面加载卡死
        window.onerror = function(msg, url, line, col, error) {

            console.error('[BOO Promise错误] ' + e.reason);
        });

        // 状态
        // 编辑器常量
        var CONFIG = {
            CANVAS_DEFAULT_W: 800, CANVAS_DEFAULT_H: 600,
            SYNC_CANVAS_TO_CODE_MS: 300, SYNC_CODE_TO_CANVAS_MS: 800,
            DIAG_DEBOUNCE_MS: 500, MAX_FILE_LINES: 5000,
            PASTE_OFFSET: 10
        };
        var canvasW = CONFIG.CANVAS_DEFAULT_W, canvasH = CONFIG.CANVAS_DEFAULT_H, zoom = 1;
        var elements = [];
        var selectedIdx = -1;
        var selectedIndices = []; // 多选索引数组
        var isDragging = false, dragStartX, dragStartY;
        var dragOffsets = []; // 多选拖拽时的偏移量
        var folderAssets = [];
        // BEGIN COMPACT ASSET STORE: direct packages retain ranges, not one object per empty slot.
        function createAssetStore(catalog) {
            if (!catalog || catalog.version !== 1 || !Array.isArray(catalog.segments)) throw Error('素材目录版本无效');
            var segments = [], cache = new Map(), total = 0, token = {}, counts = new Map();
            var validStates = ['empty','indexed-unverified','decoded','recovered','unsupported','corrupt'];
            function addCount(pak, status, amount) {
                if (!counts.has(pak)) counts.set(pak, { total:0, empty:0, failed:0 });
                var c = counts.get(pak); c.total += amount;
                if (status === 'empty') c.empty += amount;
                if (status === 'corrupt' || status === 'unsupported') c.failed += amount;

            // 计算过滤后的素材列表
            var filtered = assetSelectionView(_currentPakFilter,'');
            _virtualList.filteredItems = filtered;

            // 更新计数
            if (_currentPakFilter) {
                document.getElementById('fileCount').textContent = archiveAssetCounts(folderAssets,_currentPakFilter);
            }

            // 计算每行列数
            var containerWidth = list.clientWidth - 20; // 减去padding
            var colCount = Math.max(1, Math.floor((containerWidth + _virtualList.gap) / (_virtualList.itemWidth + _virtualList.gap)));
            _virtualList.colCount = colCount;

            // 计算总行数和总高度
            var totalRows = Math.ceil(filtered.length / colCount);
            var totalHeight = totalRows * (_virtualList.itemHeight + _virtualList.gap) - (totalRows > 0 ? _virtualList.gap : 0);
            // Chromium caps CSS dimensions; map a tall logical list onto a bounded scroll surface.
            var physicalHeight = Math.min(totalHeight,16000000), viewportHeight=list.clientHeight;
            _virtualList.scrollScale = totalHeight>physicalHeight ? (totalHeight-viewportHeight)/Math.max(1,physicalHeight-viewportHeight) : 1;

            // 设置占位高度
            list.innerHTML = '<div class="virtual-spacer" style="height:' + physicalHeight + 'px;width:100%;"></div>' +
                '<div class="virtual-content" style="position:absolute;top:0;left:10px;right:10px;"></div>';

            // 强制重渲染
            _virtualList.lastStart = -1;
            _virtualList.lastEnd = -1;
            _renderVisibleAssets();
        }

        function _renderVisibleAssets() {
            var list = document.getElementById('assetsList');
            if (!list) return;
            var items = _virtualList.filteredItems;
            if (!items.length || !folderAssets.length) return;

            var physicalScrollTop = list.scrollTop;
            var scrollTop = physicalScrollTop * (_virtualList.scrollScale || 1);
            var viewHeight = list.clientHeight;
            var ih = _virtualList.itemHeight + _virtualList.gap;
            var colCount = _virtualList.colCount;
            var buf = _virtualList.buffer;

            // 计算可见行范围
            var startRow = Math.max(0, Math.floor(scrollTop / ih) - buf);
            var endRow = Math.min(Math.ceil(items.length / colCount), Math.ceil((scrollTop + viewHeight) / ih) + buf);

            if (startRow === _virtualList.lastStart && endRow === _virtualList.lastEnd &&
                (_virtualList.scrollScale===1 || _virtualList.lastPhysicalScroll===physicalScrollTop)) return;
            _virtualList.lastPhysicalScroll=physicalScrollTop;
            _virtualList.lastStart = startRow;
            _virtualList.lastEnd = endRow;

            var startIdx = startRow * colCount;
            var endIdx = Math.min(items.length, endRow * colCount);

            var html = '';
            for (var i = startIdx; i < endIdx; i++) {
                var idx = items.at(i);
                var f = folderAssets[idx];
                var row = Math.floor(i / colCount);
                var col = i % colCount;
                var top = row * ih - scrollTop + physicalScrollTop;
                var left = col * (_virtualList.itemWidth + _virtualList.gap);
                var status = archiveAssetStatus(f);
                var unreadable = status === 'empty' || status === 'corrupt' || status === 'unsupported';
                html += '<div class="asset-item" style="position:absolute;top:' + top + 'px;left:' + left + 'px;width:' + _virtualList.itemWidth + 'px;" ' +
                    'data-idx="' + idx + '" ' +
                    'data-slot-status="' + status + '" ' +
                    'data-name="' + escapeHtml(f.name) + '" ' +
                    'ondblclick="addToCanvas(' + idx + ')" ' +
                    'draggable="true" ' +
                    'ondragstart="dragStart(event,' + idx + ')">' +
                    (unreadable ? '<span class="asset-placeholder" aria-hidden="true">' + (status === 'empty' ? '' : '—') + '</span>' :
                    '<img src="' + escapeHtml(f.url || '') + '" alt="' + escapeHtml(f.name) + '" loading="lazy" onload="archiveThumbnailReady(this)" onerror="archiveThumbnailFailed(this)">') +
                    (status === 'empty' ? '' : '<span class="asset-state" title="' + archiveStatusText(status) + '">' + (status === 'decoded' ? '' : archiveStatusText(status)) + '</span>') +
                    '<div class="name">' + escapeHtml(f.name) + '</div></div>';
            }

            var content = list.querySelector('.virtual-content');
            if (content) content.innerHTML = html;
        }

        // 虚拟滚动事件绑定
        (function() {
            var list = document.getElementById('assetsList');
            if (list) {
                list.addEventListener('scroll', function() {
                    requestAnimationFrame(_renderVisibleAssets);
                }, { passive: true });
            }
            // 窗口resize时重新计算列数
            window.addEventListener('resize', function() {
                if (_virtualList.filteredItems.length > 0) renderAllAssets();
            });
        })();

        function dragStart(e, idx) {
            if (!Number.isInteger(idx) || !selectorAssetAvailable(folderAssets[idx])) {
                if (e.preventDefault) e.preventDefault();
                return;
            }
            e.dataTransfer.setData('idx', idx);
            e.dataTransfer.setData('application/x-boo-archive-asset', JSON.stringify({ index:idx, generation:_archiveAssetGeneration }));
        }

        function addToCanvas(idx) {
            // 按钮/特效构建模式下双击不自动添加图片到画布
            if (typeof _assetGridMode !== 'undefined' && _assetGridMode !== 'normal') return;
            var f = folderAssets[idx];
            if (!selectorAssetAvailable(f)) return;
            var source = folderAssets, generation = _archiveAssetGeneration;

            var img = new Image();
            img.onload = function() {
                if (source !== folderAssets || generation !== _archiveAssetGeneration || !selectorAssetAvailable(folderAssets[idx])) return;
                var isBackground = findDialogBgIndex() < 0;
                // 首张对话框背景决定画布尺寸，文字等先添加的元素不改变其身份。
                if (isBackground) {
                    canvasW = img.width;
                    canvasH = img.height;
                    canvas.width = canvasW;
                    canvas.height = canvasH;
                    zoom = 1;
                    updateCanvasSize();
                }

                // PAK模式: 如果是第一个元素(背景), 设置对话框will序号
                if (window._pakMode && f.willIdx !== undefined && isBackground) {
                    dialogConfig.willIndex = '' + f.willIdx;
                    var wiInput = document.getElementById('willIndex');
                    if (wiInput) wiInput.value = '' + f.willIdx;
                }

                // 添加元素到数组 - 用户使用素材列表添加的素材使用<&img:格式
                var element = {
                    img: img,
                    x: 0,
                    y: 0,
                    w: img.width,
                    h: img.height,
                    name: f.name,
                    originalW: img.width,
                    originalH: img.height,
                    isImgTag: true,  // 标记为<img:格式
                    isDialogBg: isBackground,
                    assetIdx: getAssetImageIndex(f, idx),
                    willIdx: f.willIdx // PAK模式下的will序号(按元素独立)
                };
                elements.push(element);
                selectedIdx = elements.length - 1;


                updatePropsPanel();
                redraw();
            };
            img.onerror = function() {
                if (source !== folderAssets || generation !== _archiveAssetGeneration) return;
                console.error('图片加载失败:', f.url);
                showToast('⚠️ 图片加载失败: ' + f.name);
            };
            img.src = f.url;
        }

        // 画布拖拽
        canvas.ondragover = function(e) { e.preventDefault(); };
        canvas.ondrop = function(e) {
            e.preventDefault();
            var item;
            try { item = JSON.parse(e.dataTransfer.getData('application/x-boo-archive-asset')); }
            catch (_) { return; }
            if (item && item.generation === _archiveAssetGeneration && Number.isInteger(item.index) && item.index >= 0 && item.index < folderAssets.length) {
                addToCanvas(item.index);
            }
        };

        // 点击选择
        canvas.onmousedown = function(e) {
            var rect = canvas.getBoundingClientRect();
            var x = (e.clientX - rect.left) / zoom;
            var y = (e.clientY - rect.top) / zoom;

            for (var i = elements.length - 1; i >= 0; i--) {
                var el = elements[i];
                if (x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h) {
                    // Ctrl+点击进行多选
                    if (e.ctrlKey) {
                        var existingIdx = selectedIndices.indexOf(i);
                        if (existingIdx >= 0) {
                            // 已选中则取消选择
                            selectedIndices.splice(existingIdx, 1);
                            if (selectedIdx === i) {
                                selectedIdx = selectedIndices.length > 0 ? selectedIndices[selectedIndices.length - 1] : -1;
                            }
                        } else {
                            // 添加到多选
                            selectedIndices.push(i);
                            selectedIdx = i;
                        }
                        isDragging = true;
                        dragStartX = x;
                        dragStartY = y;
                        // 计算所有选中元素的偏移量
                        dragOffsets = [];
                        selectedIndices.forEach(function(idx) {
                            if (!canMoveCanvasElement(idx)) return;
                            dragOffsets.push({
                                idx: idx,
                                offsetX: x - elements[idx].x,
                                offsetY: y - elements[idx].y
                            });
                        });
                    } else {
                        // 普通点击，单选
                        if (!selectedIndices.includes(i)) {
                            selectedIndices = [];
                        }
                        selectedIdx = i;
                        isDragging = true;
                        dragStartX = x - el.x;
                        dragStartY = y - el.y;
                        dragOffsets = [{
                            idx: i,
                            offsetX: x - el.x,
                            offsetY: y - el.y
                        }];
                    }

                    // 背景仍可选中修改对话框参数，但点击它不启动拖动。
                    if (!canMoveCanvasElement(i)) isDragging = false;

                    // 按钮点击效果
                    if (el.isButton && el.buttonImgs) {
                        el.img = el.buttonImgs.click;
                        el.buttonState = 'click';
                    }

                    updatePropsPanel();
                    redraw();
                    return;
                }
            }
            // 点击空白处，清空选择
            if (!e.ctrlKey) {

                selectedIndices = [];
                updatePropsPanel();
                redraw();
            }
        };

        canvas.onmousemove = function(e) {
            var rect = canvas.getBoundingClientRect();
            var x = (e.clientX - rect.left) / zoom;
            var y = (e.clientY - rect.top) / zoom;

            // 检查鼠标是否悬停在按钮上
            var hoveredButton = null;
            for (var i = elements.length - 1; i >= 0; i--) {
                var el = elements[i];
                if (el.isButton && el.buttonImgs) {
                    if (x >= el.x && x <= el.x + el.w && y >= el.y && y <= el.y + el.h) {
                        hoveredButton = el;
                        if (el.buttonState !== 'click') {
                            el.img = el.buttonImgs.hover;
                            el.buttonState = 'hover';
                            redraw();
                        }
                        break;
                    } else if (el.buttonState !== 'default') {
                        el.img = el.buttonImgs.default;
                        el.buttonState = 'default';
                        redraw();
                    }
                }
            }

            if (!isDragging || selectedIdx < 0) return;

            // 多选拖拽移动
            if (selectedIndices.length > 0) {
                dragOffsets.forEach(function(item) {
                    if (!canMoveCanvasElement(item.idx)) return;
                    var dragX = x - item.offsetX;
                    var dragY = y - item.offsetY;
                    elements[item.idx].x = Math.round(dragX);
                    elements[item.idx].y = Math.round(dragY);
                });
            } else {
                // 单选拖拽移动
                if (!canMoveCanvasElement(selectedIdx)) return;
                var dragX = x - dragStartX;
                var dragY = y - dragStartY;
                elements[selectedIdx].x = Math.round(dragX);
                elements[selectedIdx].y = Math.round(dragY);

            markCanvasDirty();

        // 获取元素类型名称
        function getElementTypeName(el, idx, isDialogBg) {
            if (el.isText) return '文字';

            if (el.isEquipFrame) return '装备框';
            if (el.isProgressBar) return '进度条';
            if (el.isCountdown) return '倒计时';
            if (el.isInputText) return '文本框';
            if (el.isInputNum) return '数字框';
            if (el.isEffect) return '特效动画';
            if (el.isImgTag && isDialogBg) return '对话框背景';
            if (el.isImgTag) return 'IMG图片';
            return '图片';
        }

        // 同步关闭按钮坐标到对话框配置
        function syncCloseBtnToDialog() {
            for (var i = 0; i < elements.length; i++) {
                if (elements[i].isCloseBtn) {
                    dialogConfig.closeBtnX = Math.round(elements[i].x);
                    dialogConfig.closeBtnY = Math.round(elements[i].y);
                    return;
                }
            }
        }

        function isPlainCanvasImage(el) {
            return !!el && !!el.isImgTag && !el.isText && !el.isButton && !el.isCloseBtn &&
                !el.isEquipFrame && !el.isProgressBar && !el.isCountdown && !el.isInputText &&
                !el.isInputNum && !el.isTextInput && !el.isNumInput && !el.isEffect && !el.isAnim;
        }

        // 显式身份优先；旧保存数据无标记时才兼容首张普通图片。
        function findDialogBgIndex() {
            for (var i = 0; i < elements.length; i++) {
                if (isPlainCanvasImage(elements[i]) && elements[i].isDialogBg === true) return i;
            }
            for (var i = 0; i < elements.length; i++) {
                if (isPlainCanvasImage(elements[i]) && elements[i].isDialogBg === undefined) return i;
            }
            return -1;
        }

        function normalizeDialogBackground() {
            var backgroundIndex = findDialogBgIndex();
            elements.forEach(function(el, idx) {
                if (!isPlainCanvasImage(el)) return;
                el.isDialogBg = idx === backgroundIndex;
                if (el.isDialogBg) { el.x = 0; el.y = 0; }
            });
            return backgroundIndex;
        }

        function canMoveCanvasElement(idx) {
            return !!elements[idx] && idx !== findDialogBgIndex();

        // 更新对话框配置
        function updateDialogConfig(key, value) {
            // PAK模式下不允许手动修改willIndex
            if (key === 'willIndex' && window._pakMode) return;
            dialogConfig[key] = value;
            // 同步到 willIndex input
            if (key === 'willIndex') {
                var wi = document.getElementById('willIndex');
                if (wi) wi.value = value;
            }
            // 同步关闭按钮坐标到画布元素
            if (key === 'closeBtnX' || key === 'closeBtnY') {
                for (var i = 0; i < elements.length; i++) {
                    if (elements[i].isCloseBtn) {
                        if (key === 'closeBtnX') elements[i].x = value;
                        else elements[i].y = value;
                        break;
                    }
                }
            }
            syncCanvasToCode();
            redraw();
        }

        window.selectElement = function(idx) {
            selectedIdx = idx;
            updatePropsPanel();
            redraw();
        };

        window.deleteElement = function(idx, e) {
            if (e) e.stopPropagation();
            elements.splice(idx, 1);
            if (selectedIdx === idx) selectedIdx = -1;
            else if (selectedIdx > idx) selectedIdx--;

            // 检查是否还有特效元素，如果没有则停止动画
            var hasEffect = elements.some(function(el) { return el.isEffect || el.isAnim; });
            if (!hasEffect && effectAnimationId) {
                cancelAnimationFrame(effectAnimationId);
                effectAnimationId = null;
            }

            updatePropsPanel();
            redraw();
        };

        window.deleteSelected = function() {
            if (selectedIdx >= 0) {
                deleteElement(selectedIdx);
            }
        };

        window.updateElementProp = function(idx, prop, val) {
            if (!elements[idx]) return;
            if ((prop === 'x' || prop === 'y') && !canMoveCanvasElement(idx)) {
                updatePropsPanel();
                return;
            }
            elements[idx][prop] = parseInt(val) || 0;
            redraw();
        };

        // 更新倒计时属性
        window.updateCountdownProp = function(idx, prop, val) {
            var el = elements[idx];
            if (!el || !el.isCountdown) return;

            if (prop === 'seconds') {
                el.countdownSeconds = parseInt(val) || 59;
            } else if (prop === 'color') {
                el.countdownColor = parseInt(val) || 255;
            }
            updatePropsPanel();
            redraw();
        };

        // 渲染输入框到canvas (使用宋体12号)
        function renderInputToCanvas(width, height, bgColor, borderColor, textColor, placeholder, placeholderColor) {
            var tc = document.createElement('canvas');
            tc.width = width;
            tc.height = height;
            var tctx = tc.getContext('2d');

            // 背景
            tctx.fillStyle = getColorCss(bgColor);
            tctx.fillRect(0, 0, width, height);

            // 边框
            tctx.strokeStyle = getColorCss(borderColor);
            tctx.lineWidth = 1;
            tctx.strokeRect(0, 0, width, height);

            // 提示文字 (宋体12号)
            tctx.font = '12px SimSun, 宋体, serif';
            tctx.fillStyle = getColorCss(placeholderColor);
            tctx.textBaseline = 'middle';
            tctx.fillText(placeholder, 4, height / 2 + 1);

            return { canvas: tc, width: width, height: height };
        }

        // 更新文本框属性
        window.updateInputTextProp = function(idx, prop, val) {
            var el = elements[idx];
            if (!el || !el.isInputText) return;

            switch(prop) {
                case 'id': el.inputId = parseInt(val) || 1; break;
                case 'width': el.inputWidth = parseInt(val) || 120; break;
                case 'height': el.inputHeight = parseInt(val) || 30; break;
                case 'bgColor': el.inputBgColor = parseInt(val) || 0; break;
                case 'borderColor': el.inputBorderColor = parseInt(val) || 255; break;
                case 'textColor': el.inputTextColor = parseInt(val) || 255; break;
                case 'minLen': el.inputMinLen = parseInt(val) || 0; break;
                case 'maxLen': el.inputMaxLen = parseInt(val) || 20; break;
                case 'errorMsg': el.inputErrorMsg = val || '输入无效'; break;
                case 'placeholder': el.inputPlaceholder = val || '请输入'; break;
                case 'placeholderColor': el.inputPlaceholderColor = parseInt(val) || 128; break;
            }

            // 重新生成图片
            var result = renderInputToCanvas(
                el.inputWidth,
                el.inputHeight,
                el.inputBgColor,
                el.inputBorderColor,
                el.inputTextColor,
                el.inputPlaceholder,
                el.inputPlaceholderColor
            );
            var img = new Image();
            img.onload = function() {
                el.img = img;
                el.w = result.width;
                el.h = result.height;
                redraw();
            };
            img.src = result.canvas.toDataURL();
        };

                            font === '楷体' ? 'KaiTi, 楷体, serif' :
                            'SimHei, 黑体, sans-serif';
            var fontStr = fontWeight + size + 'px ' + fontFamily;

            tctx.font = fontStr;
            var metrics = tctx.measureText(text);
            var w = Math.ceil(metrics.width);
            var h = size + 8; // 根据字体大小调整高度
            if (script && script.trim()) h += 2; // 有脚本时增加高度用于下划线

            tc.width = w + 8;

            // 重新设置字体（canvas resize后会重置）
            tctx.font = fontStr;
            tctx.fillStyle = getColorCss(colorCode);
            tctx.textBaseline = 'middle';
            tctx.fillText(text, 4, h / 2);

            // 如果有触发脚本，绘制下划线
            if (script && script.trim()) {
                tctx.strokeStyle = getColorCss(colorCode);
                tctx.lineWidth = 1;
                tctx.beginPath();
                tctx.moveTo(4, h - 4);

        function archiveSelectorNavigation(pak, query, previousPage) {
            query = String(query || '').trim();
            var integerText = /^\d+$/.test(query);
            var numericText = integerText || /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(query);
            var matches = assetSelectionView(pak, numericText ? '' : query);
            var result = { matches: matches, page: numericText ? previousPage || 0 : 0, locatedIndex: -1, status: '' };
            if (!numericText) return result;
            var id = Number(query);
            if (!integerText || !Number.isSafeInteger(id)) {
                result.status = '请输入非负整数 ID'; return result;
            }
            var found = assetSelectionView(pak, String(id));
            if (!found.length) { result.status = '未找到 ID ' + id; return result; }
            if (found.length > 1) {
                result.status = pak ? '此素材包中 ID 重复' : '多个素材包含此 ID，请先选包'; return result;
            }
            result.locatedIndex = found.at(0);

        // 添加特效到画布
        window.addEffectToCanvas = function(startIdx, localIdx, frameCount, speed, x, y) {
            var startAsset = folderAssets[startIdx];
            var source = folderAssets, generation = _archiveAssetGeneration;

            if (!startAsset) {
                showToast('⚠️ 素材未找到');
                return;
            }
            var imgIdx = (localIdx !== null && localIdx !== undefined) ? localIdx : startIdx;

            // 加载所有帧图片
            var loadedFrames = [];
            var loadedCount = 0;

            for (var i = 0; i < frameCount; i++) {
                var frameAsset = getEffectFrameAsset(startAsset, startIdx, i);
                if (frameAsset) {
                    (function(offset, asset) {
                        var frameImg = new Image();
                        frameImg.onload = function() {
                            if (source !== folderAssets || generation !== _archiveAssetGeneration) return;
                            loadedFrames[offset] = frameImg;
                            loadedCount++;
                            if (loadedCount >= frameCount) finalizeEffect();
                        };
                        frameImg.onerror = function() {
                            if (source !== folderAssets || generation !== _archiveAssetGeneration) return;
                            loadedCount++;
                            if (loadedCount >= frameCount) finalizeEffect();
                        };
                        frameImg.src = asset.url;
                    })(i, frameAsset);
                } else {
                    loadedCount++;
                    if (loadedCount >= frameCount) finalizeEffect();
                }
            }

            function finalizeEffect() {
                if (source !== folderAssets || generation !== _archiveAssetGeneration) return;
                var firstImg = loadedFrames.find(function(img) { return !!img; });
                if (!firstImg) {
                    showToast('⚠️ 无法加载特效图片');
                    return;
                }
                var missingFrames = fillMissingEffectFrames(loadedFrames, frameCount, firstImg.width, firstImg.height);
                if (missingFrames > 0) showToast('⚠️ 特效包含 ' + missingFrames + ' 个空槽，预览使用透明帧');

                // 如果是第一个元素，设置画布大小
                if (elements.length === 0) {
                    canvasW = firstImg.width;
                    canvasH = firstImg.height;
                    canvas.width = canvasW;
                    canvas.height = canvasH;
                    zoom = 1;
                    updateCanvasSize();
                }

                var effectEl = {
                    img: firstImg,
                    x: x,
                    y: y,
                    w: firstImg.width,
                    h: firstImg.height,
                    name: '特效: ' + startAsset.name,
                    isEffect: true,
                    willIdx: startAsset.willIdx,
                    effectStartIdx: imgIdx,
                    effectFrameCount: frameCount,
                    effectSpeed: speed,
                    effectFrames: loadedFrames,
                    effectCurrentFrame: 0,
                    effectLastTime: Date.now()
                };

                elements.push(effectEl);
                selectedIdx = elements.length - 1;
                updatePropsPanel();
                redraw();
                showToast('✅ 特效已添加到画布');

                // 启动动画循环
                startEffectAnimation();
            }
        };
