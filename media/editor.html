            }
            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                var dx = e.clientX - rsStartX;
                var dy = e.clientY - rsStartY;
                var minW = 180, minH = 120;
                var newW = rsStartW, newH = rsStartH, newL = rsStartL, newT = rsStartT;

                if (resizeDir.indexOf('e') >= 0) newW = Math.max(minW, rsStartW + dx);
                if (resizeDir.indexOf('w') >= 0) { newW = Math.max(minW, rsStartW - dx); newL = rsStartL + rsStartW - newW; }
                if (resizeDir.indexOf('s') >= 0) newH = Math.max(minH, rsStartH + dy);
                if (resizeDir.indexOf('n') >= 0) { newH = Math.max(minH, rsStartH - dy); newT = rsStartT + rsStartH - newH; }

                codeArea.style.width = newW + 'px';
                codeArea.style.height = newH + 'px';
                codeArea.style.left = newL + 'px';
                codeArea.style.top = newT + 'px';
            });
            document.addEventListener('mouseup', function() {
                isResizing = false;
            });
        })();

        // 初始化时请求历史数据
        if (_vscode) {
            _vscode.postMessage({ type: 'getHistory' });
            _vscode.postMessage({ type: 'getQuickImports' });
            _vscode.postMessage({ type: 'getDefaultMaterials' });
            _vscode.postMessage({ type: 'getEnginePref' });
        }

        // ==================== 浮动画布 ====================
        function toggleFloatCanvas() {
            if (_vscode) {
                _vscode.postMessage({ type: 'openFloatCanvas' });
            }
        }

        function canvasImageReady(img) {
            return !!img && (img instanceof HTMLCanvasElement || (img.complete && img.naturalWidth > 0));
        }

        function durableCanvasImageSource(img) {
            if (!img) return '';
            var source = typeof img.src === 'string' ? img.src : '';
            if (source && !source.startsWith('blob:')) return source;
            if (!canvasImageReady(img)) return '';
            var cached = _durableCanvasImages.get(img);
            if (cached && cached.source === source) return cached.url;
            var raster = img;
            if (!(img instanceof HTMLCanvasElement)) {
                raster = document.createElement('canvas');
                raster.width = img.naturalWidth; raster.height = img.naturalHeight;
                raster.getContext('2d').drawImage(img, 0, 0);
            }
            var url = raster.toDataURL();
            _durableCanvasImages.set(img, { source: source, url: url });
            return url;
        }

        // Keep image sources, not DOM objects; sparse archive catalogs belong to the host.
        function serializeElement(el) {
            var s = {};
            for (var key in el) {
                if (Object.prototype.hasOwnProperty.call(el, key) &&
                    ['img', 'effectFrames', 'animFrames', 'buttonImgs'].indexOf(key) < 0 && typeof el[key] !== 'function') {
                    s[key] = el[key];
                }
            }
            s._imgSrc = durableCanvasImageSource(el.img);
            if (Array.isArray(el.effectFrames)) s._effectFrameSrcs = el.effectFrames.map(durableCanvasImageSource);
            if (Array.isArray(el.animFrames)) s._animFrameSrcs = el.animFrames.map(durableCanvasImageSource);
            if (el.buttonImgs) {
                s._buttonImageSrcs = {};
                ['default', 'hover', 'click'].forEach(function(state) {
                    s._buttonImageSrcs[state] = durableCanvasImageSource(el.buttonImgs[state]);
                });
            }
            return s;
        }

        function persistEditorState(force) {
            if (!_editorStateInitialized || _restoringEditorState || !_vscode || typeof _vscode.setState !== 'function') return;
            if (force !== true) {
                if (_editorStateSaveFrame === null) _editorStateSaveFrame = requestAnimationFrame(function() {
                    _editorStateSaveFrame = null;
                    persistEditorState(true);
                });
                return;
            }
            if (_editorStateSaveFrame !== null) { cancelAnimationFrame(_editorStateSaveFrame); _editorStateSaveFrame = null; }
            try {
                normalizeDialogBackground();
                var code = document.getElementById('codeOutput'), will = document.getElementById('willIndex');
                var snapshot = {
                    version: 1, elements: elements.map(serializeElement), canvasW: canvasW, canvasH: canvasH,
                    zoom: zoom, dialogConfig: Object.assign({}, dialogConfig), currentEngine: currentEngine,
                    selectedIdx: selectedIdx, selectedIndices: selectedIndices.slice(),
                    codeText: code ? code.value : '', willIndexText: will ? will.value : '',
                    lastCodeSnapshot: _lastCodeSnapshot, codeAreaVisible: _codeAreaVisible
                };
                var json = JSON.stringify(snapshot);
                if (json === _lastEditorStateJson) return;
                _vscode.setState(snapshot);
                _lastEditorStateJson = json;
            } catch (error) {
                console.warn('[BOO] 保存画布窗口状态失败', error);
            }
        }

        function restoreEditorState(snapshot) {
            if (!snapshot || snapshot.version !== 1 || !Array.isArray(snapshot.elements) ||
                !Number.isFinite(snapshot.canvasW) || snapshot.canvasW <= 0 ||
                !Number.isFinite(snapshot.canvasH) || snapshot.canvasH <= 0 ||
                !snapshot.elements.every(function(el) {
                    return !!el && ['x','y','w','h'].every(function(key) { return Number.isFinite(el[key]); });
                })) return false;
            _restoringEditorState = true;
            try {
                if (_canvasToCodeTimer) { clearTimeout(_canvasToCodeTimer); _canvasToCodeTimer = null; }
                if (_codeToCanvasTimer) { clearTimeout(_codeToCanvasTimer); _codeToCanvasTimer = null; }
                canvasW = snapshot.canvasW; canvasH = snapshot.canvasH;
                canvas.width = canvasW; canvas.height = canvasH;
                zoom = Number.isFinite(snapshot.zoom) && snapshot.zoom > 0 ? snapshot.zoom : 1;
                if (snapshot.dialogConfig && typeof snapshot.dialogConfig === 'object') {
                    Object.keys(dialogConfig).forEach(function(key) {
                        if (Object.prototype.hasOwnProperty.call(snapshot.dialogConfig, key)) dialogConfig[key] = snapshot.dialogConfig[key];
                    });
                }
                if (ENGINE_CONFIG[snapshot.currentEngine]) currentEngine = snapshot.currentEngine;
                document.getElementById('engineSelect').value = currentEngine;
                document.getElementById('engineIndicator').className = 'engine-indicator ' + engCfg().cssClass;
                updateEngineCompatibilityUi();
                document.getElementById('willIndex').value = typeof snapshot.willIndexText === 'string'
                    ? snapshot.willIndexText : String(dialogConfig.willIndex || '');
                deserializeAndApplyElements(snapshot.elements);
                selectedIdx = Number.isInteger(snapshot.selectedIdx) && snapshot.selectedIdx >= 0 && snapshot.selectedIdx < elements.length
                    ? snapshot.selectedIdx : -1;
                selectedIndices = Array.isArray(snapshot.selectedIndices) ? snapshot.selectedIndices.filter(function(idx) {
                    return Number.isInteger(idx) && idx >= 0 && idx < elements.length;
                }) : [];
                var code = document.getElementById('codeOutput');
                code.value = typeof snapshot.codeText === 'string' ? snapshot.codeText : '';
                _lastCodeSnapshot = typeof snapshot.lastCodeSnapshot === 'string' ? snapshot.lastCodeSnapshot : code.value;
                if (typeof snapshot.codeAreaVisible === 'boolean' && snapshot.codeAreaVisible !== _codeAreaVisible) toggleCodeArea();
                updateCanvasSize(); updatePropsPanel(); redrawCanvasOnly();
                return true;
            } finally { _restoringEditorState = false; }
        }

        var _applyingRemote = false;

        // 反序列化并应用到当前画布
        function deserializeAndApplyElements(arr) {
            _applyingRemote = true;
            var generation = ++_canvasRestoreGeneration, newElements = [], loads = [];
            function restoreImage(source, el) {
                if (!source || typeof source !== 'string') {
                    var blank = document.createElement('canvas');
                    blank.width = Math.max(1, Math.ceil(el.w || 1)); blank.height = Math.max(1, Math.ceil(el.h || 1));
                    return blank;
                }
                var img = new Image();
                loads.push(new Promise(function(resolve) {
                    img.onload = function() {
                        if (generation === _canvasRestoreGeneration && elements === newElements) redrawCanvasOnly();
                        resolve(true);
                    };
                    img.onerror = function() { resolve(false); };
                }));
                img.src = source;
                return img;
            }
            for (var i = 0; i < arr.length; i++) {
                var s = arr[i];
                var el = {};
                for (var key in s) {
                    if (Object.prototype.hasOwnProperty.call(s, key) &&
                        ['_imgSrc', '_effectFrameSrcs', '_animFrameSrcs', '_buttonImageSrcs', '__proto__', 'constructor', 'prototype'].indexOf(key) < 0) {
                        el[key] = s[key];
                    }
                }
                // 重建img对象
                if (el.isText && typeof renderTextToCanvas === 'function') {
                    var result = renderTextToCanvas(el.textContent || '文字', el.textColor, el.textScript || '', el.textFont || '宋体', el.textSize || 12, el.textBold || false);
                    el.img = restoreImage(result.canvas.toDataURL(), el);
                } else {
                    el.img = restoreImage(s._imgSrc, el);
                }
                if (Array.isArray(s._effectFrameSrcs) && s._effectFrameSrcs.length) {
                    el.effectFrames = s._effectFrameSrcs.map(function(source) { return restoreImage(source, el); });
                    el.effectCurrentFrame = Math.max(0, Math.floor(el.effectCurrentFrame || 0)) % el.effectFrames.length;
                    el.effectLastTime = Date.now(); el.img = el.effectFrames[el.effectCurrentFrame];
                }
                if (Array.isArray(s._animFrameSrcs) && s._animFrameSrcs.length) {
                    el.animFrames = s._animFrameSrcs.map(function(source) { return restoreImage(source, el); });
                    el.animCurrentFrame = Math.max(0, Math.floor(el.animCurrentFrame || 0)) % el.animFrames.length;
                    el.animLastTime = Date.now(); el.img = el.animFrames[el.animCurrentFrame];
                }
                if (s._buttonImageSrcs && typeof s._buttonImageSrcs === 'object') {
                    el.buttonImgs = {};
                    ['default', 'hover', 'click'].forEach(function(state) {
                        el.buttonImgs[state] = restoreImage(s._buttonImageSrcs[state] || s._buttonImageSrcs.default || s._imgSrc, el);
                    });
                    el.buttonState = 'default'; el.img = el.buttonImgs.default;
                }
                newElements.push(el);
            }
            elements = newElements;
            selectedIdx = elements.length > 0 ? 0 : -1;
            selectedIndices = [];
            redraw();
            Promise.all(loads).then(function() {
                if (generation !== _canvasRestoreGeneration || elements !== newElements) return;
                redrawCanvasOnly();
                if (elements.some(function(el) { return el.isEffect || el.isAnim; })) startEffectAnimation();
            });
            // 延迟重置 _applyingRemote，确保 debounce 的 syncCanvasToCode 被拦截
            setTimeout(function() { if (generation === _canvasRestoreGeneration) _applyingRemote = false; }, 500);
        }

        // 浮动画布模式下，元素改动时同步到主面板
        var _floatOrigSyncCanvasToCode = syncCanvasToCode;
        syncCanvasToCode = function() {
            _floatOrigSyncCanvasToCode();
            if (window._floatMode && _vscode && !_applyingRemote) {
                _vscode.postMessage({
                    type: 'syncElements',
                    elements: elements.map(serializeElement),
                    canvasW: canvasW,
                    canvasH: canvasH,
                    dialogConfig: dialogConfig
                });
            }
        };

        // 填充事件委托函数映射 — IIFE内普通function不在window上
        _actionFnMap = {
            requestOpenPakFiles: requestOpenPakFiles,
            requestOpenPakHistory: requestOpenPakHistory,
            requestReloadAssets: requestReloadAssets,
            switchVisiblePakTab: switchVisiblePakTab, requestClosePak: requestClosePak,
            requestClearCanvas: requestClearCanvas, addTextElement: addTextElement,
            showImageSelector: showImageSelector, showEffectSelector: showEffectSelector,
            showButtonSelector: showButtonSelector, showCountdownSelector: showCountdownSelector,
            addInputTextToCanvas: addInputTextToCanvas, addInputNumToCanvas: addInputNumToCanvas,
            toggleFloatCanvas: toggleFloatCanvas, toggleCodeArea: toggleCodeArea,
            unlinkFromEditor: unlinkFromEditor, selectCloseBtnFiles: selectCloseBtnFiles,
            callCloseBtnToCanvas: callCloseBtnToCanvas, selectEquipFrameFiles: selectEquipFrameFiles,
            callEquipFrameToCanvas: callEquipFrameToCanvas, selectProgressBarFiles: selectProgressBarFiles,
            callProgressBarToCanvas: callProgressBarToCanvas,
            deleteSelected: deleteSelected, selectElement: selectElement,
            deleteElement: deleteElement, closeColorPicker: closeColorPicker,
            confirmColorPick: confirmColorPick, previewColorCell: previewColorCell,
            closeImageSelector: closeImageSelector, selectImageForCanvas: selectImageForCanvas,
            closeButtonSelector: closeButtonSelector, selectButtonImage: selectButtonImage,
            activateButtonSlot: activateButtonSlot, resetButtonSlot: resetButtonSlot,
            confirmAddButton: confirmAddButton, closeCountdownSelector: closeCountdownSelector,
            confirmAddCountdown: confirmAddCountdown, closeEffectSelector: closeEffectSelector,
            selectEffectImage: selectEffectImage, confirmAddEffect: confirmAddEffect,
            showColorPicker: showColorPicker, pickColorCell: pickColorCell,
            addToCanvas: addToCanvas, addEffectToCanvas: addEffectToCanvas,
            addCountdownToCanvas: addCountdownToCanvas, addButtonToCanvas: addButtonToCanvas
        };

        // 导出内联事件处理器(onchange/ondblclick/ondragstart等)引用的函数和变量
        window.addToCanvas = addToCanvas;
        window.inspectArchiveAsset = inspectArchiveAsset;
        window.locateArchiveAsset = locateArchiveAsset;
        window.archiveThumbnailFailed = archiveThumbnailFailed;
        window.archiveThumbnailReady = archiveThumbnailReady;
        window.dragStart = dragStart;
        window.switchEngine = switchEngine;
        window.dialogConfig = dialogConfig;
        window.syncCanvasToCode = syncCanvasToCode;
        window.updateDialogConfig = updateDialogConfig;
        window.updateTextElement = updateTextElement;
        window.getColorCss = getColorCss;
        window.switchPakTab = switchPakTab;
        window.switchEngine = switchEngine;
        window.switchDialogPak = switchDialogPak;
        window.buildPakTabsHTML = buildPakTabsHTML;
        window.renderDialogGrid = renderDialogGrid;
        window.applyCloseBtnDefault = applyCloseBtnDefault;
        window.applyCloseBtnAsset = applyCloseBtnAsset;
        window.selectCloseBtnLocal = selectCloseBtnLocal;
        window.confirmCloseBtnSelection = confirmCloseBtnSelection;
        window.applyCloseBtnSelection = applyCloseBtnSelection;
        window.applyEquipFrameDefault = applyEquipFrameDefault;
        window.applyEquipFrameAsset = applyEquipFrameAsset;
        window.selectEquipFrameLocal = selectEquipFrameLocal;
        window.confirmEquipFrameSelection = confirmEquipFrameSelection;
        window.applyEquipFrameSelection = applyEquipFrameSelection;
        window.togglePropsPanel = togglePropsPanel;

        restoreEditorState(_savedEditorState);
        _savedEditorState = null;
        _editorStateInitialized = true;
        persistEditorState(true);
        document.addEventListener('change', function() { persistEditorState(true); });
        document.addEventListener('mouseup', function() { persistEditorState(true); });
        document.addEventListener('keyup', function() { persistEditorState(true); });
        window.addEventListener('pagehide', function() { persistEditorState(true); });
        document.addEventListener('visibilitychange', function() { if (document.hidden) persistEditorState(true); });

        // Host restores resources and moves this webview only after initialization.
        if (_vscode) {
            _vscode.postMessage({ type: 'ready', documentId: _editorDocumentId });
        }
        })();
    </script>
