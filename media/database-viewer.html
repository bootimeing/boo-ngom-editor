<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="{{TABULATOR_CSS_URI}}">
<style>
:root{color-scheme:dark;--bg:#181a1f;--panel:#202329;--line:#353a43;--muted:#9299a5;--text:#d9dde5;--accent:#32b7d8;--warm:#f0a84a;--ok:#45b879;--danger:#df6b72}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",sans-serif;font-size:13px}
button,input,select{font:inherit}
button{color:var(--text)}
.topbar{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-bottom:1px solid var(--line);background:#1d2025}
.title{font-size:15px;font-weight:600;color:var(--warm);white-space:nowrap}
.info{min-width:0;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;flex:0 0 auto;gap:2px;min-height:37px;padding:5px 8px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:#1b1e23}
.tab{height:31px;padding:0 12px;border:1px solid transparent;border-bottom:0;background:transparent;color:#aeb5c0;cursor:pointer;white-space:nowrap}
.tab:hover{background:#272b32;color:#fff}
.tab.active{border-color:var(--line);background:var(--panel);color:var(--accent)}
.actions{display:flex;align-items:center;gap:6px;min-height:43px;padding:5px 10px;border-bottom:1px solid var(--line);background:#1d2025}
.command-button{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:31px;padding:0 10px;border:1px solid #454b56;border-radius:4px;background:#272b32;cursor:pointer;white-space:nowrap}
.command-button:hover:not(:disabled){border-color:#647080;background:#323740}
.command-button.primary{border-color:#237e94;background:#176b82;color:#fff}
.command-button.danger{color:#f3a0a5}
.command-button:disabled{opacity:.35;cursor:default}
.command-icon{width:16px;text-align:center;font-size:16px;line-height:1}
.readonly-note{min-width:0;margin-left:auto;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.equipment-filters{display:flex;flex:0 0 auto;gap:4px;min-height:40px;padding:5px 10px;overflow-x:auto;border-bottom:1px solid var(--line);background:#1b1e23}
.filter-chip{height:29px;padding:0 10px;border:1px solid #414751;border-radius:4px;background:#24282e;color:#b9c0ca;cursor:pointer;white-space:nowrap}
.filter-chip:hover{border-color:#5b6672;background:#2e333b;color:#fff}
.filter-chip.active{border-color:#25839a;background:#176b82;color:#fff}
.controls{display:grid;grid-template-columns:minmax(180px,1fr) minmax(120px,180px) auto auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.search,.select,.text-input{height:32px;border:1px solid #454b56;border-radius:4px;background:#17191d;color:#f2f4f7;outline:none}
.search,.text-input{width:100%;padding:0 10px}
.select{padding:0 8px}
.search:focus,.select:focus,.text-input:focus{border-color:var(--accent)}
.segments{display:flex;height:32px;border:1px solid #454b56;border-radius:4px;overflow:hidden}
.segments button{min-width:52px;border:0;border-right:1px solid #454b56;background:#242830;cursor:pointer}
.segments button:last-child{border-right:0}
.segments button.active{background:#176b82;color:#fff}
.page-size{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.main{position:relative;min-width:0;min-height:0;flex:1}
.empty{display:grid;place-items:center;height:100%;min-height:120px;color:#69717e;text-align:center}
.grid-pane{position:absolute;inset:0;min-width:0;min-height:0;background:var(--bg)}
.table-wrap{position:absolute;inset:0;overflow:hidden}
.fill-handle{position:absolute;z-index:25;display:none;width:9px;height:9px;border:1px solid var(--bg);background:var(--accent);cursor:crosshair}
.field-name{display:block;color:#f1b762;font-weight:600}
.field-label{display:block;margin-top:2px;color:#9ca4af;font-family:"Microsoft YaHei",sans-serif;font-size:10px;font-weight:400}
.name-text{font-weight:600;text-shadow:0 1px 1px #000}
.row-context{position:fixed;z-index:45;display:grid;min-width:150px;padding:4px;border:1px solid #4c535e;border-radius:5px;background:#24272d;box-shadow:0 10px 28px rgba(0,0,0,.42)}
.menu-button{height:30px;padding:0 10px;border:0;border-radius:3px;background:transparent;color:#d9dde5;text-align:left;cursor:pointer}
.menu-button:hover:not(:disabled){background:#343a43}
.menu-button.danger{color:#f2a1a6}
.menu-button:disabled{opacity:.35;cursor:default}
.menu-separator{height:1px;margin:4px 2px;background:#414650}
.loading{position:absolute;inset:0;display:none;place-items:center;background:rgba(24,26,31,.78);z-index:10;color:#b8c0ca}
.loading.visible{display:grid}
.footer{display:flex;align-items:center;gap:5px;min-height:42px;padding:6px 10px;border-top:1px solid var(--line);background:#1d2025}
.pager{display:flex;align-items:center;gap:4px}
.icon-button{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid #454b56;border-radius:4px;background:#272b32;cursor:pointer;font-size:16px}
.icon-button:hover:not(:disabled){border-color:#5d6674;background:#323740}
.icon-button:disabled{opacity:.35;cursor:default}
.page-number{width:58px;height:30px;padding:0 6px;border:1px solid #454b56;border-radius:4px;background:#17191d;color:#fff;text-align:center}
.page-text,.status{color:var(--muted);font-size:12px;white-space:nowrap}
.status{min-width:0;margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.error{color:var(--danger)}
.modal-layer{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:rgba(8,10,13,.76)}
.modal{display:flex;flex-direction:column;width:min(940px,96vw);max-height:88vh;border:1px solid #4b525e;border-radius:6px;background:#202329;box-shadow:0 18px 55px rgba(0,0,0,.48)}
.modal.narrow{width:min(780px,96vw)}
.modal.confirm-modal{width:min(430px,94vw)}
.modal-header{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-bottom:1px solid var(--line)}
.modal-title{font-size:14px;font-weight:600;color:var(--warm)}
.modal-subtitle{min-width:0;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close-button{margin-left:auto}
.modal>form{display:flex;flex:1;min-height:0;flex-direction:column}
.modal-body{flex:1;min-height:0;overflow:auto;padding:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:7px;padding:9px 12px;border-top:1px solid var(--line)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:9px 10px}
.form-field{display:block;min-width:0}
.form-label{display:flex;align-items:baseline;gap:6px;min-width:0;margin-bottom:4px}
.form-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e8ed;font-family:Consolas,monospace;font-size:11px}
.form-translation{color:var(--muted);font-size:10px;white-space:nowrap}
.form-type{margin-left:auto;color:#68717e;font-size:9px;white-space:nowrap}
.text-input:disabled{opacity:.45}
.schema-list{display:grid;gap:5px}
.schema-row{display:grid;grid-template-columns:64px minmax(180px,1fr) 130px 34px;gap:6px;align-items:center}
.schema-order{display:flex;gap:3px}
.schema-order .icon-button{width:29px;height:29px}
.schema-type{height:32px;padding:7px 8px;border:1px solid #3c424c;border-radius:4px;background:#191c20;color:#9fa7b3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.schema-add{margin-top:10px}
.confirm-message{padding:18px 16px;color:#d8dce3;line-height:1.7;white-space:pre-wrap}
.increment-body{display:grid;gap:8px;padding:16px}
.increment-label{color:#c7ccd4;font-size:12px}
.increment-summary{color:var(--muted);font-size:11px}
#table{width:100%;height:100%;min-width:0;outline:none}
#table.empty{display:grid;place-items:center;color:#69717e;text-align:center}
.tabulator{height:100%;border:0;background:var(--bg);color:var(--text);font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}
.tabulator .tabulator-header{border-bottom:1px solid #49515d;background:#292d34;color:var(--warm)}
.tabulator .tabulator-header .tabulator-col,.tabulator .tabulator-row-header{min-height:43px;border-right:1px solid #3b414a;background:#292d34}
.tabulator .tabulator-header .tabulator-col.tabulator-row-header,.tabulator-row .tabulator-cell.tabulator-row-header{width:1px!important;min-width:1px!important;max-width:1px!important;padding:0!important;border:0!important;color:transparent!important;overflow:hidden}
.tabulator .tabulator-header .tabulator-col:hover{background:#343942}
.tabulator .tabulator-header .tabulator-col .tabulator-col-content{padding:4px 9px}
.tabulator .tabulator-header .tabulator-col .tabulator-col-title{white-space:nowrap}
.tabulator .tabulator-tableholder{overflow:auto!important;scrollbar-width:auto;scrollbar-color:#687280 #17191d;background:var(--bg)}
.tabulator .tabulator-tableholder::-webkit-scrollbar{width:12px;height:12px}
.tabulator .tabulator-tableholder::-webkit-scrollbar-track{background:#17191d}
.tabulator .tabulator-tableholder::-webkit-scrollbar-thumb{border:2px solid #17191d;border-radius:5px;background:#687280}
.tabulator .tabulator-tableholder::-webkit-scrollbar-thumb:hover{background:#818c9b}
.tabulator .tabulator-tableholder::-webkit-scrollbar-corner{background:#17191d}
.tabulator .tabulator-tableholder .tabulator-table{background:var(--bg)}
.tabulator-row,.tabulator-row.tabulator-row-even{min-height:29px;border-bottom:1px solid #2b2f35;background:#181a1f;color:var(--text)}
.tabulator-row.tabulator-row-even{background:#1b1d22}
.tabulator-row:hover,.tabulator-row.tabulator-row-even:hover{background:#242a31}
.tabulator-row .tabulator-cell{height:29px;padding:5px 9px;border-right:1px solid #30343b;background:transparent;color:var(--text);white-space:nowrap}
.tabulator-row .tabulator-cell.tabulator-frozen{background:#1d2025}
.tabulator-row.boo-selected-row,.tabulator-row.boo-selected-row.tabulator-row-even{background:#193946}
.tabulator-row.boo-selected-row .tabulator-cell.tabulator-frozen{background:#1a3d49}
.tabulator .tabulator-header .tabulator-col.tabulator-frozen{background:#252930}
.tabulator .tabulator-header .tabulator-col.database-frozen-end,.tabulator-row .tabulator-cell.database-frozen-end{box-shadow:2px 0 0 #49515d,5px 0 8px rgba(0,0,0,.22)}
.tabulator-row .tabulator-cell.database-name-column{font-weight:600}
.tabulator-row .tabulator-cell.tabulator-editing{padding:0;background:#102d38!important}
.tabulator-row .tabulator-cell.tabulator-editing input{height:28px;padding:3px 8px;border:1px solid var(--accent);border-radius:0;background:#101b20;color:#fff;font:inherit;outline:none}
.tabulator .tabulator-range{border:1px solid #35badb;background:transparent!important}
.tabulator .tabulator-tableholder .tabulator-range-overlay .tabulator-range.tabulator-range-active:after{display:none}
.tabulator .tabulator-range-cell-active{outline:1px solid #74d9ef;outline-offset:-1px}
.tabulator-row .tabulator-cell.tabulator-range-selected:not(.tabulator-range-only-cell-selected):not(.tabulator-range-row-header){background:#214b59!important;color:#fff!important}
.tabulator .tabulator-header .tabulator-col.tabulator-range-highlight,.tabulator-row.tabulator-range-highlight .tabulator-cell.tabulator-range-row-header{background:#31525d!important;color:#fff}
.tabulator-row .tabulator-cell.tabulator-range-row-header{padding:0;text-align:center;color:#8f98a5}
.tabulator-placeholder{color:#69717e}
@media(max-width:760px){
  .actions{overflow-x:auto}.readonly-note{display:none}
  .controls{grid-template-columns:1fr 130px}.segments,.page-size{justify-self:stretch}.status{display:none}
  .form-grid{grid-template-columns:1fr}
  .schema-row{grid-template-columns:64px minmax(130px,1fr) 90px 34px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="title">BOO 数据库编辑器</div>
  <div class="info" id="info">正在读取数据库目录...</div>
</header>
<nav class="tabs" id="tabs" aria-label="数据库表"></nav>
<section class="actions" aria-label="数据库操作">
  <button class="command-button" id="manageFields" type="button" title="管理字段"><span class="command-icon">☷</span>字段管理</button>
  <button class="icon-button" id="refreshPage" type="button" title="重新读取当前表">↻</button>
  <div class="readonly-note" id="readonlyNote"></div>
</section>
<section class="equipment-filters" id="equipmentFilters" aria-label="装备分类" hidden></section>
<section class="controls">
  <input class="search" id="search" type="search" placeholder="搜索" autocomplete="off">
  <select class="select" id="searchColumn" title="搜索字段"><option value="">全部字段</option></select>
  <div class="segments" aria-label="匹配方式">
    <button type="button" class="active" data-mode="contains">模糊</button>
    <button type="button" data-mode="exact">精确</button>
  </div>
  <label class="page-size">每页
    <select class="select" id="pageSize"><option>50</option><option selected>100</option><option>200</option></select>
  </label>
</section>
<main class="main">
  <section class="grid-pane">
    <div class="table-wrap" id="tableWrap">
      <div class="empty" id="table" tabindex="0">等待数据库</div>
      <div class="fill-handle" id="fillHandle" title="拖动递增填充" aria-hidden="true"></div>
    </div>
    <div class="loading" id="loading">正在读取...</div>
  </section>
</main>
<footer class="footer">
  <div class="pager">
    <button class="icon-button" id="firstPage" type="button" title="第一页">«</button>
    <button class="icon-button" id="prevPage" type="button" title="上一页">‹</button>
    <input class="page-number" id="pageNumber" type="number" min="1" value="1" title="页码">
    <span class="page-text" id="pageText">/ 1</span>
    <button class="icon-button" id="nextPage" type="button" title="下一页">›</button>
    <button class="icon-button" id="lastPage" type="button" title="最后一页">»</button>
  </div>
  <div class="status" id="status">0 条记录</div>
</footer>

<div class="modal-layer" id="schemaModal" hidden>
  <section class="modal narrow" role="dialog" aria-modal="true" aria-labelledby="schemaModalTitle">
    <header class="modal-header">
      <div class="modal-title" id="schemaModalTitle">字段管理</div>
      <div class="modal-subtitle" id="schemaModalSubtitle"></div>
      <button class="icon-button close-button" type="button" data-close-modal title="关闭">×</button>
    </header>
    <div class="modal-body">
      <div class="schema-list" id="schemaList"></div>
      <button class="command-button schema-add" id="addField" type="button"><span class="command-icon">＋</span>添加字段</button>
    </div>
    <footer class="modal-footer">
      <button class="command-button" type="button" data-close-modal>取消</button>
      <button class="command-button primary" id="applySchema" type="button">应用字段变更</button>
    </footer>
  </section>
</div>

<div class="modal-layer" id="confirmModal" hidden>
  <section class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <header class="modal-header">
      <div class="modal-title" id="confirmTitle">确认操作</div>
    </header>
    <div class="confirm-message" id="confirmMessage"></div>
    <footer class="modal-footer">
      <button class="command-button" id="confirmCancel" type="button">取消</button>
      <button class="command-button danger" id="confirmAccept" type="button">确认</button>
    </footer>
  </section>
</div>

<div class="modal-layer" id="incrementModal" hidden>
  <section class="modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="incrementTitle">
    <header class="modal-header">
      <div class="modal-title" id="incrementTitle">选区递增</div>
    </header>
    <div class="increment-body">
      <label class="increment-label" for="incrementValue">递增值</label>
      <input class="text-input" id="incrementValue" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="1">
      <div class="increment-summary" id="incrementSummary"></div>
    </div>
    <footer class="modal-footer">
      <button class="command-button" id="incrementCancel" type="button">取消</button>
      <button class="command-button primary" id="incrementAccept" type="button">确认递增</button>
    </footer>
  </section>
</div>

<div class="row-context" id="rowContextMenu" hidden>
  <button class="menu-button" id="contextIncrementCells" type="button">递增</button>
  <div class="menu-separator"></div>
  <button class="menu-button" id="contextAddRow" type="button">新增空行</button>
  <button class="menu-button" id="contextCopyRow" type="button">复制此行</button>
  <button class="menu-button" id="contextPasteRow" type="button">粘贴到此行</button>
  <div class="menu-separator"></div>
  <button class="menu-button danger" id="contextDeleteRow" type="button">删除此行</button>
</div>

<script src="{{TABLE_EDITOR_CORE_URI}}"></script>
<script src="{{TABULATOR_JS_URI}}"></script>

  match=lower.match(/^element(\d{0,2})$/);if(match)return VALUE_LABELS[Number(match[1]||1)-1]||'元素属性';
  match=lower.match(/^needl(\d{1,2})$/);if(match)return '修炼等级'+match[1];

  currentColumns=nextColumns;currentRows=message.rows||[];totalRows=Number(message.total||0);
  pageIndex=Math.floor(Number(message.offset||0)/Number(message.limit||pageSize));selectedRow=-1;
  var finish=function(){
    document.getElementById('table').dataset.ready='true';
    if(restoreTableViewport){
      var viewport=getGridViewport();viewport.scrollLeft=restoreTableViewport.left;viewport.scrollTop=restoreTableViewport.top;restoreTableViewport=null;
    }else resetTableViewport();

      var selectedIndex=currentRows.findIndex(function(row){return Number(row.__booRowId)===Number(pendingSelectRowId)});
      if(selectedIndex>=0){selectRow(selectedIndex);requestVisualDetail(currentRows[selectedIndex]);var selectedComponent=getGridRow(selectedIndex);if(selectedComponent)void selectedComponent.scrollTo('nearest',false)}

function applyOptimisticUpdates(updates,knownRollback){

  var rollback=[];suppressGridEvents=true;

    (updates||[]).forEach(function(update){
      var row=currentRows.find(function(candidate){return Number(candidate.__booRowId)===Number(update.rowId)});if(!row)return;
      var rowComponent=databaseGrid&&databaseGrid.getRow(update.rowId);
      Object.keys(update.values||{}).forEach(function(column){
        var key=String(update.rowId)+'\u0000'+column;
        rollback.push({rowId:update.rowId,column:column,value:known.has(key)?known.get(key):row[column]});
        row[column]=update.values[column];
        var cell=rowComponent&&rowComponent.getCell(column);if(cell)cell.setValue(update.values[column],false);
      });
    });
  }finally{suppressGridEvents=false}
  pendingGridRollback=rollback;
}

      row[entry.column]=entry.value;
      var rowComponent=databaseGrid&&databaseGrid.getRow(entry.rowId),cell=rowComponent&&rowComponent.getCell(entry.column);if(cell)cell.setValue(entry.value,false);
    });
  }finally{suppressGridEvents=false;pendingGridRollback=[]}

    if(!name){showError('字段名不能为空');return}
    if(names[key]){showError('字段名“'+name+'”重复');return}
    names[key]=true;columns.push({sourceName:column.sourceName,name:name,type:column.type||'TEXT'});
  }
  showConfirmDialog(
    '应用字段变更',
    '确认应用字段新增、改名、删除或排序？',
    '应用',
    function(){sendUpdateDatabaseSchema(columns)}
  );
}

function loadMutationResult(message){
  if(Number(message.requestId)!==activeMutationRequestId)return;
  mutationPending=false;pendingGridRollback=[];setLoading(false);
  if(message.table){
    var index=tables.findIndex(function(table){return table.id===message.table.id});
    if(index>=0)tables[index]=message.table;
    if(currentTable&&currentTable.id===message.table.id)currentTable=message.table;
  }
  databaseTotal=Number(message.totalCount||databaseTotal);updateInfo();renderTabs();
  var operation=message.result&&message.result.operation;
  var labels={create:'新增完成',update:'修改完成',delete:'删除完成',schema:'字段更新完成'};
  var backup=message.result&&message.result.backupPath?String(message.result.backupPath).split(/[\\/]/).pop():'';
  var detailNotice=pendingNotice;
  pendingNotice=(labels[operation]||'数据库更新完成')+(backup?' | 备份: '+backup:'')+(detailNotice?' | '+detailNotice:'');
  if(operation==='schema'){
    document.getElementById('schemaModal').hidden=true;equipmentFilter=null;sortColumn='';restoreRangeBounds=null;document.getElementById('search').value='';populateSearchColumns(currentTable.columns||[]);renderEquipmentFilters();
  }
  if(operation==='create'){
    pendingSelectRowId=message.result.rowId;equipmentFilter=activeEquipmentFilters()[0];sortColumn='';sortDirection='asc';restoreRangeBounds=null;
    document.getElementById('search').value='';document.getElementById('searchColumn').value='';renderEquipmentFilters();
    pageIndex=Math.max(0,Math.ceil(Number(currentTable.rowCount||0)/pageSize)-1);
  }else{
    var pages=Math.max(1,Math.ceil(Number(currentTable.rowCount||0)/pageSize));pageIndex=Math.min(pageIndex,pages-1);
  }
  if(operation==='delete'){selectedRow=-1;restoreRangeBounds=null}
  updateActionState();requestPage(operation==='update');
}
function loadUndoResult(message){
  if(Number(message.requestId)!==activeMutationRequestId)return;
  mutationPending=false;pendingGridRollback=[];setLoading(false);
  var catalog=message.catalog||{},result=message.result||{},previousTableId=currentTable&&currentTable.id;
  var previousSearchColumn=document.getElementById('searchColumn').value;
  tables=catalog.tables||[];databaseType=catalog.dbType||databaseType;databaseTotal=Number(catalog.totalCount||0);
  currentTable=tables.find(function(table){return table.id===result.tableId})||tables[0]||null;
  currentRows=[];currentColumns=currentTable?(currentTable.columns||[]):[];selectedRow=-1;
  if(!currentTable){updateInfo();renderTabs();updateActionState();showError('撤回后未找到可读取的数据表');return}
  if(previousTableId!==currentTable.id||result.revertedOperation==='schema'){
    pageIndex=0;equipmentFilter=null;sortColumn='';sortDirection='asc';restoreTableViewport=null;restoreRangeBounds=null;
    document.getElementById('search').value='';previousSearchColumn='';
  }else{
    var pages=Math.max(1,Math.ceil(Number(currentTable.rowCount||0)/pageSize));pageIndex=Math.min(pageIndex,pages-1);
    if((currentTable.columns||[]).indexOf(sortColumn)<0)sortColumn='';
  }
  populateSearchColumns(currentTable.columns||[]);
  if((currentTable.columns||[]).indexOf(previousSearchColumn)>=0)document.getElementById('searchColumn').value=previousSearchColumn;
  renderTabs();renderEquipmentFilters();updateInfo();
  pendingSelectRowId=result.revertedOperation==='create'?null:(result.rowId==null?pendingSelectRowId:result.rowId);
  var labels={create:'新增记录',update:'修改记录',delete:'删除记录',schema:'字段变更'};
  var backup=result.backupPath?String(result.backupPath).split(/[\\/]/).pop():'';
  pendingNotice='已撤回上一步'+(labels[result.revertedOperation]||'数据库修改')+(backup?' | 撤回前备份: '+backup:'');
  updateActionState();requestPage();
}
function showMutationError(message){
  if(Number(message.requestId)!==activeMutationRequestId)return;
  mutationPending=false;restoreOptimisticGrid();restoreTableViewport=null;restoreRangeBounds=null;pendingSelectRowId=null;setLoading(false);updateActionState();updateFillHandle();showError(message.error||'数据库写入失败');
}
function showError(message){setLoading(false);document.getElementById('status').innerHTML='<span class="error">'+escapeHtml(message||'数据库读取失败')+'</span>'}

window.addEventListener('resize',syncFrozenColumnOffsets);
document.addEventListener('copy',function(event){if(shouldHandleGridClipboard(event.target))writeGridSelectionToEvent(event)},true);
document.addEventListener('cut',function(event){if(shouldHandleGridClipboard(event.target)&&writeGridSelectionToEvent(event))clearSelectedGridCells()},true);
document.addEventListener('paste',function(event){
  if(!shouldHandleGridClipboard(event.target)||!event.clipboardData)return;
  event.preventDefault();event.stopImmediatePropagation();pasteGridMatrix(tableCore.parseClipboardText(event.clipboardData.getData('text/plain')));
},true);
document.getElementById('search').addEventListener('input',queueSearch);
document.getElementById('searchColumn').addEventListener('change',function(){pageIndex=0;requestPage()});
document.getElementById('pageSize').addEventListener('change',function(){pageSize=Number(this.value)||100;pageIndex=0;requestPage()});
document.querySelector('.segments').addEventListener('click',function(event){var button=event.target.closest('[data-mode]');if(button)setMatchMode(button.getAttribute('data-mode'))});
document.getElementById('firstPage').addEventListener('click',function(){goToPage(0)});
document.getElementById('prevPage').addEventListener('click',function(){goToPage(pageIndex-1)});
document.getElementById('nextPage').addEventListener('click',function(){goToPage(pageIndex+1)});
document.getElementById('lastPage').addEventListener('click',function(){goToPage(Math.ceil(totalRows/pageSize)-1)});
document.getElementById('pageNumber').addEventListener('change',function(){goToPage((Number(this.value)||1)-1)});
document.getElementById('manageFields').addEventListener('click',openSchemaModal);
document.getElementById('refreshPage').addEventListener('click',requestPage);
document.getElementById('addField').addEventListener('click',addSchemaField);
document.getElementById('applySchema').addEventListener('click',applySchemaChanges);
document.getElementById('confirmCancel').addEventListener('click',function(){finishConfirmDialog(false)});
document.getElementById('confirmAccept').addEventListener('click',function(){finishConfirmDialog(true)});
document.getElementById('incrementCancel').addEventListener('click',function(){document.getElementById('incrementModal').hidden=true;incrementBounds=null});
document.getElementById('incrementAccept').addEventListener('click',applySelectionIncrement);
document.getElementById('incrementValue').addEventListener('keydown',function(event){
  if(event.key==='Enter'){event.preventDefault();applySelectionIncrement()}
  else if(event.key==='Escape'){event.preventDefault();document.getElementById('incrementModal').hidden=true;incrementBounds=null}
});
document.getElementById('contextIncrementCells').addEventListener('click',function(){hideRowContextMenu();openIncrementModal()});
document.getElementById('contextAddRow').addEventListener('click',function(){hideRowContextMenu();addEmptyRow()});
document.getElementById('contextCopyRow').addEventListener('click',copySelectedRow);
document.getElementById('contextPasteRow').addEventListener('click',function(){hideRowContextMenu();pasteCopiedRow()});
document.getElementById('contextDeleteRow').addEventListener('click',function(){hideRowContextMenu();deleteSelectedRow()});
document.querySelectorAll('[data-close-modal]').forEach(function(button){button.addEventListener('click',closeModals)});
document.addEventListener('mousedown',function(event){
  if(!event.target.closest('#rowContextMenu'))hideRowContextMenu();
});
document.getElementById('fillHandle').addEventListener('mousedown',beginGridFill);
document.addEventListener('mouseup',finishGridFill);
document.addEventListener('keydown',function(event){
  var key=String(event.key).toLowerCase();
  if(event.ctrlKey&&!event.shiftKey&&key==='z'&&!isTextInputTarget(event.target)){
    event.preventDefault();requestDatabaseUndo();return;
  }
  if(event.key==='Escape'){if(isGridCellEditor(event.target))return;if(activeCellEdit)cancelCellEdit();else closeModals();return}
  if(event.ctrlKey&&key==='f'){event.preventDefault();document.getElementById('search').focus();document.getElementById('search').select()}
  if(!databaseGrid||isGridCellEditor(event.target))return;
  var root=document.getElementById('table'),gridFocused=root.contains(event.target)||root.contains(document.activeElement);if(!gridFocused)return;
  var command=event.ctrlKey||event.metaKey;
  if(command&&key==='d'&&!event.shiftKey&&!event.altKey){event.preventDefault();event.stopImmediatePropagation();fillSelectedGridRange()}
  else if(command&&key==='a'){event.preventDefault();event.stopImmediatePropagation();selectGridBounds({top:0,bottom:currentRows.length-1,left:0,right:currentColumns.length-1},false)}
  else if(event.key==='Delete'||event.key==='Backspace'){event.preventDefault();event.stopImmediatePropagation();clearSelectedGridCells()}
  else if(event.key==='F2'){event.preventDefault();event.stopImmediatePropagation();startCellEdit()}
  else if(event.key.length===1&&!command&&!event.altKey){event.preventDefault();event.stopImmediatePropagation();startCellEdit(event.key)}
},true);
window.addEventListener('message',function(event){
  var message=event.data||{};
  if(message.type==='databaseCatalog')loadCatalog(message);
  else if(message.type==='databasePage')loadPage(message);
  else if(message.type==='databaseMutationResult')loadMutationResult(message);
  else if(message.type==='databaseUndoResult')loadUndoResult(message);
  else if(message.type==='databaseMutationError'||message.type==='databaseUndoError')showMutationError(message);
  else if(message.type==='databaseError')showError(message.error);
});
updateActionState();
vscode.postMessage({type:'ready'});
</script>
</body>
</html>
