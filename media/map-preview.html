<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>地图预览</title>
<style>
:root{--bg:#181818;--panel:#242424;--line:#383838;--fg:#d8d8d8;--muted:#999;--accent:#0078d4;--input:#1f1f1f}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Microsoft YaHei",sans-serif}
button,input,select{font:inherit}
.root{height:100%;display:flex;flex-direction:column}
.toolbar{height:42px;display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
.title{min-width:0;flex:1;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;font-size:13px;font-weight:600}
#mapName{min-width:0;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:11px;font-weight:400;margin-left:8px}
.npc-jumpbar{height:35px;display:flex;align-items:center;gap:8px;padding:4px 10px;background:#202020;border-bottom:1px solid var(--line);flex-shrink:0}
.npc-jumpbar[hidden]{display:none}.npc-jump-label{flex:none;color:#aaa;font-size:11px}
.npc-jump-list{min-width:0;flex:1;display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.npc-jump{height:25px;max-width:150px;flex:none;padding:0 8px;border:1px solid #484848;border-radius:2px;background:#2b2b2b;color:#ccc;cursor:pointer;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.npc-jump:hover{border-color:#777;background:#353535}.npc-jump.active{border-color:var(--accent);background:#153c5c;color:#fff}
.layer-toggle{height:27px;flex:none;padding:0 9px;border:1px solid #4a4a4a;border-radius:2px;background:#2d2d2d;color:#ddd;cursor:pointer;font-size:11px}
.layer-toggle:hover{background:#383838}.layer-toggle:disabled{cursor:wait;opacity:.55}
.segments{height:28px;display:flex;border:1px solid #4a4a4a}
.segments button{height:26px;padding:0 9px;border:0;border-right:1px solid #4a4a4a;background:#2c2c2c;color:#bbb;cursor:pointer;font-size:11px}
.segments button:last-child{border-right:0}
.segments button.active{background:var(--accent);color:white}
.icon{width:28px;height:28px;border:0;background:transparent;color:#ddd;cursor:pointer;font-size:16px}
.icon:hover{background:#333}
.zoom-value{width:38px;text-align:center;color:#bbb;font-size:11px;font-variant-numeric:tabular-nums}
.workspace{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.viewport{position:relative;min-width:0;overflow:hidden;background:#0b0b0b}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#entities{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.marker{position:absolute;transform:translate(-50%,-50%);padding:0 2px;border:1px solid transparent;font-family:SimSun,"宋体",serif;font-size:12px;font-weight:400;letter-spacing:0;line-height:16px;white-space:nowrap;text-shadow:1px 1px 1px #000,-1px -1px 1px #000,1px -1px 1px #000,-1px 1px 1px #000;pointer-events:auto;cursor:move;user-select:none}
.marker:hover{background:rgba(255,255,255,.12)}
.marker.selected{border-color:#fff;background:rgba(0,120,212,.42)}
.marker.dragging{border-color:#ffcf40;background:rgba(0,120,212,.58)}
.map-entity{position:absolute;pointer-events:auto;user-select:none;cursor:move}
.npc-entity{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%) scale(var(--entity-scale,1));transform-origin:50% 100%}
.npc-sprite{display:block;max-width:280px;max-height:260px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.npc-sprite[hidden]{display:none}
.npc-entity.offset-positioned{display:block;transform:scale(var(--entity-scale,1));transform-origin:0 0}
.npc-entity.offset-positioned .npc-sprite{width:100%;height:100%;max-width:none;max-height:none;object-fit:fill}
.npc-icon-entity{position:absolute;display:block;transform:scale(var(--entity-scale,1));transform-origin:0 0;pointer-events:none}
.npc-icon-sprite{display:block;width:100%;height:100%;max-width:none;max-height:none;object-fit:fill;image-rendering:pixelated;pointer-events:none}
.npc-icon-sprite[hidden]{display:none}.npc-icon-entity.effect{mix-blend-mode:screen}
.npc-placeholder{width:24px;height:34px;border:1px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.35)}
.entity-name{position:relative;z-index:2;padding:0 2px;font:12px/16px SimSun,"宋体",serif;letter-spacing:0;white-space:nowrap;text-align:center;text-shadow:1px 1px 1px #000,-1px -1px 1px #000,1px -1px 1px #000,-1px 1px 1px #000}
.npc-map-name{position:absolute;z-index:4;transform:translate(-50%,calc(-100% + var(--npc-name-half-line,8px)));white-space:pre;text-align:center;pointer-events:none}
.spawn-entity{transform:translate(-50%,-50%) scale(var(--entity-scale,1));transform-origin:50% 50%;padding:0 3px;border:1px solid transparent;color:#ff8080;background:rgba(30,0,0,.34)}
.spawn-entity:hover,.spawn-entity.selected{outline:1px solid rgba(255,255,255,.86);outline-offset:2px}
.spawn-entity.dragging{outline-color:#ffcf40;background-color:rgba(0,120,212,.32)}
.spawn-range{position:absolute;pointer-events:none;border:2px solid rgba(255,74,74,.9);border-radius:50%;background:rgba(255,47,47,.19);transform:translate(-50%,-50%)}
.coords,.status{position:absolute;z-index:3;background:rgba(0,0,0,.78);padding:4px 7px;font-size:11px;pointer-events:none}
.coords{top:8px;left:8px;color:#ffcf40}
.status{bottom:8px;left:8px;color:#bbb;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warning{color:#ffb454}
.render-progress{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));padding:12px 14px;border:1px solid #525252;background:rgba(24,24,24,.96);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.render-progress[hidden]{display:none}.render-progress-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:11px}.render-progress-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ccc}.render-progress-percent{flex:none;color:#ffcf40;font-variant-numeric:tabular-nums}.render-progress-track{height:6px;background:#333;overflow:hidden}.render-progress-bar{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.map-navigator{position:absolute;z-index:5;right:12px;bottom:12px;width:min(240px,calc(100% - 24px));height:min(165px,calc(100% - 24px));min-width:210px;min-height:140px;border:1px solid #777;background:#111;box-shadow:0 4px 16px rgba(0,0,0,.58);display:flex;flex-direction:column}
.map-navigator[hidden]{display:none}.map-navigator.expanded{width:clamp(300px,38%,360px);height:clamp(200px,38%,240px);max-width:calc(100% - 24px);max-height:calc(100% - 24px)}
.map-navigator-head{height:27px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 8px;background:rgba(32,32,32,.96);border-bottom:1px solid #555;color:#ccc;font-size:11px;flex:none}
.map-navigator-toggle{width:24px;height:22px;border:0;background:transparent;color:#ddd;cursor:pointer;font-size:15px}.map-navigator-toggle:hover{background:#3a3a3a}
.map-navigator-body{position:relative;min-height:0;flex:1;overflow:hidden;cursor:crosshair;touch-action:none}
.map-navigator canvas{position:absolute;inset:0;width:100%;height:100%}.map-navigator-overlay{z-index:1}
.inspector{min-width:0;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.inspector-head{height:42px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.save-state{font-size:11px;font-weight:400;color:var(--muted)}
.save-state.saving{color:#e5c07b}
.save-state.saved{color:#73c991}
.save-state.error{color:#f48771}
.inspector-content{min-height:0;flex:1;overflow:auto}
.editor-empty{padding:18px 12px;color:var(--muted);font-size:12px;line-height:1.7}
.marker-form,.entity-form{display:none;padding:12px}
.marker-form.visible,.entity-form.visible{display:block}
.field{display:block;margin-bottom:11px}
.field>span{display:block;margin-bottom:5px;color:#bbb;font-size:11px}
.field input,.field select,.field textarea{width:100%;border:1px solid #4a4a4a;border-radius:2px;outline:none;background:var(--input);color:var(--fg);padding:0 7px}
.field input,.field select{height:30px}.field textarea{min-height:96px;resize:vertical;padding:7px;font:12px/1.55 Consolas,"Microsoft YaHei UI",sans-serif;white-space:pre}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.coordinate-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color-row{display:grid;grid-template-columns:36px minmax(0,1fr);gap:7px}
.color-row input[type=color]{padding:2px;cursor:pointer}
.line-number{padding-top:3px;color:#777;font-size:10px}
.add-panel{display:none;padding:12px;border-top:1px solid var(--line)}
.add-panel.visible{display:block}
.section-title{margin-bottom:11px;font-size:12px;font-weight:600;color:#ddd}
.check-row{display:flex;gap:18px;min-height:30px;align-items:center}
.check{display:flex;align-items:center;gap:6px;cursor:pointer;color:#ccc;font-size:12px}
.check input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
.add-state{min-height:17px;margin-top:8px;font-size:11px;color:var(--muted)}
.add-state.saved{color:#73c991}
.add-state.error{color:#f48771}
.inspector-footer{flex-shrink:0;padding:9px 12px;border-top:1px solid var(--line);background:#202020}
.command{width:100%;height:32px;border:1px solid #4a4a4a;border-radius:2px;background:#2d2d2d;color:#ddd;cursor:pointer}
.command:hover{background:#363636}
.command.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.command.primary:hover{background:#1686d9}
.command.danger{margin-top:12px;border-color:#8b3a3a;background:#3b2424;color:#f0b1b1}
.command.danger:hover{background:#512929}
.command:disabled{cursor:default;opacity:.55}
.entity-note{margin:-3px 0 11px;color:#888;font-size:10px;line-height:1.5;word-break:break-all}
.map-transfer-row{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:7px;align-items:start}
.map-combobox{position:relative;min-width:0}
.map-choice-list{position:absolute;z-index:12;left:0;right:0;top:32px;max-height:190px;overflow:auto;border:1px solid #555;background:#202020;box-shadow:0 7px 18px rgba(0,0,0,.48)}
.map-choice-list[hidden]{display:none}.map-choice{display:block;width:100%;min-height:34px;padding:5px 7px;border:0;border-bottom:1px solid #343434;background:transparent;color:#ddd;text-align:left;cursor:pointer;overflow:hidden}
.map-choice:last-child{border-bottom:0}.map-choice:hover,.map-choice.active{background:#154b73}.map-choice-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.map-choice-code{display:block;margin-top:2px;color:#999;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-transfer{height:30px;border:1px solid #4a4a4a;border-radius:2px;background:#2d2d2d;color:#ddd;cursor:pointer}.map-transfer:hover{background:#363636}.map-transfer:disabled{cursor:default;opacity:.55}
.spawn-fields{display:grid;gap:0}
.hidden{display:none!important}
@media(max-width:760px){
  .workspace{grid-template-columns:minmax(0,1fr) 250px}
  .meta{display:none}
  .segments button{padding:0 6px}
  .map-navigator{min-width:190px;width:min(220px,calc(100% - 20px));right:10px;bottom:10px}
  .map-navigator.expanded{width:clamp(260px,52%,320px);height:clamp(190px,42%,220px);max-width:calc(100% - 20px);max-height:calc(100% - 20px)}
}
</style>
</head>
<body>
<div class="root">
  <div class="toolbar">
    <div class="title"><span id="mapName">地图预览</span><button class="layer-toggle" id="mapLayerToggle" type="button">原始地图</button><span class="meta" id="mapMeta"></span></div>
    <div class="segments" id="modeTabs">
      <button data-mode="-1" class="active">全部</button>
      <button data-mode="0">大地图</button>
      <button data-mode="1">小地图</button>
    </div>
    <button class="icon" id="zoomOut" title="缩小">−</button>
    <span class="zoom-value" id="zoomValue">100%</span>
    <button class="icon" id="zoomIn" title="放大">+</button>
    <button class="icon" id="reset" title="恢复 100%">↻</button>
    <button class="icon" id="refresh" title="重新读取">⟳</button>
  </div>
  <div class="npc-jumpbar" id="npcJumpBar" hidden><span class="npc-jump-label">NPC</span><div class="npc-jump-list" id="npcJumpList"></div></div>
  <div class="workspace">
    <div class="viewport" id="viewport" tabindex="0">
      <canvas id="mapCanvas"></canvas>
      <div id="markers"></div>
      <div id="entities"></div>
      <div class="coords" id="coords">坐标: 0, 0</div>
      <div class="status" id="status">请选择地图</div>
      <div class="render-progress" id="renderProgress" hidden>
        <div class="render-progress-head"><span class="render-progress-label" id="renderProgressLabel">正在准备原始地图</span><span class="render-progress-percent" id="renderProgressPercent">0%</span></div>
        <div class="render-progress-track"><div class="render-progress-bar" id="renderProgressBar"></div></div>
      </div>
      <div class="map-navigator" id="mapNavigator" hidden>
        <div class="map-navigator-head"><span>地图导航</span><button class="map-navigator-toggle" id="mapNavigatorToggle" type="button" title="展开导航图" aria-label="展开导航图">⛶</button></div>
        <div class="map-navigator-body" id="mapNavigatorBody">
          <canvas id="mapNavigatorCanvas"></canvas>
          <canvas class="map-navigator-overlay" id="mapNavigatorOverlay"></canvas>
        </div>
      </div>
    </div>
    <aside class="inspector">
      <div class="inspector-head"><span id="inspectorTitle">标识编辑器</span><span class="save-state" id="saveState"></span></div>
      <div class="inspector-content">
        <div class="editor-empty" id="editorEmpty">请点击地图上的文字标识</div>
        <form class="marker-form" id="markerForm">
          <label class="field">
            <span>地图名字</span>
            <input id="markerMapName" maxlength="120" autocomplete="off">
          </label>
          <div class="coordinate-row">
            <label class="field">
              <span>坐标 X</span>
              <input id="markerX" type="number" min="0" step="1">
            </label>
            <label class="field">
              <span>坐标 Y</span>
              <input id="markerY" type="number" min="0" step="1">
            </label>
          </div>
          <label class="field">
            <span>显示文字</span>
            <input id="markerText" maxlength="300" autocomplete="off">
          </label>
          <label class="field">
            <span>文字颜色</span>
            <span class="color-row">
              <input id="markerColorPicker" type="color" value="#ffffff" title="选择颜色">
              <input id="markerColor" maxlength="16" autocomplete="off">
            </span>
          </label>
          <label class="field">
            <span>标识所在</span>
            <select id="markerMode">
              <option value="0">大地图</option>
              <option value="1">小地图</option>
            </select>
          </label>
          <div class="line-number" id="markerLine"></div>
          <button class="command danger" id="deleteMarker" type="button">删除标识</button>
        </form>
        <form class="entity-form" id="npcForm">
          <label class="field"><span>NPC 名字</span><input id="npcName" readonly></label>
          <div class="coordinate-row">
            <label class="field"><span>坐标 X</span><input id="npcX" type="number" min="0" step="1"></label>
            <label class="field"><span>坐标 Y</span><input id="npcY" type="number" min="0" step="1"></label>
          </div>
          <label class="field"><span>外观编号</span><input id="npcAppearance" type="number" min="0" step="1"></label>
          <div class="entity-note" id="npcAppearanceInfo"></div>
          <div class="field">
            <span>切换到地图</span>
            <div class="map-transfer-row">
              <div class="map-combobox">
                <input id="npcTargetMap" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" placeholder="输入地图名字或编号">
                <div class="map-choice-list" id="npcMapChoices" role="listbox" hidden></div>
              </div>
              <button class="map-transfer" id="moveNpcToMap" type="button">切换地图</button>
            </div>
          </div>
          <label class="field"><span>NPC 顶戴</span><textarea id="npcIconText" spellcheck="false"></textarea></label>
          <div class="entity-note" id="npcIconInfo"></div>
          <div class="line-number" id="npcLine"></div>
          <button class="command primary" id="openNpcScript" type="button">打开 NPC 文件</button>
        </form>
        <form class="entity-form" id="spawnForm">
          <div class="spawn-fields" id="spawnFields"></div>
          <label class="check"><input id="showSpawnRange" type="checkbox"><span>显示刷怪范围</span></label>
          <div class="line-number" id="spawnLine"></div>
        </form>
        <form class="add-panel" id="addMarkerForm">
          <div class="section-title">新增标识</div>
          <label class="field">
            <span>当前地图</span>
            <input id="addMapName" readonly>
          </label>
          <div class="coordinate-row">
            <label class="field">
              <span>坐标 X</span>
              <input id="addX" type="number" min="0" step="1" value="0">
            </label>
            <label class="field">
              <span>坐标 Y</span>
              <input id="addY" type="number" min="0" step="1" value="0">
            </label>
          </div>
          <label class="field">
            <span>显示文字</span>
            <input id="addText" maxlength="300" value="标识文字" autocomplete="off">
          </label>
          <label class="field">
            <span>文字颜色</span>
            <span class="color-row">
              <input id="addColorPicker" type="color" value="#00ffff" title="选择颜色">
              <input id="addColor" maxlength="16" value="$FFFF00" autocomplete="off">
            </span>
          </label>
          <div class="field">
            <span>标识所在</span>
            <div class="check-row">
              <label class="check"><input id="addLargeMap" type="checkbox" checked><span>大地图</span></label>
              <label class="check"><input id="addSmallMap" type="checkbox"><span>小地图</span></label>
            </div>
          </div>
          <button class="command primary" id="confirmAddMarker" type="submit">确认添加</button>
          <div class="add-state" id="addState"></div>
        </form>
      </div>
      <div class="inspector-footer" id="inspectorFooter">
        <button class="command" id="toggleAddMarker" type="button">+ 增加地图标识</button>
      </div>
    </aside>
  </div>
</div>
<script>
const vscode=acquireVsCodeApi();
const viewport=document.getElementById('viewport'),canvas=document.getElementById('mapCanvas'),ctx=canvas.getContext('2d');
const markerLayer=document.getElementById('markers'),entityLayer=document.getElementById('entities'),status=document.getElementById('status');
const mapLayerToggle=document.getElementById('mapLayerToggle'),renderProgress=document.getElementById('renderProgress');
const npcJumpBar=document.getElementById('npcJumpBar'),npcJumpList=document.getElementById('npcJumpList');
const mapNavigator=document.getElementById('mapNavigator'),mapNavigatorBody=document.getElementById('mapNavigatorBody');
const mapNavigatorCanvas=document.getElementById('mapNavigatorCanvas'),mapNavigatorContext=mapNavigatorCanvas.getContext('2d');
const mapNavigatorOverlay=document.getElementById('mapNavigatorOverlay'),mapNavigatorOverlayContext=mapNavigatorOverlay.getContext('2d');
const markerForm=document.getElementById('markerForm'),editorEmpty=document.getElementById('editorEmpty'),saveState=document.getElementById('saveState');
const deleteMarker=document.getElementById('deleteMarker');
const addMarkerForm=document.getElementById('addMarkerForm'),addState=document.getElementById('addState'),confirmAddMarker=document.getElementById('confirmAddMarker');
const inspectorTitle=document.getElementById('inspectorTitle'),inspectorFooter=document.getElementById('inspectorFooter');
const npcForm=document.getElementById('npcForm'),spawnForm=document.getElementById('spawnForm'),spawnFields=document.getElementById('spawnFields');
const editor={
  mapName:document.getElementById('markerMapName'),
  x:document.getElementById('markerX'),
  y:document.getElementById('markerY'),
  text:document.getElementById('markerText'),
  color:document.getElementById('markerColor'),
  colorPicker:document.getElementById('markerColorPicker'),
  mode:document.getElementById('markerMode'),
  line:document.getElementById('markerLine')
};
const addEditor={
  mapName:document.getElementById('addMapName'),
  x:document.getElementById('addX'),
  y:document.getElementById('addY'),
  text:document.getElementById('addText'),
  color:document.getElementById('addColor'),
  colorPicker:document.getElementById('addColorPicker'),
  largeMap:document.getElementById('addLargeMap'),
  smallMap:document.getElementById('addSmallMap')
};
const npcEditor={
  name:document.getElementById('npcName'),x:document.getElementById('npcX'),y:document.getElementById('npcY'),
  appearance:document.getElementById('npcAppearance'),info:document.getElementById('npcAppearanceInfo'),
  targetMap:document.getElementById('npcTargetMap'),mapChoices:document.getElementById('npcMapChoices'),
  moveButton:document.getElementById('moveNpcToMap'),
  iconText:document.getElementById('npcIconText'),iconInfo:document.getElementById('npcIconInfo'),line:document.getElementById('npcLine')
};
const state={
  worldW:1,worldH:1,scale:1,offsetX:0,offsetY:0,dragging:false,lastX:0,lastY:0,
  image:null,imageToken:0,markers:[],mode:-1,map:null,warning:'',selectedLine:0,
  formSync:false,saveTimer:0,pendingDraft:null,saveRequest:0,pendingRequest:0,
  editVersion:0,requestVersions:new Map(),markerFile:'',addRequest:0,pendingAddRequest:0,
  panMoved:false,pointerDownX:0,pointerDownY:0,markerDragging:false,markerDragLine:0,
  markerDragMoved:false,markerStartX:0,markerStartY:0,deleteRequest:0,pendingDeleteRequest:0,
  maps:[],npcs:[],spawns:[],safeZones:[],merchantColumns:[],monGenColumns:[],engine:'GOM',entityWarnings:[],

function layoutEntities(){

    range.style.left=(state.offsetX+spawn.x*48*state.scale)+'px';
    range.style.top=(state.offsetY+spawn.y*32*state.scale)+'px';

function layoutEntityNode(node){

function layoutNpcName(name){

    (-1*fontScale)+'px '+(-1*fontScale)+'px '+(1*fontScale)+'px #000,'+
    (1*fontScale)+'px '+(-1*fontScale)+'px '+(1*fontScale)+'px #000,'+
    (-1*fontScale)+'px '+(1*fontScale)+'px '+(1*fontScale)+'px #000';

function zoom(factor,cx,cy){
  const old=state.scale;
  state.scale=Math.max(.02,Math.min(20,state.scale*factor));
  state.offsetX=cx-(cx-state.offsetX)*(state.scale/old);
  state.offsetY=cy-(cy-state.offsetY)*(state.scale/old);
  render();
}

  updateStatus();

    const image=new Image();

function updateStatus(){
  const layerText=state.original.active?'原始地图 100%':'预览地图';

  const entityWarning=state.original.active&&state.entityWarnings.length?' · '+state.entityWarnings.join('；'):'';

    ? layerText+' · NPC '+state.npcs.length+' · 刷怪 '+state.spawns.length+' · 安全区 '+state.safeZones.length+(warning?' · '+warning:'')+entityWarning
    : layerText+' · '+(state.markerFile||'未导入标识文件')+' · 标识 '+state.markers.length+(warning?' · '+warning:'');

}

function switchToOriginalMap(){
  if(!state.map||state.original.active)return;
  state.original.active=true;
  mapLayerToggle.textContent='预览地图';
  updateViewModeUi();
  rebuildEntities();
  if(state.original.ready&&state.original.layer){
    state.worldW=Math.max(1,state.original.pixelWidth||state.map.width*48);
    state.worldH=Math.max(1,state.original.pixelHeight||state.map.height*32);
    document.getElementById('mapMeta').textContent=(state.original.fileName||'')+' · '+(state.original.format||'')+' · '+state.worldW+'×'+state.worldH;
    mapLayerToggle.disabled=false;
    renderProgress.hidden=true;
    updateStatus();
    reset100();
    applyPendingNpcReveal(true);
    return;
  }
  state.original.ready=false;
  state.original.layer=null;
  state.original.warning='';
  state.worldW=Math.max(1,state.map.width*48);
  state.worldH=Math.max(1,state.map.height*32);
  mapLayerToggle.disabled=true;
  const requestId=++state.original.requestId;
  setOriginalProgress(1,'正在完整读取原始地图，请耐心等待');

function switchToPreviewMap(){

  state.worldW=state.map&&state.map.width?state.map.width:(state.image?state.image.naturalWidth:1);
  state.worldH=state.map&&state.map.height?state.map.height:(state.image?state.image.naturalHeight:1);
  mapLayerToggle.textContent='原始地图';

function selectEntity(type,entity,shouldRebuild=true){

function revealMerchantNpc(target){

function npcMapDisplay(map){

function selectedNpcTargetMap(){

}

function chooseNpcTargetMap(map){

function matchingNpcMaps(query){
  const normalized=String(query||'').trim().toLowerCase();
  return (state.maps||[]).filter(map=>!normalized||[map.name,map.mapId,map.originalMapId].some(value=>String(value||'').toLowerCase().includes(normalized)))
    .sort((left,right)=>{
      const leftName=String(left.name||'').toLowerCase(),rightName=String(right.name||'').toLowerCase();
      const leftExact=leftName===normalized?0:leftName.startsWith(normalized)?1:2,rightExact=rightName===normalized?0:rightName.startsWith(normalized)?1:2;
      return leftExact-rightExact||leftName.localeCompare(rightName,'zh-CN');
    });
}
function renderNpcMapChoices(query){
  const maps=matchingNpcMaps(query).slice(0,100);npcEditor.mapChoices.textContent='';
  for(const map of maps){
    const button=document.createElement('button');button.type='button';button.className='map-choice'+(map.key===state.npcTargetMapKey?' active':'');button.dataset.key=map.key;
    const name=document.createElement('span');name.className='map-choice-name';name.textContent=map.name;button.appendChild(name);
    const code=document.createElement('span');code.className='map-choice-code';code.textContent=[map.mapId,map.originalMapId].filter((value,index,list)=>value&&list.indexOf(value)===index).join(' / ');button.appendChild(code);
    button.addEventListener('mousedown',event=>{event.preventDefault();chooseNpcTargetMap(map)});npcEditor.mapChoices.appendChild(button);
  }

function buildSpawnFields(spawn){
  spawnFields.textContent='';
  const count=Math.max(spawn.fields.length,state.monGenColumns.length);
  for(let index=0;index<count;index++){
    const label=document.createElement('label');label.className='field';
    const title=document.createElement('span');title.textContent=state.monGenColumns[index]||('扩展参数 '+(index+1));label.appendChild(title);
    const input=document.createElement('input');input.dataset.fieldIndex=String(index);input.value=spawn.fields[index]||'';input.autocomplete='off';
    if(index===1||index===2||index===4){input.type='number';input.min='0';input.step='1'}
    input.addEventListener('input',handleSpawnEditorInput);label.appendChild(input);spawnFields.appendChild(label);
  }
}
function handleNpcEditorInput(event){
  if(state.formSync||state.selectedEntityType!=='npc')return;
  const npc=selectedEntity(),x=Number(npcEditor.x.value),y=Number(npcEditor.y.value);
  const appearanceText=npcEditor.appearance.value.trim(),appearance=Number(appearanceText);
  if(!npc||!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0){setSaveState('坐标必须是整数','error');return}
  if(!appearanceText||!Number.isSafeInteger(appearance)||appearance<0){setSaveState('外观编号必须是整数','error');return}
  const point=clampMapPoint({x,y});
  setEntityCoordinates('npc',npc,point);
  if(npc.appearance!==appearance){
    npc.appearance=appearance;npc.appearanceLabel='正在重新读取外观 '+appearance;
    npcEditor.info.textContent=npc.appearanceLabel;
  }
  npc.iconText=npcEditor.iconText.value;
  if(event&&event.target===npcEditor.iconText)npc.iconDirty=true;
  scheduleEntitySave('npc',npc);
}
function handleSpawnEditorInput(){
  if(state.formSync||state.selectedEntityType!=='spawn')return;
  const spawn=selectedEntity();if(!spawn)return;
  const inputs=[...spawnFields.querySelectorAll('input[data-field-index]')];
  const fields=inputs.map(input=>input.value.trim());
  const x=Number(fields[1]),y=Number(fields[2]),range=Number(fields[4]);
  if(!Number.isInteger(x)||!Number.isInteger(y)||!Number.isInteger(range)||x<0||y<0||range<0){setSaveState('坐标和范围必须是整数','error');return}
  if(fields.some(value=>/\s/.test(value))){setSaveState('字段不能包含空格或换行','error');return}
  const point=clampMapPoint({x,y});fields[1]=String(point.x);fields[2]=String(point.y);
  spawn.fields=fields;spawn.x=point.x;spawn.y=point.y;spawn.monsterName=fields[3]||'';spawn.range=range;
  const node=entityLayer.querySelector('.spawn-entity[data-line="'+spawn.lineNumber+'"]');
  if(node){node.textContent=spawn.monsterName||'未命名怪物';node.title=(spawn.monsterName||'怪物')+' ('+spawn.x+','+spawn.y+') · 范围 '+spawn.range}
  layoutEntities();
  scheduleEntitySave('spawn',spawn);
}
function clampMapPoint(point){
  const maxX=Math.max(0,(state.map&&state.map.width?state.map.width:1)-1);
  const maxY=Math.max(0,(state.map&&state.map.height?state.map.height:1)-1);
  return{x:Math.max(0,Math.min(maxX,Math.round(point.x))),y:Math.max(0,Math.min(maxY,Math.round(point.y)))};
}
function setEntityCoordinates(type,entity,point){
  if(!entity||!point)return false;
  const normalized=clampMapPoint(point),changed=entity.x!==normalized.x||entity.y!==normalized.y;
  entity.x=normalized.x;entity.y=normalized.y;
  if(type==='spawn'){entity.fields[1]=String(normalized.x);entity.fields[2]=String(normalized.y)}
  if(state.selectedEntityType===type&&state.selectedEntityLine===entity.lineNumber){
    state.formSync=true;
    if(type==='npc'){npcEditor.x.value=String(normalized.x);npcEditor.y.value=String(normalized.y)}
    else{
      const xInput=spawnFields.querySelector('[data-field-index="1"]'),yInput=spawnFields.querySelector('[data-field-index="2"]');
      if(xInput)xInput.value=String(normalized.x);if(yInput)yInput.value=String(normalized.y);
    }
    state.formSync=false;
  }
  layoutEntities();
  return changed;
}
function scheduleEntitySave(type,entity,immediate=false){
  clearTimeout(state.entitySaveTimer);
  setSaveState('待保存','saving');
  state.entitySaveTimer=setTimeout(()=>postEntitySave(type,entity),immediate?0:280);
}
function postEntitySave(type,entity){
  if(!entity)return;
  const requestId=++state.entityRequest;state.entityPendingRequest=requestId;setSaveState('保存中','saving');
  if(type==='npc'){
    const npc={lineNumber:entity.lineNumber,x:entity.x,y:entity.y,appearance:entity.appearance};
    if(entity.iconDirty===true)npc.iconText=entity.iconText||'';
    vscode.postMessage({type:'updateNpc',requestId,npc});
  }
  else vscode.postMessage({type:'updateSpawn',requestId,spawn:{lineNumber:entity.lineNumber,fields:entity.fields}});
}
function beginEntityDrag(event,type,entity){

function nudgeSelectedEntity(deltaX,deltaY){

function updateCanvasCursor(){

function mapPointFromClient(clientX,clientY,requireInside){
  const rect=viewport.getBoundingClientRect();
  const rawX=(clientX-rect.left-state.offsetX)/state.scale;
  const rawY=(clientY-rect.top-state.offsetY)/state.scale;
  if(requireInside&&(rawX<0||rawY<0||rawX>=state.worldW||rawY>=state.worldH))return null;
  const mapWidth=state.map&&state.map.width?state.map.width:state.worldW;
  const mapHeight=state.map&&state.map.height?state.map.height:state.worldH;
  const mapX=state.original.active?rawX/48:rawX;
  const mapY=state.original.active?rawY/32:rawY;
  return{
    x:Math.max(0,Math.min(Math.max(0,mapWidth-1),Math.round(mapX))),
    y:Math.max(0,Math.min(Math.max(0,mapHeight-1),Math.round(mapY)))
  };
}
function setMarkerCoordinates(marker,point){
  if(!marker||!point)return false;
  const changed=marker.x!==point.x||marker.y!==point.y;
  marker.x=point.x;
  marker.y=point.y;
  if(marker.lineNumber===state.selectedLine){
    state.formSync=true;
    editor.x.value=String(point.x);
    editor.y.value=String(point.y);
    state.formSync=false;
  }
  renderMarkers();
  return changed;
}
function saveMarkerCoordinates(marker){
  if(!marker)return;
  state.editVersion++;

function scheduleSave(marker,version){

function flushPendingSave(){

  const pending=state.pendingDraft;

  if(!state.map)return false;
  const key=String(marker.mapName||'').trim().toLowerCase();

function normalizeColor(value){
  const source=String(value||'').trim();
  const normalized=source.replace(/^(?:\$|#|0x)/i,'');
  if(/^[0-9a-f]{6}$/i.test(normalized)){
    if(source.startsWith('$'))return('#'+normalized.slice(4,6)+normalized.slice(2,4)+normalized.slice(0,2)).toUpperCase();
    return('#'+normalized).toUpperCase();
  }
  const palette={249:'#FF9900',250:'#66CCFF',251:'#999999',252:'#FF6666',253:'#33FF66',254:'#FFFF33',255:'#FFFFFF'};
  return palette[normalized]||'#FFFFFF';
}
function cssToEngineColor(value){
  const hex=String(value||'').replace('#','').toUpperCase();
  if(!/^[0-9A-F]{6}$/.test(hex))return'$FFFFFF';
  return'$'+hex.slice(4,6)+hex.slice(2,4)+hex.slice(0,2);
}
function cleanDisplayText(value){
  const withoutHints=String(value||'').replace(/\{[^{}]*\|[^{}]*\}/g,'');
  const withoutImages=withoutHints.replace(/<(?:IMG|PLAYIMG):[^>]*>/gi,'');
  return withoutImages.replace(/\\([<>\[\]])/g,'$1').trim()||'图标';
}
function nudgeSelectedMarker(deltaX,deltaY){
  if(!state.selectedLine||state.pendingDeleteRequest)return;
  const marker=state.markers.find(item=>item.lineNumber===state.selectedLine);
  if(!marker)return;
  const maxX=Math.max(0,(state.map&&state.map.width?state.map.width:state.worldW)-1);
  const maxY=Math.max(0,(state.map&&state.map.height?state.map.height:state.worldH)-1);
  const point={
    x:Math.max(0,Math.min(maxX,marker.x+deltaX)),
    y:Math.max(0,Math.min(maxY,marker.y+deltaY))
  };
  if(setMarkerCoordinates(marker,point))saveMarkerCoordinates(marker);
}

function originalImage(meta){
  const cached=state.original.imageCache.get(meta.url);
  if(cached)return cached;
  const image=new Image();
  const record={image,promise:null,failed:false};
  record.promise=new Promise(resolve=>{
    image.onload=()=>resolve(record);
    image.onerror=()=>{record.failed=true;resolve(record)};
  });
  image.src=meta.url;
  state.original.imageCache.set(meta.url,record);
  return record;
}
async function loadOriginalMapData(data){
  if(!state.original.active||data.requestId!==state.original.requestId)return;
  const metas=Array.isArray(data.resources)?data.resources:[];
  const loaded=new Array(metas.length);
  let cursor=0,completed=0,failed=0;
  setOriginalProgress(81,metas.length?'正在完整加载地图图片，请耐心等待':'完整地图没有可绘制素材');
  async function worker(){
    while(cursor<metas.length){
      const index=cursor++,meta=metas[index],record=originalImage(meta);
      await record.promise;
      if(record.failed)failed++;
      else loaded[index]={meta,image:record.image};
      completed++;
      if(state.original.active&&data.requestId===state.original.requestId){
        setOriginalProgress(81+(completed/Math.max(1,metas.length))*18,'正在完整加载地图图片 '+completed+'/'+metas.length);
      }
    }
  }
  const workers=[];
  for(let i=0;i<Math.min(8,Math.max(1,metas.length));i++)workers.push(worker());
  await Promise.all(workers);
  if(!state.original.active||data.requestId!==state.original.requestId)return;
  state.original.layer={
    resources:loaded,
    tiles:Array.isArray(data.tiles)?data.tiles:[],
    smTiles:Array.isArray(data.smTiles)?data.smTiles:[],
    objects:Array.isArray(data.objects)?data.objects:[]
  };
  state.original.warning=data.warning||'';
  if(failed)state.original.warning+=(state.original.warning?'；':'')+failed+' 张图片加载失败';
  state.original.ready=true;
  mapLayerToggle.disabled=false;
  updateStatus();
  updateNpcJumpBar();
  updateMapNavigatorVisibility();
  render();
  applyPendingNpcReveal(true);
  finishOriginalProgress('完整原始地图加载完成');
}
window.addEventListener('resize',resize);
window.addEventListener('message',event=>{
  const data=event.data;
  if(data.type==='mapData'){
    updateMap(data);
    return;
  }
  if(data.type==='revealMerchantNpc'){
    revealMerchantNpc(data.npc);
    return;
  }
  if(data.type==='originalMapProgress'){
    if(state.original.active&&data.requestId===state.original.requestId){
      setOriginalProgress(data.percent,data.label);
    }
    return;
  }
  if(data.type==='originalMapReady'){
    if(!state.original.active||data.requestId!==state.original.requestId)return;
    state.original.ready=false;
    state.original.fileName=data.fileName||'';
    state.original.format=data.format||'';
    state.original.pixelWidth=Math.max(1,Number(data.pixelWidth)||state.map.width*48);
    state.original.pixelHeight=Math.max(1,Number(data.pixelHeight)||state.map.height*32);
    state.worldW=state.original.pixelWidth;
    state.worldH=state.original.pixelHeight;
    document.getElementById('mapMeta').textContent=(data.fileName||'')+' · '+(data.format||'')+' · '+state.worldW+'×'+state.worldH;
    mapLayerToggle.disabled=true;
    reset100();
    updateMapNavigatorVisibility();
    applyPendingNpcReveal(false);
    return;
  }
  if(data.type==='originalMapData'){
    void loadOriginalMapData(data);
    return;
  }
  if(data.type==='originalMapError'){
    if(!state.original.active)return;
    state.original.warning=data.message||'原始地图绘制失败';
    state.original.ready=false;
    mapLayerToggle.disabled=false;
    updateMapNavigatorVisibility();
    setOriginalProgress(100,state.original.warning);
    updateStatus();
    return;
  }
  if(data.type==='npcSaved'||data.type==='spawnSaved'){
    if(data.type==='npcSaved'&&data.npc){
      const index=state.npcs.findIndex(item=>item.lineNumber===Number(data.npc.lineNumber));
      if(index>=0){
        state.npcs[index]=data.npc;rebuildEntities();updateNpcJumpBar();
        if(data.requestId===state.entityPendingRequest&&state.selectedEntityType==='npc'&&state.selectedEntityLine===Number(data.npc.lineNumber)){
          showSelectedEntityEditor();
        }
      }
    }
    if(data.requestId===state.entityPendingRequest){
      setSaveState('已保存','saved');
    }
    return;
  }
  if(data.type==='entitySaveError'){
    if(data.requestId===state.entityPendingRequest)setSaveState(data.message||'保存失败','error');
    return;
  }
  if(data.type==='npcMoveError'){
    if(data.requestId===state.pendingNpcMoveRequest){
      state.pendingNpcMoveRequest=0;updateNpcMoveButton();setSaveState(data.message||'切换地图失败','error');
    }
    return;
  }
  if(data.type==='markerSaved'){
    const version=state.requestVersions.get(data.requestId);
    state.requestVersions.delete(data.requestId);
    if(data.requestId===state.pendingRequest&&version===state.editVersion)setSaveState('已保存','saved');
    return;
  }
  if(data.type==='markerSaveError'){
    state.requestVersions.delete(data.requestId);
    if(data.requestId===state.pendingRequest)setSaveState(data.message||'保存失败','error');
    return;
  }
  if(data.type==='markersAdded'){
    if(data.requestId!==state.pendingAddRequest)return;
    const added=(data.markers||[]).filter(markerBelongsToCurrentMap);
    state.markers.push(...added);
    updateStatus();
    const preferred=added.find(marker=>marker.mode===0)||added[0];
    closeAddMarkerForm();
    resetAddMarkerForm();
    if(preferred){
      selectMarkerMode(preferred.mode);
      selectMarker(preferred);
      setSaveState('新增标识已保存','saved');
    }
    renderMarkers();
    return;
  }
  if(data.type==='markersAddError'){
    if(data.requestId!==state.pendingAddRequest)return;
    confirmAddMarker.disabled=false;
    setAddState(data.message||'添加失败','error');
    return;
  }
  if(data.type==='markerDeleted'){
    if(data.requestId!==state.pendingDeleteRequest)return;
    const oldIndex=state.markers.findIndex(marker=>marker.lineNumber===data.lineNumber);
    state.pendingDeleteRequest=0;
    deleteMarker.disabled=false;
    state.markers=data.markers||[];
    state.pendingRequest=0;
    state.requestVersions.clear();
    updateStatus();
    const next=state.markers[Math.min(Math.max(0,oldIndex),Math.max(0,state.markers.length-1))];
    selectMarker(next);
    if(next)setSaveState('已删除','saved');
    renderMarkers();
    return;
  }
  if(data.type==='markerDeleteCancelled'){
    if(data.requestId!==state.pendingDeleteRequest)return;
    state.pendingDeleteRequest=0;
    deleteMarker.disabled=false;
    setSaveState('已取消','');
    return;
  }
  if(data.type==='markerDeleteError'){
    if(data.requestId!==state.pendingDeleteRequest)return;
    state.pendingDeleteRequest=0;
    deleteMarker.disabled=false;
    setSaveState(data.message||'删除失败','error');
  }
});
resize();
vscode.postMessage({type:'ready'});
</script>
</body>
