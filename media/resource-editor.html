<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOO 资源工作台</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#191d24; --surface:#222731; --border:#343e4d; --text:#e6eaf0; --muted:#a1aab9; --accent:#91b9ff; --primary:#3778e5; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); color:var(--text); font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:5px; min-width:0; }
    button { padding:6px 10px; cursor:pointer; white-space:nowrap; }
    button:hover:not(:disabled) { background:#303b4c; border-color:#5b7191; }
    button:disabled { opacity:.42; cursor:not-allowed; }
    button.primary { background:var(--primary); border-color:var(--primary); color:white; }
    button.primary:hover:not(:disabled) { background:#4988f1; border-color:#4988f1; }
    input,select { padding:5px 7px; }
    input[type=checkbox] { accent-color:var(--primary); }
    :is(button,input,select):focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    [hidden] { display:none !important; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background:#435067; border-radius:8px; border:2px solid var(--panel); }
    .topbar { min-height:64px; flex:none; display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
    .brand { width:36px; height:36px; object-fit:contain; border-radius:8px; flex:none; }
    h1 { margin:0; font-size:14px; font-weight:600; }
    .title-block { min-width:0; }
    #archiveName { color:var(--muted); font-size:11px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; max-width:54vw; }
    .phase { margin-left:auto; flex:none; color:#b4c8e8; font-size:11px; border:1px solid #40516b; border-radius:20px; padding:3px 10px; }
    .phase.dirty { color:#edc480; border-color:#796345; }
    .edit-toolbar { flex:none; min-height:43px; padding:7px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; background:#161c25; border-bottom:1px solid var(--border); }
    .edit-toolbar button { font-size:11px; padding:5px 9px; }
    .edit-toolbar .separator { width:1px; height:20px; background:var(--border); margin:0 3px; }
    .edit-toolbar .spacer { flex:1; }
    .edit-toolbar .danger { color:#e8a4a4; }
    #beginEdit { font-size:11px; padding:5px 9px; }
    .edit-notice { flex:none; padding:8px 12px; color:#edc480; background:#30291d; border-bottom:1px solid #796345; overflow-wrap:anywhere; }
    .workspace { flex:1; min-height:0; display:grid; grid-template-columns:320px minmax(0,1fr) 230px; }
    .panel { min-width:0; min-height:0; background:var(--panel); display:flex; flex-direction:column; }
    .browser { border-right:1px solid var(--border); }
    .metadata { border-left:1px solid var(--border); overflow-y:auto; }
    .heading { margin:0; padding:12px; font-size:12px; font-weight:600; border-bottom:1px solid var(--border); }
    .locator { display:flex; align-items:center; gap:6px; padding:10px 12px; }
    .locator label { color:var(--muted); font-size:11px; }
    .locator input { flex:1; width:80px; }
    .page-tools { display:flex; align-items:center; justify-content:space-between; gap:5px; padding:0 12px 10px; }
    .page-tools button { font-size:11px; padding:4px 7px; }
    #pageInfo { font:11px/1.5 Consolas,monospace; color:var(--muted); text-align:center; }
    .selection-tools { display:flex; align-items:center; gap:6px; padding:8px 12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
    .selection-tools button { padding:3px 6px; font-size:11px; }
    #selectionCount { margin-left:auto; color:var(--muted); font-size:11px; }
    #slots { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); grid-auto-rows:78px; align-content:start; gap:6px; padding:10px; }
    .slot { min-width:0; position:relative; padding:5px; border:1px solid var(--border); background:#202630; border-radius:5px; display:flex; flex-direction:column; align-items:center; gap:3px; }
    .slot:hover { background:#293342; }
    .slot.selected { border-color:#83adf0; background:#293e60; }
    .slot.focused { outline:2px solid #e8ba67; outline-offset:-2px; }
    .slot img,.slot-placeholder { height:44px; width:100%; object-fit:contain; image-rendering:pixelated; }
    .slot-placeholder { display:grid; place-items:center; color:#a4afc0; font-size:10px; }
    .slot-label { color:#bdc9dc; max-width:100%; overflow:hidden; text-overflow:ellipsis; font:10px/15px Consolas,monospace; }
    .slot[data-status=corrupt] .slot-placeholder,.slot[data-status=unsupported] .slot-placeholder { color:#e4aaa8; }
    .selection-mark { position:absolute; right:3px; top:1px; color:#c9dcff; background:#254168; border-radius:3px; font-size:10px; padding:0 3px; }
    .modified-mark { position:absolute; left:4px; top:0; color:#edc480; font-size:14px; line-height:16px; }
    .browser-hint { color:#8996ab; font-size:10px; padding:6px 12px; border-top:1px solid var(--border); flex:none; }
    .preview { display:flex; flex-direction:column; min-width:0; min-height:0; }
    .preview-tools { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:48px; padding:9px 12px; border-bottom:1px solid var(--border); background:#161a20; flex:none; }
    .preview-tools label { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; }
    .preview-tools select { font-size:11px; padding:4px 5px; }
    .preview-tools button { font-size:11px; padding:4px 7px; }
    #animationView { flex:1; min-height:0; overflow:auto; display:grid; place-items:center; background:#292e36; }
    #animationCanvas { image-rendering:pixelated; max-width:100%; max-height:100%; object-fit:contain; }
    .animation-controls { padding:6px 10px; display:flex; flex-wrap:wrap; align-items:center; gap:5px; border-top:1px solid var(--border); }
    .animation-controls input { width:58px; }
    #referenceFields { display:flex; gap:4px; align-items:center; }
    #referenceFields input { width:52px; }
    #previewViewport { flex:1; min-width:0; min-height:0; overflow:auto; position:relative; cursor:grab; background-color:#343941; background-image:conic-gradient(#444b55 25%,transparent 0 50%,#444b55 0 75%,transparent 0); background-size:20px 20px; touch-action:none; }
    #previewViewport[data-background=black] { background:#000; }
    #previewViewport[data-background=white] { background:#fff; }
    #previewViewport.dragging { cursor:grabbing; user-select:none; }
    #previewAnchor { min-width:100%; min-height:100%; width:max-content; display:flex; align-items:center; justify-content:center; padding:32px; }
    #previewStage { position:relative; flex:none; }
    #previewImage { position:absolute; display:block; max-width:none; image-rendering:pixelated; pointer-events:none; user-select:none; }
    #previewOrigin { position:absolute; width:1px; height:1px; pointer-events:none; z-index:1; }
    #previewOrigin:before,#previewOrigin:after { content:""; position:absolute; background:#ff6969; box-shadow:0 0 1px #000; }
    #previewOrigin:before { width:17px; height:1px; left:-8px; }
    #previewOrigin:after { width:1px; height:17px; top:-8px; }
    #previewEmpty { margin:0; color:#c4cddb; background:#1a202ddd; padding:9px 14px; border-radius:5px; font-size:12px; }
    .preview-note { min-height:30px; padding:6px 12px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }
    dl { display:grid; grid-template-columns:62px minmax(0,1fr); gap:10px 8px; margin:0; padding:14px 12px; font-size:11px; }
    dt { color:var(--muted); }
    dd { margin:0; overflow-wrap:anywhere; color:#d5dfec; }
    .offset-input { width:100%; font-size:11px; padding:4px 6px; }
    #applyOffsetsEdit { width:100%; padding:4px 6px; font-size:11px; }
    .export-section { padding:12px; border-top:1px solid var(--border); margin-top:auto; }
    .export-section h2 { margin:0 0 10px; font-size:12px; font-weight:600; }
    #exportMode { width:100%; }
    #rangeFields { display:grid; grid-template-columns:minmax(0,1fr) 12px minmax(0,1fr); gap:4px; align-items:center; margin-top:8px; }
    #rangeFields input { width:100%; }
    .export-actions { display:flex; gap:6px; margin-top:10px; }
    #exportButton { flex:1; }
    .export-hint { color:var(--muted); font-size:10px; margin:8px 0 0; }
    .statusbar { flex:none; min-height:30px; display:flex; align-items:center; gap:12px; padding:5px 12px; border-top:1px solid var(--border); background:#171c24; font-size:11px; }
    #statusText { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #archiveSummary { color:var(--muted); flex:none; }
    @media(max-width:1100px) { .workspace { grid-template-columns:300px minmax(0,1fr) 206px; } .topbar { padding:9px 12px; } }
    @media(max-width:940px) { .workspace { grid-template-columns:280px minmax(0,1fr) 190px; } .preview-tools { gap:5px; padding:8px; } .preview-tools label { font-size:10px; } .phase { padding:3px 8px; } #slots { gap:4px; padding:8px; } dl { grid-template-columns:52px minmax(0,1fr); } }
    @media(prefers-reduced-motion:reduce) { * { transition:none !important; scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <header class="topbar"><img id="brandIcon" class="brand" src="{{ICON_URI}}" alt="BOO"><div class="title-block"><h1>资源工作台</h1><div id="archiveName">等待资源</div></div><span class="phase" id="phaseLabel">浏览 / 导出</span><button id="beginEdit" hidden disabled title="由宿主逐图核验后开启编辑">开启编辑</button></header>
  <div id="editNotice" class="edit-notice" role="alert" hidden></div>
  <nav id="editToolbar" class="edit-toolbar" aria-label="资源编辑" hidden>
    <button id="batchTools" disabled title="批量导入、偏移、复制粘贴和图像变换">批量 / 工具</button>
    <button id="cancelBatch" hidden>取消批任务</button>
    <button id="replaceImage" disabled title="导入图片，替换当前槽">替换</button><button id="fillSlot" disabled title="导入图片，填充当前空槽">填空</button><button id="appendImage" disabled title="导入图片，追加到末尾">追加</button><button id="clearSlot" class="danger" disabled title="清空当前槽，后续 ID 不变">清空当前槽</button>
    <span class="separator" aria-hidden="true"></span><button id="undoEdit" disabled>撤销</button><button id="redoEdit" disabled>重做</button><span class="spacer"></span><button id="saveAs" class="primary" disabled>另存新包</button><button id="endEdit" disabled>结束编辑</button>
  </nav>
  <main class="workspace">
    <section class="panel browser" aria-label="素材列表">
      <h2 class="heading">素材列表</h2>
      <form id="locator" class="locator"><label for="slotId">ID</label><input id="slotId" type="number" min="0" step="1" placeholder="定位素材" aria-label="素材ID"><button id="jumpButton" type="submit" disabled>定位</button></form>
      <div class="page-tools"><button id="previousPage" disabled>上一页</button><span id="pageInfo">0 / 0</span><button id="nextPage" disabled>下一页</button></div>
      <div class="selection-tools"><button id="selectPage" disabled>选本页</button><button id="clearSelection" disabled>清选择</button><span id="selectionCount">已选 0</span></div>
      <div id="slots" role="group" aria-label="当前页素材"></div>
      <div class="browser-hint">Ctrl 多选 · Shift 连选 · 每页 100</div>
    </section>
    <section class="preview" aria-label="图像预览">
      <div class="preview-tools"><label>背景<select id="backgroundMode" aria-label="预览背景"><option value="checker">棋盘</option><option value="black">黑色</option><option value="white">白色</option></select></label><label>缩放<select id="zoom" aria-label="图像缩放"><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option><option value="4">400%</option><option value="8">800%</option></select></label><label><input id="applyOffsets" type="checkbox" checked>偏移 / 原点</label><button id="openAnimation" disabled>动画</button><button id="openReference" disabled title="动画参照图，仅预览">参照图</button></div>
      <div id="animationView" hidden><canvas id="animationCanvas"></canvas></div>
      <div id="animationControls" class="animation-controls" hidden><button id="playAnimation">播放</button><button id="previousFrame">上一帧</button><button id="nextFrame">下一帧</button><label>FPS <input id="animationFps" type="number" min="1" max="60" value="10"></label><span id="animationIndex"></span><button id="exportAnimation">APNG</button><button id="closeAnimation">返回</button><div id="referenceFields" hidden><label>X <input id="referenceX" type="number" value="0" min="-32768" max="32767"></label><label>Y <input id="referenceY" type="number" value="0" min="-32768" max="32767"></label><label>透明度 <input id="referenceOpacity" type="number" value="50" min="0" max="100"></label><button id="clearReference">移除</button></div></div>
      <div id="previewViewport" data-background="checker" aria-label="图像视口，可拖动平移" tabindex="0"><div id="previewAnchor"><div id="previewStage" hidden><img id="previewImage" alt="选中素材" draggable="false"><span id="previewOrigin"></span></div><p id="previewEmpty">选择素材查看原图</p></div></div>
      <div id="previewNote" class="preview-note">拖动预览平移，不修改素材坐标</div>
    </section>
    <aside class="panel metadata" aria-label="素材信息">
      <h2 class="heading">素材信息 <span id="metadataMode" style="color:var(--muted);font-size:10px;font-weight:400">只读</span></h2>
      <dl><dt>ID</dt><dd id="metaIndex">—</dd><dt>状态</dt><dd id="metaStatus">—</dd><dt>尺寸</dt><dd id="metaSize">—</dd><dt>偏移 X</dt><dd><span id="metaOffsetX">—</span><input id="editOffsetX" class="offset-input" type="number" min="-32768" max="32767" step="1" aria-label="编辑偏移X" hidden disabled></dd><dt>偏移 Y</dt><dd><span id="metaOffsetY">—</span><input id="editOffsetY" class="offset-input" type="number" min="-32768" max="32767" step="1" aria-label="编辑偏移Y" hidden disabled></dd><dt id="offsetActionLabel" hidden>坐标</dt><dd id="offsetActionRow" hidden><button id="applyOffsetsEdit" disabled>应用坐标</button></dd><dt>像素</dt><dd id="metaPixel">—</dd><dt>压缩</dt><dd id="metaCompression">—</dd><dt>Alpha</dt><dd id="metaAlpha">—</dd><dt>格式</dt><dd id="metaFormat">—</dd><dt>分支</dt><dd id="metaProfile">—</dd></dl>
      <section class="export-section" aria-label="导出资源"><h2>导出</h2><select id="exportMode" aria-label="导出范围"><option value="current">当前素材</option><option value="selected">已选素材</option><option value="range">ID 范围</option><option value="all">全部素材</option></select><div id="rangeFields" hidden><input id="rangeStart" type="number" min="0" step="1" value="0" aria-label="起始ID"><span>—</span><input id="rangeEnd" type="number" min="0" step="1" value="0" aria-label="结束ID"></div><div class="export-actions"><button id="exportButton" class="primary" disabled>导出</button><button id="cancelExport" hidden>取消</button></div><p id="exportHint" class="export-hint">仅导出副本，原包保持不变</p></section>
    </aside>
  </main>
  <footer class="statusbar"><span id="statusText" role="status" aria-live="polite">正在连接资源</span><span id="archiveSummary"></span></footer>
  <script>
  (function () {
    'use strict';
    const api = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : { postMessage() {}, getState() {}, setState() {} };
    const $ = id => document.getElementById(id);
    const PAGE_SIZE = 100, MAX_SELECTION = 10000;
    const documentId = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : 'view-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    let sessionId = '', sequence = 0, start = 0, slotCount = 0, slots = [], selected = new Set(), focused = null, anchor = null;
    let detail = null, detailRequest = 0, navigationRequest = 0, busy = false, restored = false, previewRevision = 0;
    let editActive = false, editRevision = 0, canStartEdit = false, dirty = false, canUndo = false, canRedo = false, capabilities = {};
    let canExport = true, pendingEdit = false, mutationRequest = 0, mutationType = '', offsetSlot = null;
    let animation = null, animationTicket = 0, animationRequest = 0, animationFrame = 0, animationTimer = 0, referenceImage = null;
    const retiredSessions = new Set();
    const saved = typeof api.getState === 'function' ? api.getState() : null;
    const statuses = { decoded:'可用', recovered:'已恢复', 'indexed-unverified':'待验证', present:'可用', ready:'可用', empty:'空槽', blank:'空槽', corrupt:'损坏', unsupported:'不支持', error:'读取失败', missing:'缺失', unknown:'未检查' };
    const statusName = status => statuses[status] || String(status || '未检查');
    const validId = value => Number.isSafeInteger(value) && value >= 0 && value < slotCount;
    function numericInput(input) { const value = input.value.trim(); return /^\d+$/.test(value) && Number.isSafeInteger(Number(value)) ? Number(value) : null; }
    function offsetInput(input) { const text=input.value.trim(),value=Number(text); return /^-?\d+$/.test(text)&&Number.isSafeInteger(value)&&value>=-32768&&value<=32767?value:null; }
    function message(text) { $('statusText').textContent = text; $('statusText').title = text; }
    function send(type, extra) {
      if (!sessionId) return 0;
      const requestId = ++sequence;
      api.postMessage(Object.assign({ type, documentId, sessionId, requestId }, extra || {}));
      return requestId;
    }
    function persist() {
      if (sessionId && typeof api.setState === 'function') api.setState({ version:1, sessionId, start, selectedIds:Array.from(selected), focusIndex:focused });
    }
    function safeImageUrl(value) {
      if (typeof value !== 'string' || !value) return '';
      if (/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(value)) return value;
      try {
        const url = new URL(value);
        if (url.username || url.password) return '';
        if (['boo-archive:', 'vscode-webview-resource:', 'vscode-resource:'].includes(url.protocol)) return value;
        // asWebviewUri maps scheme + encoded authority into one exact resource host.
        if (url.protocol === 'https:' && !url.port && /^(?:boo-archive|file)\+[a-z0-9-]*\.vscode-resource\.vscode-cdn\.net$/i.test(url.hostname)) return value;
        if (url.origin === location.origin && ['https:', 'http:'].includes(url.protocol)) return value;
      } catch (_) { /* Host resources only; do not resolve arbitrary relative or file URLs. */ }
      return '';
    }
    function updateControls() {
      $('previousPage').disabled = !sessionId || start <= 0;
      $('nextPage').disabled = !sessionId || start + PAGE_SIZE >= slotCount;
      $('jumpButton').disabled = !sessionId || slotCount === 0;
      $('selectPage').disabled = slots.length === 0;
      $('clearSelection').disabled = selected.size === 0;
      $('selectionCount').textContent = '已选 ' + selected.size;
      $('pageInfo').textContent = slotCount ? (Math.floor(start / PAGE_SIZE) + 1) + ' / ' + Math.ceil(slotCount / PAGE_SIZE) : '0 / 0';
      $('pageInfo').title = '当前页 / 总页数；每页 100 个槽位，向下滚动查看本页全部素材';
      $('archiveSummary').textContent = slotCount + ' 槽';
      const mode = $('exportMode').value;
      const exportBlocked = editActive || !canExport || pendingEdit;
      $('openAnimation').disabled = !sessionId || !slotCount || busy || pendingEdit;
      $('openReference').disabled = !sessionId || busy || pendingEdit;
      $('exportAnimation').disabled = !animation || busy || pendingEdit;
      $('exportButton').disabled = exportBlocked || busy || !slotCount || (mode === 'current' && !validId(focused)) || (mode === 'selected' && !selected.size);
      $('exportMode').disabled = exportBlocked || busy;
      $('rangeStart').disabled = exportBlocked || busy; $('rangeEnd').disabled = exportBlocked || busy;
      $('cancelExport').hidden = exportBlocked || !busy;
      $('exportButton').textContent = busy && !exportBlocked ? '导出中' : '导出';
      $('exportHint').textContent = editActive ? '结束编辑后导出' : '仅导出副本，原包保持不变';
      $('beginEdit').hidden = editActive || !canStartEdit;
      $('beginEdit').disabled = !canStartEdit || editActive || busy || pendingEdit;
      $('beginEdit').textContent = pendingEdit && mutationType==='beginEdit' ? '正在核验' : '开启编辑';
      $('editToolbar').hidden = !editActive;
      $('phaseLabel').textContent = editActive ? dirty ? '编辑 · 未保存' : '编辑副本' : '浏览 / 导出';
      $('phaseLabel').classList.toggle('dirty',editActive&&dirty);
      $('metadataMode').textContent = editActive ? '编辑副本' : '只读';
      const current = detail && detail.index===focused ? detail : slots.find(slot=>slot.index===focused);
      const empty = current && ['empty','blank'].includes(current.status);
      const present = !!current && !['empty','blank','unknown','corrupt','unsupported','error','missing'].includes(current.status);
      const blocked = !editActive || busy || pendingEdit;
      $('batchTools').disabled = blocked;
      $('replaceImage').disabled = blocked || capabilities.canReplace!==true || !present;
      $('fillSlot').disabled = blocked || capabilities.canFill!==true || !empty;
      $('appendImage').disabled = blocked || capabilities.canAppend!==true;
      $('clearSlot').disabled = blocked || capabilities.canClear!==true || !present;
      $('undoEdit').disabled = blocked || !canUndo; $('redoEdit').disabled = blocked || !canRedo;
      $('saveAs').disabled = blocked || capabilities.canSaveAs!==true;
      $('endEdit').disabled = blocked;
      const offsetVisible = editActive && capabilities.canOffsets===true;
      $('editOffsetX').hidden = !offsetVisible; $('editOffsetY').hidden = !offsetVisible;
      $('metaOffsetX').hidden = offsetVisible; $('metaOffsetY').hidden = offsetVisible;
      $('offsetActionLabel').hidden = !offsetVisible; $('offsetActionRow').hidden = !offsetVisible;
      $('editOffsetX').disabled = blocked || !present; $('editOffsetY').disabled = blocked || !present;
      $('applyOffsetsEdit').disabled = blocked || !present;
    }
    function editIntent(type,extra) {
      if (!sessionId || busy || pendingEdit || (type==='beginEdit' ? !canStartEdit||editActive : !editActive)) return;
      pendingEdit=true; mutationType=type;
      $('editNotice').hidden=true; $('editNotice').textContent='';
      mutationRequest=send(type,Object.assign(type==='beginEdit'?{}:{revision:editRevision},extra||{}));
      // Replies started before a mutation cannot repaint a later editing revision.
      detailRequest=0; updateControls();
      message(type==='beginEdit'?'正在核验编辑能力':type==='saveAs'?'等待选择新包位置':type==='endEdit'?'正在结束编辑':'正在处理编辑操作');
    }
    function paintSelection() {
      $('slots').querySelectorAll('.slot').forEach(node => {
